<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📱 Marijose Jhire S.A. - Sistema de Gestión</title>
    <style>
        * { box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; }
        body { background: #d9e9f5; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; padding: 12px; }
        .app { max-width: 950px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 10px 30px rgba(0,20,30,0.2); overflow: hidden; margin: 8px 0; }
        .header-main { background: #075e54; color: white; padding: 20px 24px; display: flex; align-items: center; justify-content: center; gap: 16px; border-bottom: 4px solid #25d366; }
        .header-main .logo { font-size: 2.8rem; }
        .header-main .title-container h1 { font-size: 1.6rem; margin: 0 0 4px 0; font-weight: 700; letter-spacing: 0.5px; }
        .header-main .title-container p { font-size: 0.9rem; margin: 0; opacity: 0.9; }
        .tabs { display: flex; background: #f0f7fc; border-bottom: 1px solid #cbddee; flex-wrap: wrap; }
        .tab { flex: 1 1 auto; padding: 14px 8px; font-weight: 600; font-size: 0.95rem; text-align: center; color: #1e3b4f; cursor: pointer; border-bottom: 4px solid transparent; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 4px; }
        .tab.active { color: #075e54; border-bottom-color: #25d366; background: #ffffff; }
        .content { padding: 20px 24px; background: #ffffff; }
        h2 { font-size: 1.5rem; margin: 0 0 16px 0; font-weight: 600; color: #075e54; border-left: 6px solid #25d366; padding-left: 14px; }
        fieldset { border: 1px solid #c9ddec; border-radius: 20px; padding: 16px 14px; margin-bottom: 20px; background: #f5faff; }
        legend { font-weight: 600; background: white; padding: 2px 16px; border-radius: 40px; border: 1px solid #25d366; color: #075e54; font-size: 0.9rem; }
        label { display: block; margin-bottom: 14px; font-weight: 500; color: #1e3b4f; font-size: 0.95rem; }
        input[type="text"], input[type="number"], input[type="date"], input[type="tel"], input[type="email"], select, textarea { width: 100%; padding: 12px 16px; border: 1px solid #b0c7da; border-radius: 40px; font-size: 1rem; margin-top: 4px; background: white; }
        input:focus, select:focus { border-color: #25d366; outline: none; box-shadow: 0 0 0 3px rgba(37,211,102,0.2); }
        input[readonly], select:disabled { background-color: #e9ecef; color: #6c757d; cursor: not-allowed; border-color: #ced4da; }
        button { background: #25d366; border: none; color: white; font-weight: 600; padding: 12px 20px; border-radius: 40px; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; border: 1px solid #1a8a4a; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin: 4px 4px 4px 0; display: inline-flex; justify-content: center; align-items: center; text-align: center; min-width: 150px; }
        button.secondary { background: #eaf0f6; color: #1f3a57; border: 1px solid #a0b9cf; }
        button.small { padding: 8px 14px; font-size: 0.85rem; min-width: auto; }
        button.danger { background: #dc3545; color: white; border-color: #a71d2a; }
        .btn-upload-label { background: #eaf0f6; color: #1f3a57; border: 1px solid #a0b9cf; font-weight: 600; padding: 11px 20px; border-radius: 40px; font-size: 0.95rem; cursor: pointer; transition: background 0.2s; margin: 4px 4px 4px 0; display: inline-flex; justify-content: center; align-items: center; text-align: center; min-width: 150px; }
        .action-buttons { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
        .search-section { background: #e3f0fa; border-radius: 24px; padding: 16px; margin-bottom: 20px; display: flex; flex-direction: column; gap: 12px; }
        .client-list { max-height: 300px; overflow-y: auto; border-radius: 20px; background: white; padding: 4px; }
        .client-item { background: #ffffff; border: 1px solid #cde0ed; border-radius: 40px; padding: 12px 16px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 0.9rem; }
        .client-item:hover { background: #e2f3e9; }
        .badge { background: #d9f0e3; color: #075e54; border-radius: 40px; padding: 8px 16px; font-size: 0.9rem; font-weight: 500; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { background: #c9ecdc; color: #075e54; padding: 12px 8px; text-align: left; }
        td { padding: 8px 8px; border-bottom: 1px solid #dae6f0; vertical-align: middle; }
        td input, td select { padding: 8px 8px; font-size: 0.85rem; margin: 0; min-width: unset; }
        .total-dia { background: #e1f5fe; border-radius: 24px; padding: 16px; margin: 20px 0 10px; display: flex; flex-wrap: wrap; justify-content: space-around; font-weight: 600; text-align: center; }
        .total-item { flex: 1 1 140px; margin: 6px; background: white; border-radius: 40px; padding: 12px 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .total-item span { font-size: 1.3rem; color: #075e54; display: block; }
        .multi-add { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
        .multi-add input { width: 80px; margin: 0; }
        .stock-bajo { background-color: #ffe5e5 !important; font-weight: bold; }
        .movimiento-positivo { color: green; }
        .movimiento-negativo { color: red; }
        .paginacion { display: flex; justify-content: center; gap: 10px; margin-top: 10px; }
        .filtros-ventas { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: #eef7f0; padding: 12px; border-radius: 30px; margin-bottom: 20px; }
        .filtros-ventas select, .filtros-ventas input { width: auto; flex: 1 1 120px; margin: 0; }
        .trazabilidad-panel { background: #f9f9f9; border-radius: 24px; padding: 16px; margin-top: 20px; }
        .producto-selector { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .valorizacion { display: flex; gap: 15px; flex-wrap: wrap; background: #e0f2e9; border-radius: 30px; padding: 16px; margin-top: 16px; font-weight: 600; align-items: center; justify-content: space-between; }
        .comision-input { width: 80px; padding: 8px; border-radius: 20px; border: 1px solid #a0b9cf; text-align: center; }
        .comision-item { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: white; padding: 8px 12px; border-radius: 40px; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
        .recordatorios { background: #fff3cd; border: 1px solid #ffeeba; border-radius: 24px; padding: 12px 16px; margin-bottom: 20px; font-size: 0.9rem; color: #856404; max-height: 250px; overflow-y: auto; }
        .recordatorio-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; border-bottom: 1px solid rgba(0,0,0,0.05); padding-bottom: 4px; }
        .vencido { color: #dc3545; font-weight: 600; }
        .proximo { color: #fd7e14; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 24px; border-radius: 30px; max-width: 550px; width: 90%; max-height: 85vh; overflow-y: auto; }
        .flex-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .checkbox-label { display: flex; align-items: center; gap: 5px; margin: 0; }
        .sub-tabs { display: flex; gap: 10px; margin: 15px 0; background: #f0f7fc; border-radius: 40px; padding: 5px; }
        .sub-tab { flex: 1; text-align: center; padding: 10px; border-radius: 40px; cursor: pointer; font-weight: 600; }
        .sub-tab.active { background: #25d366; color: white; }
        .buscador { margin-bottom: 15px; }
        .table-responsive { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-bottom: 16px; border: 1px solid #e1f5fe; border-radius: 12px; width: 100%; display: block; }
        /* Pintar barra de scroll visible para que se note que se puede deslizar */
        .table-responsive::-webkit-scrollbar { height: 6px; }
        .table-responsive::-webkit-scrollbar-thumb { background: #25d366; border-radius: 10px; }
        .table-responsive table { min-width: 800px; }
        
        @media (max-width: 768px) {
            .tab { font-size: 0.8rem; padding: 10px 4px; }
            button, .btn-upload-label { width: 100%; margin: 6px 0; }
            th, td { font-size: 0.75rem; padding: 4px 2px; }
            .total-item { flex: 1 1 100%; }
            
            /* PARCHE: Ajustes específicos para pantallas de celulares */
            .table-responsive table { min-width: 100%; }
            td button.small { width: auto !important; min-width: 30px !important; padding: 6px !important; margin: 0 !important; }
            .prod-select { min-width: 110px !important; width: 110px !important; font-size: 0.75rem; padding: 6px 2px; }
            .prod-unidad { width: 45px !important; padding: 6px 2px !important; }
            .prod-precio, .prod-monto { width: 65px !important; padding: 6px 2px !important; }
            .stock-display { font-size: 0.7rem !important; }
        }
        }
        #greeting { background: #e8f5e9; padding: 10px 20px; text-align: right; font-size: 0.95rem; color: #075e54; border-bottom: 1px solid #c8e6c9; font-weight: 500; }
        .calificacion-star { color: #ffc107; font-size: 1rem; }
        .calificacion-lista { margin-top: 8px; font-size: 0.85rem; background: #f8f9fa; border-radius: 20px; padding: 12px; }
        .calificacion-item { border-bottom: 1px solid #dee2e6; padding: 8px 0; }
        .anulada { text-decoration: line-through; color: #dc3545 !important; background-color: #fff5f5; }
        .estado-badge { font-size: 0.75rem; padding: 4px 8px; border-radius: 20px; background: #dc3545; color: white; display: inline-block; font-weight: bold; text-align: center; }
        .vencimiento-rojo { background-color: #ffebee !important; color: #c62828; }
        .vencimiento-naranja { background-color: #fff3e0 !important; color: #ef6c00; }
        .vencimiento-verde { background-color: #e8f5e9 !important; color: #2e7d32; }
        .comportamiento-al-dia { color: #2e7d32; background-color: #e8f5e9; display: inline-block; padding: 4px 8px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .comportamiento-con-mora { color: #c62828; background-color: #ffebee; display: inline-block; padding: 4px 8px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .comportamiento-contado { color: #1976d2; background-color: #e3f2fd; display: inline-block; padding: 4px 8px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
        .clientes-ejecutivos-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .clientes-ejecutivos-table th, .clientes-ejecutivos-table td { border: 1px solid #cde0ed; padding: 10px 8px; text-align: left; vertical-align: middle; }
        .clientes-ejecutivos-table th { background: #075e54; color: white; font-weight: 600; }
        .clientes-ejecutivos-table tr:nth-child(even) { background-color: #f5faff; }
        .reporte-fisico-container { background: #fdfaf0; border-radius: 24px; padding: 16px; margin-top: 20px; border: 1px solid #e1e8e3; }
        .req { color: red; font-weight: bold; }
    </style>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>
<div class="app" id="app">
    <div class="header-main">
        <div class="logo">🏥</div>
        <div class="title-container">
            <h1>Marijose Jhire S.A.</h1>
            <p>Sistema Integral de Gestión y Control Financiero</p>
        </div>
    </div>
    <div id="greeting"></div>
    <div class="tabs">
        <div class="tab active" data-tab="venta">🧾 Registrar venta</div>
        <div class="tab" data-tab="ventas">📅 Ventas</div>
        <div class="tab" data-tab="catalogo">📇 Clientes</div>
        <div class="tab" data-tab="productos">📦 Productos</div>
        <div class="tab" data-tab="inventario">📊 Inventario</div>
        <div class="tab" data-tab="cobros">💰 Cobros</div>
    </div>
    <div class="content" id="content"></div>
</div>

<div id="estadoCuentaModal" class="modal"><div class="modal-content" id="estadoCuentaContent"></div></div>
<div id="abonoModal" class="modal"><div class="modal-content" id="abonoContent"></div></div>
<div id="estadoCobroModal" class="modal"><div class="modal-content" id="estadoCobroContent"></div></div>
<div id="resumenVentasModal" class="modal"><div class="modal-content" id="resumenVentasContent"></div></div>
<div id="editarClienteModal" class="modal"><div class="modal-content" id="editarClienteContent"></div></div>
<div id="calificacionModal" class="modal"><div class="modal-content" id="calificacionContent"></div></div>

<div id="nuevoProductoModal" class="modal">
    <div class="modal-content">
        <h3 style="color: #075e54; margin-bottom: 15px;">📦 Agregar Nuevo Producto</h3>
        <label>Nombre del Producto (Solo Mayúsculas): <input type="text" id="npNombre" required style="text-transform: uppercase;"></label>
        <label>Lote: <input type="text" id="npLote" required placeholder="Ej: L-001"></label>
        <label>Fecha de Vencimiento: <input type="date" id="npVencimiento" required></label>
        <label>Precio Sugerido (Q): <input type="number" id="npPrecio" step="0.01" min="0" required></label>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button id="guardarNuevoProductoBtn" class="secondary">Guardar Producto</button>
            <button id="cancelarNuevoProductoBtn" class="secondary small">Cancelar</button>
        </div>
    </div>
</div>

<div id="selectorMesModal" class="modal">
    <div class="modal-content">
        <h3 style="color: #075e54; margin-bottom: 15px;">📊 Generar Resumen Mensual</h3>
        <label>Mes:
            <select id="selectMesResumen">
                <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
                <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
                <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
                <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
            </select>
        </label>
        <label>Año: <input type="number" id="inputAnioResumen" value="2026"></label>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button id="generarResumenSeleccionadoBtn" class="secondary">Generar PDF</button>
            <button id="cerrarSelectorMesBtn" class="secondary small">Cancelar</button>
        </div>
    </div>
</div>

<div id="trimestralModal" class="modal">
    <div class="modal-content">
        <h3 style="color: #075e54; margin-bottom: 15px;">📈 Generar Reporte Trimestral</h3>
        <label>Ciclo Fiscal:
            <select id="selectTrimestre">
                <option value="Q1">Q1 (Ene - Mar)</option>
                <option value="Q2">Q2 (Abr - Jun)</option>
                <option value="Q3">Q3 (Jul - Sep)</option>
                <option value="Q4">Q4 (Oct - Dic)</option>
            </select>
        </label>
        <label>Año: <input type="number" id="anioTrimestre" value="2026"></label>
        <div style="margin-top:20px; display:flex; gap:10px;">
            <button id="generarReporteTrimestralBtn" class="secondary">Generar PDF</button>
            <button id="cerrarTrimestralBtn" class="secondary small">Cancelar</button>
        </div>
    </div>
</div>

<script>
    (function() {
        // ========== DATOS GLOBALES ==========
        let clientes = [];
        let ventas = [];
        let catalogoProductos = [];
        let inventario = [];
        let movimientosInventario = [];
        let abonos = [];
        let cobros = [];
        let pagosCobro = [];
        let calificacionesClientes = [];

        let nombreUsuario = localStorage.getItem('nombreUsuario') || '';
        if (!nombreUsuario) {
            nombreUsuario = prompt('¡Hola! Por favor, ingresa tu nombre para personalizar la experiencia:');
            if (nombreUsuario && nombreUsuario.trim() !== '') {
                localStorage.setItem('nombreUsuario', nombreUsuario.trim());
            } else {
                nombreUsuario = 'Usuario';
                localStorage.setItem('nombreUsuario', nombreUsuario);
            }
        }
        document.getElementById('greeting').innerText = `👋 Bienvenido, ${nombreUsuario}`;

        function obtenerSaludo() {
            const hora = new Date().getHours();
            if (hora < 12) return 'Buenos días';
            if (hora < 18) return 'Buenas tardes';
            return 'Buenas noches';
        }

        function generarIdCliente() { return 'cli_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function generarIdVenta() { return 'ven_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function generarIdProducto() { return 'prod_' + Date.now() + '_' + Math.random().toString(36).substr(2, 5); }
        function generarIdMovimiento() { return 'mov_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function generarIdAbono() { return 'abo_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function generarIdCobro() { return 'cob_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function generarIdPagoCobro() { return 'pag_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }
        function generarIdCalificacion() { return 'cal_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9); }

        function obtenerCorrelativoReporte() {
            let correlativo = localStorage.getItem('correlativoReporte');
            if (!correlativo) {
                correlativo = 1;
            } else {
                correlativo = parseInt(correlativo) + 1;
            }
            localStorage.setItem('correlativoReporte', correlativo);
            const anio = new Date().getFullYear();
            return `REP-${anio}-${correlativo.toString().padStart(4, '0')}`;
        }
        function redondearDinero(valor) {
            return Math.round((parseFloat(valor) || 0) * 100) / 100;
        }
        function obtenerCorrelativoRecibo() {
            let correlativo = localStorage.getItem('correlativoRecibo');
            if (!correlativo) {
                correlativo = 1;
            } else {
                correlativo = parseInt(correlativo) + 1;
            }
            localStorage.setItem('correlativoRecibo', correlativo);
            return correlativo;
        }
        const formatoQ = (val) => 'Q' + redondearDinero(val).toFixed(2);

        const productosPredefinidos = [
            { nombre: 'AZIREN 500', precio: 18.00 }, { nombre: 'CLARIRON IV', precio: 78.00 }, { nombre: 'CLARIRON TABLETAS', precio: 66.00 }, { nombre: 'CORTICINATE 500', precio: 25.00 },
            { nombre: 'ESOMEREN', precio: 149.00 }, { nombre: 'ITRACOREN', precio: 49.00 }, { nombre: 'MEROPE', precio: 54.00 }, { nombre: 'OMEZIL CAPSULAS', precio: 35.00 },
            { nombre: 'OMEZIL IV', precio: 55.00 }, { nombre: 'PANZITOP', precio: 67.00 }, { nombre: 'VANCOREAN', precio: 105.00 }, { nombre: 'DOLO NERVIPLEX', precio: 25.00 }
        ];

        function migrarDatos() {
            let migrado = false;
            clientes.forEach(c => {
                if (!c.id) { c.id = generarIdCliente(); migrado = true; }
                if (c.encargado === undefined) { c.encargado = ''; migrado = true; }
                if (c.categoria === undefined) { c.categoria = ''; migrado = true; }
                if (c.ruta === undefined) { c.ruta = ''; migrado = true; }
                if (c.limiteCredito === undefined) { c.limiteCredito = null; migrado = true; }
            });
            ventas.forEach(v => {
                if (!v.clienteId && v.clienteCodigo) { const cliente = clientes.find(c => c.codigo === v.clienteCodigo); v.clienteId = cliente ? cliente.id : null; migrado = true; }
                if (v.fecha && !v.fecha.includes('T')) { v.fecha = new Date(v.fecha).toISOString(); }
                if (v.tipoVenta === 'Crédito') {
                    if (v.saldoPendiente === undefined) { v.saldoPendiente = redondearDinero(parseFloat(v.total) || 0); migrado = true; }
                    if (v.diasCredito === undefined) { v.diasCredito = 30; migrado = true; }
                    if (v.fechaVencimiento === undefined) { const fechaVenta = new Date(v.fecha); fechaVenta.setDate(fechaVenta.getDate() + v.diasCredito); v.fechaVencimiento = fechaVenta.toISOString(); migrado = true; }
                } else { if (v.saldoPendiente === undefined) v.saldoPendiente = 0; }
                if (v.fechaCancelacion === undefined) v.fechaCancelacion = null;
                if (v.estado === undefined) { v.estado = 'normal'; migrado = true; }
                if (v.facturado === undefined) { v.facturado = false; migrado = true; }
            });
            inventario.forEach(i => {
                if (i.costoUnitario === undefined) i.costoUnitario = i.precioUnitario * 0.7;
                if (i.fechaVencimiento === undefined) {
                    const fechaDef = new Date();
                    fechaDef.setFullYear(fechaDef.getFullYear() + 1);
                    i.fechaVencimiento = fechaDef.toISOString().slice(0,10);
                    migrado = true;
                }
            });
            movimientosInventario.forEach(m => { if (m.usuario === undefined) m.usuario = 'admin'; if (m.documento === undefined) m.documento = ''; });
            if (!abonos) abonos = [];
            if (!cobros) cobros = [];
            if (!pagosCobro) pagosCobro = [];
            if (!calificacionesClientes) calificacionesClientes = [];

            if (catalogoProductos.length === 0) {
                productosPredefinidos.forEach(p => {
                    const id = generarIdProducto();
                    catalogoProductos.push({ id, nombre: p.nombre, precioSugerido: p.precio, activo: true });
                    const fechaVencimiento = new Date();
                    fechaVencimiento.setFullYear(fechaVencimiento.getFullYear() + 1);
                    inventario.push({ productoId: id, nombre: p.nombre, stock: 10, precioUnitario: p.precio, costoUnitario: p.precio * 0.7, fechaVencimiento: fechaVencimiento.toISOString().slice(0,10), lote: '' });
                });
                migrado = true;
            } else {
                catalogoProductos.forEach(prod => {
                    if (prod.activo === undefined) { prod.activo = true; migrado = true; }
                    let item = inventario.find(i => i.productoId === prod.id);
                    if (!item) {
                        const fechaVencimiento = new Date();
                        fechaVencimiento.setFullYear(fechaVencimiento.getFullYear() + 1);
                        inventario.push({ productoId: prod.id, nombre: prod.nombre, stock: 0, precioUnitario: prod.precioSugerido, costoUnitario: prod.precioSugerido * 0.7, fechaVencimiento: fechaVencimiento.toISOString().slice(0,10), lote: '' });
                    } else {
                        item.nombre = prod.nombre;
                        item.precioUnitario = prod.precioSugerido;
                        if (!item.fechaVencimiento) {
                            const fechaDef = new Date();
                            fechaDef.setFullYear(fechaDef.getFullYear() + 1);
                            item.fechaVencimiento = fechaDef.toISOString().slice(0,10);
                        }
                    }
                });
                inventario = inventario.filter(i => catalogoProductos.some(p => p.id === i.productoId));
            }
            if (migrado) saveData();
        }

        function loadData() {
            try {
                clientes = JSON.parse(localStorage.getItem('clientes')) || [];
                ventas = JSON.parse(localStorage.getItem('ventas')) || [];
                catalogoProductos = JSON.parse(localStorage.getItem('catalogoProductos')) || [];
                inventario = JSON.parse(localStorage.getItem('inventario')) || [];
                movimientosInventario = JSON.parse(localStorage.getItem('movimientosInventario')) || [];
                abonos = JSON.parse(localStorage.getItem('abonos')) || [];

                calificacionesClientes = JSON.parse(localStorage.getItem('calificacionesClientes')) || [];
            } catch (e) { console.warn("Error cargando datos", e); }
            migrarDatos();

            localStorage.setItem('clientes', JSON.stringify(clientes));

            localStorage.setItem('catalogoProductos', JSON.stringify(catalogoProductos));
            localStorage.setItem('inventario', JSON.stringify(inventario));

            localStorage.setItem('abonos', JSON.stringify(abonos));

        function exportarBackup() {
            const backup = { clientes, ventas, catalogoProductos, inventario, movimientosInventario, abonos, cobros, pagosCobro, calificacionesClientes, fecha: new Date().toISOString() };
            const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importarBackup(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const data = JSON.parse(e.target.result);
                    if (data.clientes) clientes = data.clientes;
                    if (data.ventas) ventas = data.ventas;
                    if (data.catalogoProductos) catalogoProductos = data.catalogoProductos;
                    if (data.inventario) inventario = data.inventario;
                    if (data.movimientosInventario) movimientosInventario = data.movimientosInventario;
                    if (data.abonos) abonos = data.abonos;
                    if (data.cobros) cobros = data.cobros;
                    if (data.pagosCobro) pagosCobro = data.pagosCobro;
                    if (data.calificacionesClientes) calificacionesClientes = data.calificacionesClientes;
                    migrarDatos();
                    saveData();
                    alert('Respaldo importado correctamente');
                    showTab(document.querySelector('.tab.active').dataset.tab);
                } catch (err) {
                    alert('Error al importar: archivo inválido');
                }
            };
            reader.readAsText(file);
        }

        function mostrarRecordatorios() {
            const hoy = new Date(); hoy.setHours(0,0,0,0);
            let facturasProximas = []; let chequesPendientes = [];

            ventas.forEach(v => {
                if (v.estado !== 'normal') return;
                if (v.tipoVenta === 'Crédito' && v.saldoPendiente > 0) {
                    const venc = new Date(v.fechaVencimiento); venc.setHours(0,0,0,0);
                    const diasRestantes = Math.ceil((venc - hoy) / (1000*60*60*24));
                    if (diasRestantes <= 3) {
                        const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: 'Desconocido' };
                        facturasProximas.push({ ...v, clienteNombre: cliente.razonSocial, diasRestantes, vencida: diasRestantes < 0 });
                    }
                }
            });
            abonos.forEach(a => {
                if (a.tipoPago === 'cheque' && a.estado === 'pendiente' && a.fechaCobro) {
                    const fechaCobro = new Date(a.fechaCobro); fechaCobro.setHours(0,0,0,0);
                    const dias = Math.ceil((fechaCobro - hoy) / (1000*60*60*24));
                    if (dias <= 3 && dias >= 0) {
                        const venta = ventas.find(v => v.id === a.ventaId);
                        const cliente = venta ? (clientes.find(c => c.id === venta.clienteId) || { razonSocial: '?' }) : { razonSocial: '?' };
                        chequesPendientes.push({ ...a, clienteNombre: cliente.razonSocial, dias });
                    }
                }
            });
            const cobrosPendientes = cobros.filter(c => c.saldoPendiente > 0).slice(0,5);
            let html = '';
            if (facturasProximas.length > 0 || chequesPendientes.length > 0 || cobrosPendientes.length > 0) {
                html += '<div class="recordatorios"><strong>⏰ Recordatorios</strong>';
                facturasProximas.forEach(f => {
                    const clase = f.vencida ? 'vencido' : 'proximo';
                    html += `<div class="recordatorio-item ${clase}">
                        <div style="flex:1;">📄 Factura ${f.id.substr(0,8)} - ${f.clienteNombre}: ${f.vencida ? 'VENCIDA' : 'Vence en '+f.diasRestantes+' día(s)'} (Q${redondearDinero(f.saldoPendiente).toFixed(2)})</div>
                        <button class="secondary small btn-enviar-recordatorio" data-id="${f.id}" title="Enviar Recordatorio WhatsApp">📲</button>
                    </div>`;
                });
                chequesPendientes.forEach(c => {
                    html += `<div class="recordatorio-item proximo"><div style="flex:1;">💰 Cheque de Q${redondearDinero(c.monto).toFixed(2)} de ${c.clienteNombre} - Fecha cobro: ${new Date(c.fechaCobro).toLocaleDateString()}</div></div>`;
                });
                if (cobrosPendientes.length > 0) {
                    html += '<div><strong>💰 Cobros pendientes</strong></div>';
                    cobrosPendientes.forEach(c => {
                        const cliente = clientes.find(cl => cl.id === c.clienteId) || { razonSocial: '?' };
                        html += `<div class="recordatorio-item"><div style="flex:1;">📄 ${c.numeroDocumento} - ${cliente.razonSocial}: ${formatoQ(c.saldoPendiente)}</div></div>`;
                    });
                }
                html += '</div>';
            }
            return html;
        }

        function enviarRecordatorioWhatsApp(ventaId) {
            const venta = ventas.find(v => v.id === ventaId);
            if(!venta) return;
            const cliente = clientes.find(c => c.id === venta.clienteId) || { razonSocial: 'Cliente', telefono: '' };
            const correlativo = venta.id.substr(0,8);
            
            // Genera el mismo PDF de Comprobante, no es necesario hacer una función extra
            generarComprobanteVenta(venta, cliente, correlativo);

            const saludo = obtenerSaludo();
            let numTel = cliente.telefono ? cliente.telefono.replace(/\D/g, '') : '';
            let baseUrl = numTel ? `https://wa.me/502${numTel}?text=` : `https://wa.me/?text=`;
            
            // Contador dinámico de días
            const hoy = new Date(); hoy.setHours(0,0,0,0);
            const venc = new Date(venta.fechaVencimiento); venc.setHours(0,0,0,0);
            const diasDiff = Math.ceil((venc - hoy) / (1000*60*60*24));
            
            let estadoDias = '';
            if (diasDiff < 0) estadoDias = ` *(Factura con ${Math.abs(diasDiff)} días de atraso)*`;
            else if (diasDiff === 0) estadoDias = ` *(Factura vence HOY)*`;
            else estadoDias = ` *(Vence en ${diasDiff} días)*`;

            const mensaje = `¡${saludo}! Esperamos que esté teniendo un excelente día.\n\nDe parte de *MARIJOSE JHIRE S.A.*, le escribimos para compartirle el recordatorio de su factura pendiente con saldo de *${formatoQ(venta.saldoPendiente)}* a nombre de ${cliente.razonSocial}${estadoDias}.\n\nLe adjuntamos el detalle en PDF. Cualquier duda o consulta, estamos a sus enteras órdenes. ¡Muchas gracias por su confianza!`;
            
            window.open(baseUrl + encodeURIComponent(mensaje), '_blank');
        }

            }

            function obtenerStock(productoId) {
                const item = inventario.find(i => i.productoId === productoId);
                return item ? item.stock : 0;
            }

            function agregarFilaProducto(unidades = '', productoId = '', precio = '', monto = '') {
                const tr = document.createElement('tr');
                const stockActual = productoId ? obtenerStock(productoId) : 0;
                tr.innerHTML = `
                     <td><select class="prod-select" style="width:100%; min-width: 150px;">${optionsProductos(productoId)}</select></td>
                     <td><input type="number" class="prod-unidad" value="${unidades}" min="0" step="1" style="width:60px;"></td>
                     <td><input type="number" class="prod-precio" value="${precio}" min="0" step="0.01" style="width:80px;"></td>
                     <td><input type="number" class="prod-monto" value="${monto}" min="0" step="0.01" style="width:90px;"></td>
                     <td><span class="stock-display" style="font-size:0.8rem;">${stockActual}</span></td>
                     <td><button class="remove-btn secondary small">✖</button></td>
                `;
                productosBody.appendChild(tr);

                const select = tr.querySelector('.prod-select');
                const unidadInp = tr.querySelector('.prod-unidad');
                const precioInp = tr.querySelector('.prod-precio');
                const montoInp = tr.querySelector('.prod-monto');
                const stockSpan = tr.querySelector('.stock-display');

                select.addEventListener('change', () => {
                    const opt = select.selectedOptions[0];
                    if (opt && opt.value) {
                        precioInp.value = redondearDinero(parseFloat(opt.dataset.precio)).toFixed(2);
                        stockSpan.textContent = obtenerStock(select.value);
                        recalcular();
                    } else {
                        precioInp.value = ''; stockSpan.textContent = '0'; recalcular();
                    }
                });

                const recalcular = () => {
                    const u = parseFloat(unidadInp.value) || 0;
                    const p = parseFloat(precioInp.value) || 0;
                    montoInp.value = redondearDinero(u * p).toFixed(2);
                    actualizarTotal();
                };
                unidadInp.addEventListener('input', recalcular);
                precioInp.addEventListener('input', recalcular);
                montoInp.addEventListener('input', actualizarTotal);

                tr.querySelector('.remove-btn').addEventListener('click', () => {
                    tr.remove(); actualizarTotal();
                });
            }

            function agregarMultiplesFilas() {
                let cantidad = parseInt(cantidadFilas.value) || 1;
                for (let i = 0; i < cantidad; i++) agregarFilaProducto();
                guardarEstadoActual();
            }

            function actualizarTotal() {
                let total = 0;
                document.querySelectorAll('.prod-monto').forEach(inp => total += redondearDinero(parseFloat(inp.value) || 0));
                totalSpan.innerText = 'Q' + redondearDinero(total).toFixed(2);
                guardarEstadoActual();
            }

            if (productosBody.children.length === 0) agregarFilaProducto();
            agregarFila.addEventListener('click', () => { agregarFilaProducto(); guardarEstadoActual(); });
            agregarMultiples.addEventListener('click', agregarMultiplesFilas);

            let resultadosFiltrados = [];
            let paginaActual = 0;
            const itemsPorPagina = 5;

            function renderBusqueda(termino) {
                const term = termino.toLowerCase().trim();
                resultadosFiltrados = clientes.filter(c => c.razonSocial.toLowerCase().includes(term) || (c.nit && c.nit.toLowerCase().includes(term)) || (c.codigo && c.codigo.toLowerCase().includes(term)));
                paginaActual = 0;
                mostrarPagina();
            }

            function mostrarPagina() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const paginaResultados = resultadosFiltrados.slice(inicio, fin);

                if (paginaResultados.length === 0) { listaResultado.innerHTML = '<div class="client-item">(ningún cliente coincide)</div>'; } 
                else {
                    let items = '';
                    paginaResultados.forEach(c => { items += `<div class="client-item" data-id="${c.id}"><span>${c.razonSocial} ${c.codigo ? '· '+c.codigo : ''}</span><span class="client-code">${c.nit || 'sin NIT'}</span></div>`; });
                    listaResultado.innerHTML = items;
                }

                let paginacionHtml = '';
                const totalPaginas = Math.ceil(resultadosFiltrados.length / itemsPorPagina);
                if (totalPaginas > 1) {
                    paginacionHtml += `<button class="secondary small" id="paginaAnterior" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Anterior</button><span> Página ${paginaActual+1} de ${totalPaginas} </span><button class="secondary small" id="paginaSiguiente" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Siguiente ➔</button>`;
                }
                paginacionDiv.innerHTML = paginacionHtml;

                document.querySelectorAll('.client-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.id;
                        const cliente = clientes.find(c => c.id === id);
                        if (cliente) {
                            clienteSeleccionado = cliente;
                            codigoCliente.value = cliente.codigo || '';
                            razonSocial.value = cliente.razonSocial;
                            nit.value = cliente.nit || '';
                            direccion.value = cliente.direccion || '';
                            telefono.value = cliente.telefono || '';
                            correo.value = cliente.correo || '';
                            categoria.value = cliente.categoria || '';
                            ruta.value = cliente.ruta || '';
                            limiteCredito.value = cliente.limiteCredito !== null ? cliente.limiteCredito : '';
                            
                            toggleBloqueoCamposParcial(cliente);

                            clienteSelContainer.innerHTML = `<div class="badge">✅ Cliente: ${cliente.razonSocial} <button id="quitarSeleccionBtn" class="small secondary">✕ Quitar</button></div>`;
                            document.getElementById('quitarSeleccionBtn')?.addEventListener('click', () => limpiarCliente());
                            renderBusqueda('');
                            buscarInput.value = '';
                            guardarEstadoActual();
                        }
                    });
                });

                document.getElementById('paginaAnterior')?.addEventListener('click', () => { if (paginaActual > 0) { paginaActual--; mostrarPagina(); } });
                document.getElementById('paginaSiguiente')?.addEventListener('click', () => { if (paginaActual < totalPaginas-1) { paginaActual++; mostrarPagina(); } });
            }

            function limpiarCliente() {
                codigoCliente.value = ''; razonSocial.value = ''; nit.value = ''; direccion.value = ''; telefono.value = ''; correo.value = ''; categoria.value = ''; ruta.value = ''; limiteCredito.value = '';
                toggleBloqueoCamposParcial(null);
                clienteSeleccionado = null;
                clienteSelContainer.innerHTML = '';
                renderBusqueda(buscarInput.value);
                guardarEstadoActual();
            }

            buscarInput.addEventListener('input', () => renderBusqueda(buscarInput.value));
            limpiarBusqueda.addEventListener('click', () => { buscarInput.value = ''; renderBusqueda(''); });
            nuevoBtn.addEventListener('click', limpiarFormularioCompleto);

            function guardarEstadoActual() {
                if (isReseting) return;
                const filas = [];
                let totalUnidades = 0;
                
                document.querySelectorAll('#productosBody tr').forEach(tr => {
                    const select = tr.querySelector('.prod-select');
                    const productoId = select.value;
                    const unidades = parseFloat(tr.querySelector('.prod-unidad').value) || 0;
                    if (productoId && unidades > 0) {
                        filas.push({ productoId, producto: select.selectedOptions[0]?.dataset.nombre || '', unidades, precioUnitario: parseFloat(tr.querySelector('.prod-precio').value) || 0, monto: parseFloat(tr.querySelector('.prod-monto').value) || 0 });
                        totalUnidades += unidades;
                    }
                });

                if (!clienteSeleccionado && document.getElementById('razonSocial').value.trim() === '' && totalUnidades === 0) {
                    eliminarBorrador(); return; 
                }

                guardarBorradorVenta({
                    cliente: clienteSeleccionado, razonSocial: document.getElementById('razonSocial').value, codigo: document.getElementById('codigoCliente').value,
                    nit: document.getElementById('nit').value, direccion: document.getElementById('direccion').value, telefono: document.getElementById('telefono').value,
                    correo: document.getElementById('correo').value, categoria: document.getElementById('categoria').value, ruta: document.getElementById('ruta').value,
                    limiteCredito: document.getElementById('limiteCredito').value, productos: filas, tipoVenta: document.querySelector('input[name="tipoVenta"]:checked').value,
                    diasCredito: document.getElementById('diasCredito').value, fecha: document.getElementById('fechaVenta').value
                });
            }

            function cargarBorrador() {
                const borrador = cargarBorradorVenta();
                if (!borrador) return;
                if (confirm('Hay un borrador de venta sin guardar. ¿Deseas restaurarlo?')) {
                    if (borrador.cliente) {
                        clienteSeleccionado = borrador.cliente;
                        codigoCliente.value = borrador.cliente.codigo || ''; razonSocial.value = borrador.cliente.razonSocial; nit.value = borrador.cliente.nit || '';
                        direccion.value = borrador.cliente.direccion || ''; telefono.value = borrador.cliente.telefono || ''; correo.value = borrador.cliente.correo || '';
                        categoria.value = borrador.categoria || ''; ruta.value = borrador.cliente.ruta || ''; limiteCredito.value = borrador.cliente.limiteCredito !== null ? borrador.cliente.limiteCredito : '';
                        
                        toggleBloqueoCamposParcial(borrador.cliente);

                        clienteSelContainer.innerHTML = `<div class="badge">✅ Cliente: ${borrador.cliente.razonSocial} <button id="quitarSeleccionBtn" class="small secondary">✕ Quitar</button></div>`;
                        document.getElementById('quitarSeleccionBtn')?.addEventListener('click', () => limpiarCliente());
                    } else {
                        razonSocial.value = borrador.razonSocial || ''; codigoCliente.value = borrador.codigo || ''; nit.value = borrador.nit || '';
                        direccion.value = borrador.direccion || ''; telefono.value = borrador.telefono || ''; correo.value = borrador.correo || '';
                        categoria.value = borrador.categoria || ''; ruta.value = borrador.ruta || ''; limiteCredito.value = borrador.limiteCredito || '';
                    }
                    if (borrador.productos && borrador.productos.length) {
                        productosBody.innerHTML = '';
                        borrador.productos.forEach(p => agregarFilaProducto(p.unidades, p.productoId, p.precioUnitario, p.monto));
                    } else { agregarFilaProducto(); }
                    
                    const radio = document.querySelector(`input[name="tipoVenta"][value="${borrador.tipoVenta || 'Crédito'}"]`);
                    if (radio) radio.checked = true;
                    if (borrador.diasCredito) document.getElementById('diasCredito').value = borrador.diasCredito;
                    if (borrador.fecha) fechaVenta.value = borrador.fecha;
                    toggleDias(); actualizarTotal();
                }
            }
            cargarBorrador();

            async function guardarVenta() {
                const datosForm = {
                    codigo: codigoCliente.value.trim() || null,
                    razonSocial: razonSocial.value.trim(),
                    nit: nit.value.trim() || 'C/F', // C/F POR DEFECTO SI ESTÁ VACÍO
                    direccion: direccion.value.trim(),
                    telefono: telefono.value.trim(),
                    correo: correo.value.trim(),
                    categoria: categoria.value,
                    ruta: ruta.value.trim(),
                    limiteCredito: limiteCredito.value ? parseFloat(limiteCredito.value) : null
                };

                if (!datosForm.razonSocial || !datosForm.direccion || !datosForm.telefono || !datosForm.categoria || !datosForm.ruta) {
                    alert('⚠️ Por favor completa TODOS los campos obligatorios del cliente (Razón Social, Dirección, Teléfono, Categoría y Ruta).');
                    return;
                }

                let tipoVenta = 'Crédito';
                const radios = document.getElementsByName('tipoVenta');
                for (let r of radios) if (r.checked) tipoVenta = r.value;

                let linkGPS = "Sin ubicación GPS";
                if ("geolocation" in navigator) {
                   try {
                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 10000 });
                    });
                    // Genera el enlace oficial y universal de Google Maps
                    linkGPS = `https://www.google.com/maps?q=${position.coords.latitude},${position.coords.longitude}`;
                } catch (error) { /* Silencioso, no interrumpe el guardado si falla el GPS */ }
                }

                const filas = [];
                let stockSuficiente = true;
                let erroresStock = [];

                document.querySelectorAll('#productosBody tr').forEach(tr => {
                    const select = tr.querySelector('.prod-select');
                    const opt = select.selectedOptions[0];
                    const prodId = select.value;
                    const prodNombre = opt && opt.value ? opt.dataset.nombre : 'Otro';
                    const unidades = parseFloat(tr.querySelector('.prod-unidad').value) || 0;
                    const precio = tr.querySelector('.prod-precio').value.trim();
                    const monto = tr.querySelector('.prod-monto').value.trim();

                    if (prodId && unidades > 0) {
                        const itemInv = inventario.find(i => i.productoId === prodId);
                        if (itemInv && itemInv.stock < unidades) {
                            stockSuficiente = false; erroresStock.push(`${prodNombre} (stock: ${itemInv.stock}, requerido: ${unidades})`);
                        }
                        if (itemInv && itemInv.fechaVencimiento) {
                            const hoy = new Date(); hoy.setHours(0,0,0,0);
                            const venc = new Date(itemInv.fechaVencimiento);
                            if (venc < hoy) { stockSuficiente = false; erroresStock.push(`${prodNombre} (PRODUCTO VENCIDO)`); }
                        }
                        filas.push({ productoId: prodId, producto: prodNombre, unidades, precioUnitario: precio || '0', monto: monto || '0' });
                    } else if (prodNombre !== 'Otro' || unidades > 0 || precio || monto) {
                        if (!prodId) { alert('Hay filas sin producto seleccionado.'); return; }
                    }
                });

                if (!stockSuficiente) { alert('Stock insuficiente o vencido:\n' + erroresStock.join('\n')); return; }
                if (filas.length === 0) { alert('Debe agregar al menos un producto.'); return; }

                const total = Math.round((parseFloat(document.getElementById('totalVentaCalc').innerText.replace('Q','')) || 0) * 100) / 100;
                let fechaSeleccionada = document.getElementById('fechaVenta').value || new Date().toISOString().slice(0,10);
                const fechaISO = new Date(fechaSeleccionada + 'T12:00:00').toISOString();

                let clienteFinal = clienteSeleccionado;
                if (!clienteFinal) {
                    const nitIngresado = datosForm.nit;
                    const clienteExistente = clientes.find(c => c.nit && c.nit.toUpperCase() === nitIngresado.toUpperCase() && nitIngresado !== 'C/F');
                    
                    if (clienteExistente) {
                        clienteFinal = clienteExistente;
                        Object.assign(clienteFinal, datosForm);
                    } else {
                        clienteFinal = { id: generarIdCliente(), ...datosForm, encargado: '', fechaCreacion: new Date().toISOString() };
                        clientes.push(clienteFinal);
                    }
                } else {
                    Object.assign(clienteFinal, datosForm);
                }
                saveData();

                let diasCredito = tipoVenta === 'Crédito' ? (parseInt(document.getElementById('diasCredito').value) || 30) : null;
                if (tipoVenta === 'Crédito' && clienteFinal.limiteCredito !== null) {
                    const saldoActualCliente = ventas.filter(v => v.clienteId === clienteFinal.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    if (saldoActualCliente + total > clienteFinal.limiteCredito) {
                        alert(`El cliente superaría su límite de crédito de Q${clienteFinal.limiteCredito.toFixed(2)}. Saldo actual: Q${saldoActualCliente.toFixed(2)}.`);
                        return;
                    }
                }

                const nuevaVenta = { id: 'ven_' + Date.now(), clienteId: clienteFinal.id, fecha: fechaISO, productos: filas, total, tipoVenta, diasCredito, saldoPendiente: tipoVenta === 'Crédito' ? total : 0, fechaVencimiento: tipoVenta === 'Crédito' ? new Date(new Date(fechaISO).getTime() + diasCredito*24*60*60*1000).toISOString() : null, ubicacionGPS: linkGPS, estado: 'normal', facturado: false };
                ventas.push(nuevaVenta);
                
                filas.forEach(p => {
                    const itemInv = inventario.find(i => i.productoId === p.productoId);
                    if (itemInv) {
                        itemInv.stock -= p.unidades;
                        
                        // PARCHE: Anotar la salida en la bitácora para que el Inventario Inicial cuadre exacto
                        movimientosInventario.push({
                            id: generarIdMovimiento(),
                            fecha: new Date().toISOString(),
                            productoId: p.productoId,
                            productoNombre: p.producto,
                            tipo: 'venta',
                            cantidad: -Math.abs(p.unidades),
                            motivo: 'Venta',
                            stockResultante: itemInv.stock,
                            usuario: nombreUsuario,
                            documento: ventaEditandoId ? 'Edición Factura' : 'Nueva Factura'
                        });
                    }
                });

                saveData();
                ventaEditandoId = null;
                alert('Venta guardada con éxito.');
                
                const correlativo = obtenerCorrelativoRecibo();
                generarComprobanteVenta(nuevaVenta, clienteFinal, correlativo);

                if (tipoVenta === 'Contado') {
                    if (confirm("¿Deseas enviar el comprobante por WhatsApp al cliente?")) {
                        const saludo = obtenerSaludo();
                        let numTel = clienteFinal.telefono ? clienteFinal.telefono.replace(/\D/g, '') : '';
                        let baseUrl = numTel ? `https://wa.me/502${numTel}?text=` : `https://wa.me/?text=`;
                        let mensaje = `¡${saludo}! Esperamos que se encuentre excelente.\n\nDe parte de *MARIJOSE JHIRE S.A.*, le compartimos el detalle de su compra:\n\n📄 *COMPROBANTE DE VENTA CONTADO*\nDoc: ${correlativo}\nFecha: ${new Date(nuevaVenta.fecha).toLocaleDateString()}\nCliente: [Cód: ${clienteFinal.codigo || 'S/C'}] ${clienteFinal.razonSocial}\nNIT: ${clienteFinal.nit || 'C/F'}\n\n*Productos:*\n`;
                        nuevaVenta.productos.forEach(p => { mensaje += `- ${p.unidades} x ${p.producto} a Q${parseFloat(p.precioUnitario).toFixed(2)} c/u = Q${parseFloat(p.monto).toFixed(2)}\n`; });
                        mensaje += `\n*Total Pagado: Q${parseFloat(nuevaVenta.total).toFixed(2)}*\n\nLe enviamos el PDF adjunto. ¡Estamos siempre a sus órdenes para lo que necesite! Un saludo cordial.`;
                        window.open(baseUrl + encodeURIComponent(mensaje), '_blank');
                    }
                }

                limpiarFormularioCompleto();
                mostrarTotalesDia();
            }

            guardarBtn.addEventListener('click', guardarVenta);

            function mostrarTotalesDia() {
                const hoy = new Date().toDateString();
                const ventasHoy = ventas.filter(v => new Date(v.fecha).toDateString() === hoy && v.estado === 'normal');
                let contado = 0, credito = 0;
                ventasHoy.forEach(v => {
                    const t = parseFloat(v.total) || 0;
                    if (v.tipoVenta === 'Contado') contado += t;
                    else credito += t;
                });

                const abonosHoy = abonos.filter(a => new Date(a.fecha).toDateString() === hoy);
                const totalAbonosHoy = abonosHoy.reduce((acc, a) => acc + (a.monto || 0), 0);

                const cobrosHoy = cobros.filter(c => new Date(c.fecha).toDateString() === hoy);
                const totalCobrosHoy = cobrosHoy.reduce((acc, c) => acc + (c.montoTotal || 0), 0);

                const pagosCobroHoy = pagosCobro.filter(p => new Date(p.fecha).toDateString() === hoy);
                const totalPagosCobroHoy = pagosCobroHoy.reduce((acc, p) => acc + (p.monto || 0), 0);

                const container = document.getElementById('totalesDiaContainer');
                container.innerHTML = `
                    <div class="total-item">💰 Ventas hoy<br><span>${formatoQ(contado+credito)}</span></div>
                    <div class="total-item">💵 Contado<br><span>${formatoQ(contado)}</span></div>
                    <div class="total-item">📄 Crédito<br><span>${formatoQ(credito)}</span></div>
                    <div class="total-item">📥 Abonos créditos<br><span>${formatoQ(totalAbonosHoy)}</span></div>
                    <div class="total-item">📄 Cobros creados<br><span>${formatoQ(totalCobrosHoy)}</span></div>
                    <div class="total-item">💰 Pagos cobros<br><span>${formatoQ(totalPagosCobroHoy)}</span></div>
                    <div style="flex: 1 1 100%; margin-top: 12px;"><button id="enviarResumenDiaBtn" class="secondary">📲 Enviar resumen del día por WhatsApp</button></div>
                `;

                document.getElementById('enviarResumenDiaBtn')?.addEventListener('click', () => {
                    exportarBackup();
                    let mensaje = `📋 *RESUMEN DEL DÍA* (${new Date().toLocaleDateString()})\n\n`;
                    if (ventasHoy.length === 0) { mensaje += 'No hay ventas registradas hoy.'; } 
                    else {
                        mensaje += '*VENTAS DEL DÍA*\n';
                        ventasHoy.forEach((v, index) => {
                            const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: 'Cliente desconocido', nit: null, direccion: '', telefono: '', correo: '', codigo: '' };
                            mensaje += `*VENTA ${index+1}*\n[Cód: ${cliente.codigo || 'S/C'}] Razón Social: ${cliente.razonSocial}\nNIT: ${cliente.nit || 'C/F'}\n`;
                            if (cliente.direccion) mensaje += `Dirección: ${cliente.direccion}\n`;
                            mensaje += `Monto Total: ${formatoQ(v.total)}\nTipo de Venta: ${v.tipoVenta}\nDescripción:\n`;
                            v.productos.forEach(p => { mensaje += `- ${p.unidades}, ${p.producto}, ${formatoQ(p.monto)} (${formatoQ(p.precioUnitario)} c/u)\n`; });
                            mensaje += '\n';
                        });
                    }

                    if (abonosHoy.length > 0) {
                        mensaje += '*ABONOS A CRÉDITOS DEL DÍA*\n';
                        abonosHoy.forEach((a, i) => {
                            const venta = ventas.find(v => v.id === a.ventaId);
                            const cliente = venta ? (clientes.find(c => c.id === venta.clienteId) || { razonSocial: '?', codigo: 'S/C' }) : { razonSocial: '?', codigo: 'S/C' };
                            
                            mensaje += `${i+1}. [Cód: ${cliente.codigo || 'S/C'}] ${cliente.razonSocial} - Monto: ${formatoQ(a.monto)} (${a.tipoPago})`;
                            if (venta) mensaje += ` | Saldo restante: ${formatoQ(venta.saldoPendiente)}`;
                            if (a.tipoPago === 'cheque' && a.fechaCobro) mensaje += ` | Fecha cobro: ${new Date(a.fechaCobro).toLocaleDateString()}`;
                            mensaje += '\n';
                        });
                        mensaje += `Total abonado a créditos: ${formatoQ(totalAbonosHoy)}\n\n`;
                    }

                    if (cobrosHoy.length > 0) {
                        mensaje += '*COBROS CREADOS HOY*\n';
                        cobrosHoy.forEach((c, i) => {
                            const cliente = clientes.find(cl => cl.id === c.clienteId) || { razonSocial: '?' };
                            mensaje += `${i+1}. Cliente: ${cliente.razonSocial} (Cód: ${cliente.codigo || 'N/A'})\n   Documento: ${c.numeroDocumento} | Monto total: ${formatoQ(c.montoTotal)} | Saldo: ${formatoQ(c.saldoPendiente)}\n`;
                        });
                        mensaje += `Total cobros creados: ${formatoQ(totalCobrosHoy)}\n\n`;
                    }

                    if (pagosCobroHoy.length > 0) {
                        mensaje += '*PAGOS DE COBROS DEL DÍA*\n';
                        pagosCobroHoy.forEach((p, i) => {
                            const cobro = cobros.find(c => c.id === p.cobroId);
                            const cliente = cobro ? (clientes.find(c => c.id === cobro.clienteId) || { razonSocial: '?' }) : { razonSocial: '?' };
                            mensaje += `${i+1}. Cliente: ${cliente.razonSocial} (Cód: ${cliente.codigo || 'N/A'})\n   Documento: ${cobro ? cobro.numeroDocumento : 'N/A'} | Pago: ${formatoQ(p.monto)} (${p.metodoPago})\n   Saldo pendiente actual: ${formatoQ(cobro ? cobro.saldoPendiente : 0)}\n`;
                        });
                        mensaje += `Total pagado en cobros: ${formatoQ(totalPagosCobroHoy)}\n\n`;
                    }

                    mensaje += `*RESUMEN GLOBAL*\nTotal Ventas: ${formatoQ(contado+credito)}\n  Contado: ${formatoQ(contado)}\n  Crédito: ${formatoQ(credito)}\nTotal Abonos (créditos): ${formatoQ(totalAbonosHoy)}\nTotal Cobros creados: ${formatoQ(totalCobrosHoy)}\nTotal Pagos de cobros: ${formatoQ(totalPagosCobroHoy)}\n`;

                    const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
                    window.open(url, '_blank');
                });
            }
            mostrarTotalesDia();
            renderBusqueda('');
        }
// ========== PESTAÑA VENTAS (Historial) ==========
        function renderVentasHistorial() {
            let html = `
                <h2>📅 Historial de ventas</h2>
                ${mostrarRecordatorios()}
                <div class="action-buttons" style="justify-content: flex-start;">
                    <button id="exportarVentasBtn" class="secondary">📥 Exportar Excel</button>
                    <button id="exportarVentasPdfBtn" class="secondary">📄 Exportar PDF</button>
                    <button id="enviarResumenMensualBtn" class="secondary">📲 WhatsApp Mensual</button>
                    <button id="corregirGpsBtn" class="danger">🛠️ Corregir GPS Antiguos</button>
                </div>
                <div class="filtros-ventas">
                    <select id="filtroMes">
                        <option value="0">Enero</option><option value="1">Febrero</option><option value="2">Marzo</option>
                        <option value="3">Abril</option><option value="4">Mayo</option><option value="5">Junio</option>
                        <option value="6">Julio</option><option value="7">Agosto</option><option value="8">Septiembre</option>
                        <option value="9">Octubre</option><option value="10">Noviembre</option><option value="11">Diciembre</option>
                    </select>
                    <input type="number" id="filtroAnio" placeholder="Año" value="${new Date().getFullYear()}" min="2000" max="2100" style="width: 90px;">
                    <button id="filtroMesBtn" class="secondary small">Filtrar mes</button>
                    <span style="color: #075e54;">o</span>
                    <input type="date" id="filtroFechaInicio"><input type="date" id="filtroFechaFin">
                    <button id="filtroRangoBtn" class="secondary small">Filtrar rango</button>
                    <button id="limpiarFiltrosBtn" class="secondary small">Limpiar</button>
                    <input type="text" id="buscarTextoVentas" placeholder="Buscar por ID o producto" style="flex: 2;">
                    <button id="buscarTextoBtn" class="secondary small">Buscar</button>
                </div>
                <div id="resumenFiltro" style="background: #e3f0fa; border-radius: 24px; padding: 12px; margin-bottom: 20px; font-weight: 600;">
                    Total período: <span id="totalPeriodo">Q0.00</span> (Contado: <span id="totalContadoPeriodo">Q0.00</span> | Crédito: <span id="totalCreditoPeriodo">Q0.00</span>)
                </div>
                <div class="table-responsive">
                        <table>
                        <thead>
                            <tr><th>Fecha</th><th>Código</th><th>NIT</th><th>Cliente</th><th>Productos</th><th>Total</th><th>Tipo</th><th>Saldo</th><th>Vcto</th><th>Facturado</th><th>Estado</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="ventasBody"></tbody>
                       </table>
                </div>
                <div id="paginacionVentas" class="paginacion" style="margin-top: 20px;"></div>
            `;
            document.getElementById('content').innerHTML = html;

            const ventasBody = document.getElementById('ventasBody');
            const totalPeriodo = document.getElementById('totalPeriodo');
            const totalContadoPeriodo = document.getElementById('totalContadoPeriodo');
            const totalCreditoPeriodo = document.getElementById('totalCreditoPeriodo');
            const filtroMes = document.getElementById('filtroMes');
            const filtroAnio = document.getElementById('filtroAnio');
            const filtroFechaInicio = document.getElementById('filtroFechaInicio');
            const filtroFechaFin = document.getElementById('filtroFechaFin');
            const buscarTextoVentas = document.getElementById('buscarTextoVentas');

            let ventasFiltradas = [];
            let paginaVentas = 0;
            const itemsPorPaginaVentas = 5;

            function aplicarFiltro() {
                const mes = parseInt(filtroMes.value);
                const anio = parseInt(filtroAnio.value);
                const inicio = filtroFechaInicio.value;
                const fin = filtroFechaFin.value;
                const textoBusqueda = buscarTextoVentas.value.trim().toLowerCase();

                let base = [...ventas];

                if (inicio && fin) {
                    const start = new Date(inicio + 'T00:00:00');
                    const end = new Date(fin + 'T23:59:59');
                    base = base.filter(v => {
                        const fecha = new Date(v.fecha);
                        return fecha >= start && fecha <= end;
                    });
                } else {
                    const mesValido = !isNaN(mes) && mes >= 0 && mes <= 11;
                    const anioValido = !isNaN(anio) && anio >= 2000;
                    if (mesValido && anioValido) {
                        base = base.filter(v => {
                            const fecha = new Date(v.fecha);
                            return fecha.getMonth() === mes && fecha.getFullYear() === anio;
                        });
                    }
                }

                if (textoBusqueda) {
                    base = base.filter(v => 
                        v.id.toLowerCase().includes(textoBusqueda) ||
                        v.productos.some(p => p.producto.toLowerCase().includes(textoBusqueda))
                    );
                }

                ventasFiltradas = base.sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                paginaVentas = 0;
                mostrarVentas();
                actualizarResumen();
            }

            function mostrarVentas() {
                const inicio = paginaVentas * itemsPorPaginaVentas;
                const fin = inicio + itemsPorPaginaVentas;
                const pagina = ventasFiltradas.slice(inicio, fin);

                ventasBody.innerHTML = '';
                pagina.forEach(v => {
                    const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: 'Desconocido' };
                    const fecha = new Date(v.fecha).toLocaleDateString();
                    const productosStr = v.productos.map(p => `${p.unidades} ${p.producto} (Q${parseFloat(p.precioUnitario).toFixed(2)} c/u)`).join(', ');
                    const saldo = v.tipoVenta === 'Crédito' ? (v.saldoPendiente || 0).toFixed(2) : '—';
                    const vcto = v.fechaVencimiento ? new Date(v.fechaVencimiento).toLocaleDateString() : '—';
                    let estadoTexto = 'Normal';
                    if (v.estado === 'anulada') estadoTexto = 'ANULADA';
                    else if (v.tipoVenta === 'Crédito') {
                        if (v.saldoPendiente === 0) estadoTexto = 'Cancelado';
                        else estadoTexto = 'Crédito Pendiente';
                    } else {
                        estadoTexto = 'Liquidado';
                    }
                    
                    const checkFactura = v.estado !== 'anulada' 
                        ? `<input type="checkbox" class="facturar-checkbox" data-id="${v.id}" ${v.facturado ? 'checked' : ''} style="width:20px; height:20px; cursor:pointer;" title="Marcar como facturado">` 
                        : '—';

                    const tr = document.createElement('tr');
                    if (v.estado === 'anulada') tr.classList.add('anulada');
                    // SIN BOTÓN DE EDICIÓN PARA PROTEGER AUDITORÍA
                    tr.innerHTML = `
                        <td>${fecha}</td><td>${cliente.codigo || '—'}</td><td>${cliente.nit || 'C/F'}</td><td>${cliente.razonSocial}</td><td>${productosStr}</td><td>${formatoQ(v.total)}</td><td>${v.tipoVenta}</td><td>${saldo !== '—' ? 'Q' + saldo : '—'}</td><td>${vcto}</td><td style="text-align:center;">${checkFactura}</td><td><span class="estado-badge" style="background: ${v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 ? '#ff9800' : '#2e7d32'}">${estadoTexto}</span></td>
                        <td>${v.estado !== 'anulada' ? `<button class="danger small anularVentaBtn" data-id="${v.id}" title="Anular Factura">🚫</button><button class="secondary small whatsappVentaBtn" data-id="${v.id}" title="Enviar WhatsApp">📲</button>${v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 ? `<button class="secondary small abonoVentaBtn" data-id="${v.id}" title="Abonar">💰</button>` : ''}` : '—'}</td>
                    `;
                    ventasBody.appendChild(tr);
                });

                const totalPaginas = Math.ceil(ventasFiltradas.length / itemsPorPaginaVentas);
                let paginacionHtml = '';
                if (totalPaginas > 1) {
                    paginacionHtml += `<button class="secondary small" id="paginaVentasAnterior" ${paginaVentas === 0 ? 'disabled' : ''}>⬅ Anterior</button>`;
                    paginacionHtml += `<span> Página ${paginaVentas+1} de ${totalPaginas} </span>`;
                    paginacionHtml += `<button class="secondary small" id="paginaVentasSiguiente" ${paginaVentas >= totalPaginas-1 ? 'disabled' : ''}>Siguiente ➔</button>`;
                }
                document.getElementById('paginacionVentas').innerHTML = paginacionHtml;

                document.getElementById('paginaVentasAnterior')?.addEventListener('click', () => {
                    if (paginaVentas > 0) { paginaVentas--; mostrarVentas(); }
                });
                document.getElementById('paginaVentasSiguiente')?.addEventListener('click', () => {
                    if (paginaVentas < totalPaginas-1) { paginaVentas++; mostrarVentas(); }
                });

                document.querySelectorAll('.facturar-checkbox').forEach(cb => {
                    cb.addEventListener('change', (e) => {
                        const id = e.target.dataset.id;
                        const venta = ventas.find(v => v.id === id);
                        if (venta) { venta.facturado = e.target.checked; saveData(); }
                    });
                });

                document.querySelectorAll('.anularVentaBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const venta = ventas.find(v => v.id === id);
                        if (!venta) return;
                        if (confirm(`¿Anular venta del ${new Date(venta.fecha).toLocaleDateString()} por ${clientes.find(c => c.id === venta.clienteId)?.razonSocial || '?'}? Se revertirá el inventario y no se podrá editar.`)) {
                            venta.productos.forEach(p => {
                                const itemInv = inventario.find(i => i.productoId === p.productoId);
                                if (itemInv) {
                                    itemInv.stock += p.unidades;
                                    movimientosInventario.push({
                                        id: generarIdMovimiento(),
                                        fecha: new Date().toISOString(),
                                        productoId: p.productoId,
                                        productoNombre: p.producto,
                                        tipo: 'ajuste',
                                        cantidad: p.unidades,
                                        motivo: 'Anulación de venta ' + id,
                                        stockResultante: itemInv.stock,
                                        usuario: nombreUsuario,
                                        documento: `Anulación venta ${id}`
                                    });
                                }
                            });
                            venta.estado = 'anulada';
                            saveData();
                            aplicarFiltro();
                        }
                    });
                });

                document.querySelectorAll('.whatsappVentaBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const venta = ventas.find(v => v.id === id);
                        if (!venta) return;
                        const cliente = clientes.find(c => c.id === venta.clienteId) || { razonSocial: 'Desconocido', nit: null, direccion: '', telefono: '', correo: '', codigo: '' };
                        
                        const saludo = obtenerSaludo();
                        let mensaje = `¡${saludo}! Esperamos que se encuentre excelente.\n\nDe parte de *MARIJOSE JHIRE S.A.*, le compartimos el detalle de su compra:\n\n`;
                        mensaje += `📄 *DETALLE DE VENTA*\n`;
                        mensaje += `Fecha: ${new Date(venta.fecha).toLocaleDateString()}\n`;
                        mensaje += `Cliente: [Cód: ${cliente.codigo || 'S/C'}] ${cliente.razonSocial}\n`;
                        mensaje += `NIT: ${cliente.nit || 'C/F'}\n`;
                        if (cliente.direccion) mensaje += `Dirección: ${cliente.direccion}\n`;
                        mensaje += `\n*Productos:*\n`;
                        venta.productos.forEach(p => {
                            mensaje += `- ${p.unidades} x ${p.producto} a ${formatoQ(p.precioUnitario)} c/u = ${formatoQ(p.monto)}\n`;
                        });
                        mensaje += `\n*Total: ${formatoQ(venta.total)}*\n`;
                        mensaje += `Tipo: ${venta.tipoVenta}`;
                        if (venta.tipoVenta === 'Crédito') {
                            mensaje += `\nSaldo pendiente: Q${(venta.saldoPendiente || 0).toFixed(2)}`;
                            mensaje += `\nVence: ${new Date(venta.fechaVencimiento).toLocaleDateString()}`;
                        }
                        
                        let numTel = cliente.telefono ? cliente.telefono.replace(/\D/g, '') : '';
                        let baseUrl = numTel ? `https://wa.me/502${numTel}?text=` : `https://wa.me/?text=`;
                        window.open(baseUrl + encodeURIComponent(mensaje), '_blank');
                    });
                });

                document.querySelectorAll('.abonoVentaBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const ventaId = btn.dataset.id;
                        mostrarFormularioAbono(ventaId);
                    });
                });
            }

            function actualizarResumen() {
                let total = 0, contado = 0, credito = 0;
                ventasFiltradas.forEach(v => {
                    if (v.estado === 'anulada') return;
                    const t = parseFloat(v.total) || 0;
                    total += t;
                    if (v.tipoVenta === 'Contado') contado += t;
                    else credito += t;
                });
                totalPeriodo.innerText = formatoQ(total);
                totalContadoPeriodo.innerText = formatoQ(contado);
                totalCreditoPeriodo.innerText = formatoQ(credito);
            }

            const hoy = new Date();
            filtroMes.value = hoy.getMonth();
            filtroAnio.value = hoy.getFullYear();
            aplicarFiltro();

            document.getElementById('filtroMesBtn').addEventListener('click', aplicarFiltro);
            document.getElementById('filtroRangoBtn').addEventListener('click', aplicarFiltro);
            document.getElementById('limpiarFiltrosBtn').addEventListener('click', () => {
                filtroFechaInicio.value = '';
                filtroFechaFin.value = '';
                filtroMes.value = hoy.getMonth();
                filtroAnio.value = hoy.getFullYear();
                buscarTextoVentas.value = '';
                aplicarFiltro();
            });
            document.getElementById('buscarTextoBtn').addEventListener('click', aplicarFiltro);

            document.getElementById('exportarVentasBtn').addEventListener('click', () => {
                const wb = XLSX.utils.book_new();
                const ventasData = ventasFiltradas.map(v => {
                    const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: '?', codigo: '', nit: '' };
                    return {
                        Fecha: new Date(v.fecha).toLocaleDateString(),
                        'Código Cliente': cliente.codigo || '',
                        'NIT': cliente.nit || 'C/F',
                        Cliente: cliente.razonSocial,
                        'Tipo Venta': v.tipoVenta,
                        Total: v.total,
                        Saldo: v.saldoPendiente || 0,
                        Vencimiento: v.fechaVencimiento ? new Date(v.fechaVencimiento).toLocaleDateString() : '',
                        Facturado: v.facturado ? 'Sí' : 'No',
                        Productos: v.productos.map(p => `${p.unidades} ${p.producto} (Q${parseFloat(p.precioUnitario).toFixed(2)} c/u)`).join(', '),
                        Estado: v.estado || 'normal'
                    };
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(ventasData), 'Ventas');
                const metadata = [
                    { Campo: 'Vendedor', Valor: nombreUsuario },
                    { Campo: 'Fecha de exportación', Valor: new Date().toLocaleString() },
                    { Campo: 'ID de reporte', Valor: obtenerCorrelativoReporte() }
                ];
