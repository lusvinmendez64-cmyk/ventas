                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(metadata), 'Metadata');
                XLSX.writeFile(wb, `ventas_${new Date().toISOString().slice(0,10)}.xlsx`);
            });

            document.getElementById('exportarVentasPdfBtn').addEventListener('click', () => {
                let fInicio = new Date(filtroAnio.value, filtroMes.value, 1);
                let fFin = new Date(filtroAnio.value, parseInt(filtroMes.value) + 1, 0);
                if (filtroFechaInicio.value && filtroFechaFin.value) {
                    fInicio = new Date(filtroFechaInicio.value + 'T00:00:00');
                    fFin = new Date(filtroFechaFin.value + 'T23:59:59');
                }
                generarReporteDetalladoPDF('mes', fInicio, fFin);
            });

           // --- INICIO DEL PARCHE TEMPORAL PARA CORREGIR GPS ---
            document.getElementById('corregirGpsBtn')?.addEventListener('click', () => {
                let corregidos = 0;
                
                ventas.forEach(v => {
                    // Si el enlace tiene la estructura vieja o no empieza con el formato oficial
                    if (v.ubicacionGPS && (v.ubicacionGPS.includes('googleusercontent') || !v.ubicacionGPS.startsWith('https://www.google.com/maps'))) {
                        
                        // Extraemos estrictamente los números de las coordenadas (latitud y longitud)
                        const coordenadasMatch = v.ubicacionGPS.match(/-?\d+\.\d+,-?\d+\.\d+/);
                        
                        if (coordenadasMatch) {
                            // Construimos el enlace oficial, limpio y sin caracteres extraños
                            let linkLimpio = `https://www.google.com/maps?q=${coordenadasMatch[0]}`;
                            
                            if (v.ubicacionGPS !== linkLimpio) {
                                v.ubicacionGPS = linkLimpio;
                                corregidos++;
                            }
                        }
                    }
                });

                if (corregidos > 0) {
                    saveData(); 
                    alert(`✅ ¡Sincronización perfecta! Se reconstruyeron ${corregidos} enlaces. Ahora todos abren directamente en Google Maps.`);
                    aplicarFiltro(); 
                } else {
                    alert('No se encontraron registros con errores en el GPS o ya fueron corregidos.');
                }
            });
            // --- FIN DEL PARCHE TEMPORAL ---

            document.getElementById('enviarResumenMensualBtn').addEventListener('click', () => {
                const mes = parseInt(filtroMes.value);
                const anio = parseInt(filtroAnio.value);
                const nombreMes = filtroMes.options[filtroMes.selectedIndex].text;
                let mensaje = `📊 *RESUMEN DE VENTAS - ${nombreMes} ${anio}*\n\n`;
                const ventasMes = ventasFiltradas.filter(v => v.estado !== 'anulada');
                if (ventasMes.length === 0) {
                    mensaje += 'No hay ventas en este período.';
                } else {
                    ventasMes.forEach((v, i) => {
                        const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: '?', codigo: '', nit: '' };
                        mensaje += `${i+1}. ${new Date(v.fecha).toLocaleDateString()} - [${cliente.codigo || 'S/C'}] ${cliente.razonSocial} (NIT: ${cliente.nit || 'C/F'}): ${formatoQ(v.total)} (${v.tipoVenta}) - ${v.facturado ? '[FACTURADO]' : '[Pendiente Facturar]'}\n`;
                    });
                    mensaje += `\n*Totales*\n`;
                    mensaje += `Total: ${totalPeriodo.innerText}\n`;
                    mensaje += `Contado: ${totalContadoPeriodo.innerText}\n`;
                    mensaje += `Crédito: ${totalCreditoPeriodo.innerText}`;
                }
                const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
                window.open(url, '_blank');
            });
        }

        // ========== FORMULARIO ABONO ==========
        function mostrarFormularioAbono(ventaId) {
            const venta = ventas.find(v => v.id === ventaId);
            if (!venta) return;
            const cliente = clientes.find(c => c.id === venta.clienteId) || { razonSocial: '?' };

            const modal = document.getElementById('abonoModal');
            const content = document.getElementById('abonoContent');
            content.innerHTML = `
                <h3>Registrar abono</h3>
                <p>Venta: ${new Date(venta.fecha).toLocaleDateString()} - ${cliente.razonSocial}</p>
                <p>Total: ${formatoQ(venta.total)} | Saldo pendiente: ${formatoQ(venta.saldoPendiente)}</p>
                <label>Monto del abono: <input type="number" id="abonoMonto" step="0.01" min="0.01" max="${venta.saldoPendiente}"></label>
                <label>Tipo de pago: <select id="abonoTipoPago"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option><option value="transferencia">Transferencia</option></select></label>
                <div id="chequeOpciones" style="display:none; margin-top:10px;"><div class="flex-row"><label class="checkbox-label"><input type="radio" name="chequeTipo" value="hoy" checked> Cheque del día</label><label class="checkbox-label"><input type="radio" name="chequeTipo" value="futuro"> Cheque posfechado</label></div><div id="fechaChequeContainer" style="display:none;"><label>Fecha de cobro: <input type="date" id="fechaCheque"></label></div></div>
                <div style="margin-top:20px; display:flex; gap:10px;"><button id="guardarAbonoBtn" class="secondary">Guardar abono</button><button id="cancelarAbonoBtn" class="secondary small">Cancelar</button></div>
            `;
            modal.style.display = 'flex';

            const tipoPago = document.getElementById('abonoTipoPago');
            const chequeOpciones = document.getElementById('chequeOpciones');
            const fechaChequeContainer = document.getElementById('fechaChequeContainer');
            const radioChequeHoy = document.querySelector('input[name="chequeTipo"][value="hoy"]');
            const radioChequeFuturo = document.querySelector('input[name="chequeTipo"][value="futuro"]');

            tipoPago.addEventListener('change', () => {
                if (tipoPago.value === 'cheque') {
                    chequeOpciones.style.display = 'block';
                } else {
                    chequeOpciones.style.display = 'none';
                }
            });
            radioChequeHoy.addEventListener('change', () => { fechaChequeContainer.style.display = 'none'; });
            radioChequeFuturo.addEventListener('change', () => { fechaChequeContainer.style.display = 'block'; });

            document.getElementById('guardarAbonoBtn').addEventListener('click', () => {
                const monto = parseFloat(document.getElementById('abonoMonto').value);
                if (isNaN(monto) || monto <= 0 || monto > venta.saldoPendiente) {
                    alert('Monto no válido');
                    return;
                }
                const tipo = tipoPago.value;
                let fechaCobro = null;
                let estado = 'cobrado';

                if (tipo === 'cheque') {
                    if (radioChequeFuturo.checked) {
                        fechaCobro = document.getElementById('fechaCheque').value;
                        if (!fechaCobro) {
                            alert('Debe ingresar fecha de cobro para cheque posfechado');
                            return;
                        }
                        estado = 'pendiente';
                    } else {
                        fechaCobro = new Date().toISOString().slice(0,10);
                        estado = 'cobrado';
                    }
                }

                const nuevoAbono = {
                    id: generarIdAbono(),
                    ventaId: venta.id,
                    fecha: new Date().toISOString(),
                    monto,
                    tipoPago: tipo,
                    fechaCobro,
                    estado
                };
                abonos.push(nuevoAbono);

                venta.saldoPendiente = redondearDinero(venta.saldoPendiente - monto);
                if (venta.saldoPendiente <= 0) { 
                    venta.saldoPendiente = 0; 
                    if (!venta.fechaCancelacion) venta.fechaCancelacion = new Date().toISOString();
                    
                    // REGLA INTELIGENTE: Convertir a Contado si se liquida en la misma semana
                    const obtenerLunes = (d) => { const date = new Date(d); const day = date.getDay(); const diff = date.getDate() - day + (day === 0 ? -6 : 1); return new Date(date.setDate(diff)).setHours(0,0,0,0); };
                    if (obtenerLunes(venta.fecha) === obtenerLunes(new Date())) {
                        venta.tipoVenta = 'Contado';
                        venta.diasCredito = 0;
                    }
                }

                saveData();
                alert('Abono registrado');
                modal.style.display = 'none';
                
                const activeTab = document.querySelector('.tab.active').dataset.tab;
                if (activeTab === 'ventas') renderVentasHistorial();
                if (activeTab === 'inventario') renderInventario();
                if (activeTab === 'catalogo') renderCatalogo();
            });

            document.getElementById('cancelarAbonoBtn').addEventListener('click', () => { modal.style.display = 'none'; });
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        }

        // ========== PESTAÑA CATÁLOGO ==========
        function renderCatalogo() {
            let html = `
                <h2>📇 Directorio Ejecutivo de Clientes</h2>
                ${mostrarRecordatorios()}
                <div class="action-buttons" style="justify-content: flex-start;">
                    <button id="exportarPdfBtn" class="secondary">📄 Exportar Directorio PDF</button>
                    <button id="exportarExcelBtn" class="secondary">📥 Exportar Excel</button>
                </div>
                <div class="buscador"><input type="text" id="buscarClienteCatalogo" placeholder="Buscar por nombre o código..."></div>
                <div class="sub-tabs"><div class="sub-tab active" data-vista="todos">Todos</div><div class="sub-tab" data-vista="credito">Crédito</div><div class="sub-tab" data-vista="contado">Contado</div></div>
                <div style="display: flex; gap: 10px; margin: 15px 0;"><input type="text" id="filtroCategoria" placeholder="Filtrar por categoría"><input type="text" id="filtroRuta" placeholder="Filtrar por ruta/zona"><button id="aplicarFiltrosCat" class="secondary small">Aplicar filtros</button></div>
                <div class="table-responsive">
                    <table class="clientes-ejecutivos-table">
                        <thead>
                            <tr>
                                <th style="width: 20%">Cliente</th>
                                <th style="width: 8%">Código</th>
                                <th style="width: 10%">NIT</th>
                                <th style="width: 15%">Dirección</th>
                                <th style="width: 12%">Teléfono</th>
                                <th style="width: 12%">Estado Venta</th>
                                <th style="width: 13%">Comportamiento</th>
                                <th style="width: 10%">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientesTablaBody"></tbody>
                    </table>
                </div>
                <div id="paginacionClientesCatalogo" class="paginacion" style="margin-top:20px;"></div>
            `;
            document.getElementById('content').innerHTML = html;

            const tbody = document.getElementById('clientesTablaBody');
            const paginacionDiv = document.getElementById('paginacionClientesCatalogo');
            const buscarInput = document.getElementById('buscarClienteCatalogo');
            const subTabs = document.querySelectorAll('.sub-tab');

            let vistaActual = 'todos';
            let paginaActual = 0;
            const itemsPorPagina = 10;
            let clientesFiltrados = [];

            function obtenerComportamiento(clienteId) {
                const ventasCliente = ventas.filter(v => v.clienteId === clienteId && v.estado === 'normal');
                const tieneCreditoPendiente = ventasCliente.some(v => v.tipoVenta === 'Crédito' && v.saldoPendiente > 0);
                if (!tieneCreditoPendiente) return { texto: 'Contado', clase: 'comportamiento-contado' };
                
                const hoy = new Date();
                let maxDiasMora = 0;
                ventasCliente.forEach(v => {
                    if (v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 && v.fechaVencimiento) {
                        const venc = new Date(v.fechaVencimiento);
                        const diasMora = Math.ceil((hoy - venc) / (1000*60*60*24));
                        if (diasMora > maxDiasMora) maxDiasMora = diasMora;
                    }
                });
                if (maxDiasMora > 0) return { texto: 'Con mora', clase: 'comportamiento-con-mora' };
                return { texto: 'Al día', clase: 'comportamiento-al-dia' };
            }

            function filtrarClientes() {
                const termino = buscarInput.value.toLowerCase().trim();
                const catFiltro = document.getElementById('filtroCategoria').value.toLowerCase().trim();
                const rutaFiltro = document.getElementById('filtroRuta').value.toLowerCase().trim();
                let base = clientes;
                
                if (vistaActual === 'credito') base = clientes.filter(c => ventas.some(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 && v.estado === 'normal'));
                else if (vistaActual === 'contado') base = clientes.filter(c => !ventas.some(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 && v.estado === 'normal'));

                if (termino) base = base.filter(c => c.razonSocial.toLowerCase().includes(termino) || (c.codigo && c.codigo.toLowerCase().includes(termino)));
                if (catFiltro) base = base.filter(c => (c.categoria || '').toLowerCase().includes(catFiltro));
                if (rutaFiltro) base = base.filter(c => (c.ruta || '').toLowerCase().includes(rutaFiltro));
                
                clientesFiltrados = [...base];
                paginaActual = 0;
                renderTabla();
            }

            function renderTabla() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const clientesPagina = clientesFiltrados.slice(inicio, fin);

                tbody.innerHTML = '';
                clientesPagina.forEach(cli => {
                    const comportamiento = obtenerComportamiento(cli.id);
                    const promedio = obtenerPromedioCalificaciones(cli.id);
                    const estrellas = promedio ? `<br><span style="font-size:0.75rem; color:#ffc107;">⭐ ${promedio.contado.toFixed(1)}</span>` : '<br><span style="font-size:0.7rem; color:#888;">Sin calif.</span>';

                    const saldoTotalCliente = ventas.filter(v => v.clienteId === cli.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    const estadoVenta = saldoTotalCliente > 0 
                        ? `<span style="color: #c62828; font-weight: 600;">Pendiente<br>(Q${saldoTotalCliente.toFixed(2)})</span>` 
                        : `<span style="color: #2e7d32; font-weight: 600;">Liquidado</span>`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${cli.razonSocial} ${estrellas}</td>
                        <td>${cli.codigo || '—'}</td>
                        <td>${cli.nit || 'C/F'}</td>
                        <td>${cli.direccion || '—'}</td>
                        <td>${cli.telefono || '—'}</td>
                        <td>${estadoVenta}</td>
                        <td><span class="${comportamiento.clase}">${comportamiento.texto}</span></td>
                        <td>
                            <button class="secondary small historialClienteBtn" data-id="${cli.id}" title="Historial de Compras" style="margin-bottom:2px; min-width:35px;">📜</button>
                            <button class="secondary small calificarClienteBtn" data-id="${cli.id}" title="Calificar" style="margin-bottom:2px; min-width:35px;">⭐</button>
                            <button class="secondary small editarClienteBtn" data-id="${cli.id}" title="Editar" style="margin-bottom:2px; min-width:35px;">✏️</button> 
                            <button class="secondary small estadoCuentaBtn" data-id="${cli.id}" title="Estado de Cuenta" style="margin-bottom:2px; min-width:35px;">📊</button> 
                            <button class="danger small eliminarClienteBtn" data-id="${cli.id}" title="Eliminar" style="margin-bottom:2px; min-width:35px;">🗑</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                const totalPaginas = Math.ceil(clientesFiltrados.length / itemsPorPagina);
                let paginacionHtml = '';
                if (totalPaginas > 1) {
                    paginacionHtml += `<button class="secondary small" id="paginaAnteriorCat" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Ant</button>`;
                    paginacionHtml += `<span> Pág ${paginaActual+1} de ${totalPaginas} </span>`;
                    paginacionHtml += `<button class="secondary small" id="paginaSiguienteCat" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Sig ➔</button>`;
                }
                paginacionDiv.innerHTML = paginacionHtml;

                document.getElementById('paginaAnteriorCat')?.addEventListener('click', () => { if (paginaActual > 0) { paginaActual--; renderTabla(); } });
                document.getElementById('paginaSiguienteCat')?.addEventListener('click', () => { if (paginaActual < totalPaginas-1) { paginaActual++; renderTabla(); } });

                document.querySelectorAll('.historialClienteBtn').forEach(btn => btn.addEventListener('click', () => generarHistorialClientePDF(btn.dataset.id)));
                
                document.querySelectorAll('.calificarClienteBtn').forEach(btn => btn.addEventListener('click', () => mostrarModalCalificacion(btn.dataset.id)));
                
                document.querySelectorAll('.editarClienteBtn').forEach(btn => btn.addEventListener('click', () => {
                    const cli = clientes.find(c => c.id === btn.dataset.id);
                    if (cli) mostrarModalEditarCliente(cli);
                }));

                document.querySelectorAll('.estadoCuentaBtn').forEach(btn => btn.addEventListener('click', () => mostrarEstadoCuenta(btn.dataset.id)));

                document.querySelectorAll('.eliminarClienteBtn').forEach(btn => btn.addEventListener('click', () => {
                    const cli = clientes.find(c => c.id === btn.dataset.id);
                    if (cli && confirm(`¿Eliminar al cliente ${cli.razonSocial} y todas sus ventas? Esta acción es irreversible.`)) {
                        ventas = ventas.filter(v => v.clienteId !== cli.id);
                        clientes = clientes.filter(c => c.id !== cli.id);
                        saveData();
                        filtrarClientes();
                    }
                }));
            }

            subTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    subTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    vistaActual = tab.dataset.vista;
                    filtrarClientes();
                });
            });
            buscarInput.addEventListener('input', filtrarClientes);
            document.getElementById('aplicarFiltrosCat').addEventListener('click', filtrarClientes);
            filtrarClientes();

            document.getElementById('exportarExcelBtn').addEventListener('click', () => {
                const wb = XLSX.utils.book_new();
                const clientesData = clientes.map(c => {
                    const comportamiento = obtenerComportamiento(c.id);
                    const saldoTotalCliente = ventas.filter(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    return {
                        'Razón Social': c.razonSocial, Código: c.codigo || '', NIT: c.nit || 'C/F', Dirección: c.direccion || '', Teléfono: c.telefono || '',
                        'Estado': saldoTotalCliente > 0 ? 'Pendiente' : 'Liquidado', 'Saldo Pendiente (Q)': saldoTotalCliente, Comportamiento: comportamiento.texto, Categoría: c.categoria || '', Ruta: c.ruta || ''
                    };
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientesData), 'Clientes');
                XLSX.writeFile(wb, `clientes_${new Date().toISOString().slice(0,10)}.xlsx`);
            });

            // Directorio PDF con soporte GPS interactivo
            document.getElementById('exportarPdfBtn').addEventListener('click', () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', format: 'letter' });
                
                doc.setFillColor(7, 94, 84);
                doc.rect(0, 0, doc.internal.pageSize.getWidth(), 18, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.setFont('helvetica', 'bold');
                doc.text('MARIJOSE JHIRE S.A. - DIRECTORIO DE CLIENTES', 14, 12);

                const tableColumn = ['Cliente', 'NIT', 'Dirección', 'Teléfono', 'Ruta', 'Estado', 'Ubicación GPS'];
                
                const tableRows = clientesFiltrados.map(c => {
                    const saldo = ventas.filter(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    
                    const ventasCli = ventas.filter(v => v.clienteId === c.id).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                    const gpsLink = (ventasCli.length > 0 && ventasCli[0].ubicacionGPS) ? ventasCli[0].ubicacionGPS : 'Sin ubicación';

                    return [
                        c.razonSocial, c.nit || 'C/F', c.direccion || '—', c.telefono || '—', c.ruta || '—',
                        saldo > 0 ? `Pendiente (Q${saldo.toFixed(2)})` : 'Liquidado',
                        gpsLink
                    ];
                });
                
                doc.autoTable({
                    startY: 25, 
                    head: [tableColumn], 
                    body: tableRows, 
                    theme: 'striped',
                    headStyles: { fillColor: [7, 94, 84], textColor: 255 }, 
                    styles: { fontSize: 8 },
                    columnStyles: { 6: { textColor: [0, 0, 255], fontStyle: 'italic' } }, 
                    didDrawCell: function(data) {
                        if (data.section === 'body' && data.column.index === 6 && data.cell.raw !== 'Sin ubicación' && data.cell.raw !== 'Sin ubicación GPS') {
                            doc.link(data.cell.x, data.cell.y, data.cell.width, data.cell.height, { url: data.cell.raw });
                        }
                    }
                });
                doc.save(`Directorio_${new Date().toISOString().slice(0,10)}.pdf`);
            });
        }

        function generarHistorialClientePDF(clienteId) {
            const cliente = clientes.find(c => c.id === clienteId);
            if (!cliente) return;
            const ventasCliente = ventas.filter(v => v.clienteId === clienteId && v.estado === 'normal').sort((a,b) => new Date(a.fecha) - new Date(b.fecha));
            if (ventasCliente.length === 0) { alert('Este cliente aún no tiene compras.'); return; }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', format: 'letter' });
            
            doc.setFillColor(7, 94, 84);
            doc.rect(0, 0, doc.internal.pageSize.getWidth(), 18, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(14);
            doc.setFont('helvetica', 'bold');
            doc.text('MARIJOSE JHIRE S.A. - HISTORIAL DE COMPRAS', 14, 12);
            
            doc.setTextColor(0);
            doc.setFontSize(10);
            doc.setFont('helvetica', 'normal');
            doc.text(`Cliente: ${cliente.razonSocial} | NIT: ${cliente.nit || 'C/F'}`, 14, 25);
            doc.text(`Fecha de emisión: ${new Date().toLocaleString()}`, doc.internal.pageSize.getWidth() - 14, 25, { align: 'right' });

            let body = [];
            let granTotal = 0;
            let totalUnidades = 0;
            ventasCliente.forEach(v => {
                v.productos.forEach(p => {
                    body.push([
                        new Date(v.fecha).toLocaleDateString(), v.id.substr(0,8), v.tipoVenta, p.producto, p.unidades.toString(), formatoQ(p.precioUnitario), formatoQ(p.monto)
                    ]);
                    granTotal += (parseFloat(p.monto) || 0);
                    totalUnidades += p.unidades;
                });
            });

            body.push(['GRAN TOTAL', '', '', '', totalUnidades.toString(), '', formatoQ(granTotal)]);

            doc.autoTable({
                startY: 35,
                head: [['Fecha', 'ID Venta', 'Tipo', 'Producto', 'Cant.', 'Precio U.', 'Subtotal']],
                body: body,
                theme: 'striped',
                headStyles: { fillColor: [7, 94, 84], textColor: 255 },
                styles: { fontSize: 8 },
                willDrawCell: function(data) {
                    if (data.row.index === body.length - 1) {
                        doc.setFillColor(230, 245, 235);
                        doc.setFont('helvetica', 'bold');
                    }
                }
            });
            doc.save(`Historial_${cliente.razonSocial.substring(0,10)}.pdf`);
        }

        function mostrarModalEditarCliente(cliente) {
            const modal = document.getElementById('editarClienteModal');
            const content = document.getElementById('editarClienteContent');
            
            content.innerHTML = `
                <h3>Editar cliente</h3>
                <label>Código: <input type="text" id="editCodigo" value="${cliente.codigo || ''}"></label>
                <label>Razón Social <span class="req">*</span>: <input type="text" id="editRazon" value="${cliente.razonSocial}"></label>
                <label>NIT: <input type="text" id="editNit" value="${cliente.nit || 'C/F'}"></label>
                <label>Dirección <span class="req">*</span>: <input type="text" id="editDireccion" value="${cliente.direccion || ''}"></label>
                <label>Teléfono <span class="req">*</span>: <input type="tel" id="editTelefono" value="${cliente.telefono || ''}"></label>
                <label>Correo: <input type="email" id="editCorreo" value="${cliente.correo || ''}"></label>
                <label>Categoría <span class="req">*</span>: <select id="editCategoria"><option value="">Seleccionar</option><option value="Clínica" ${cliente.categoria === 'Clínica' ? 'selected' : ''}>Clínica</option><option value="Farmacia" ${cliente.categoria === 'Farmacia' ? 'selected' : ''}>Farmacia</option><option value="Hospital" ${cliente.categoria === 'Hospital' ? 'selected' : ''}>Hospital</option><option value="Otro" ${cliente.categoria === 'Otro' ? 'selected' : ''}>Otro</option></select></label>
                <label>Ruta/Zona <span class="req">*</span>: <input type="text" id="editRuta" value="${cliente.ruta || ''}"></label>
                <label>Límite de crédito (Q): <input type="number" id="editLimiteCredito" step="0.01" value="${cliente.limiteCredito !== null ? cliente.limiteCredito : ''}"></label>
                <div style="margin-top:20px; display:flex; gap:10px;"><button id="guardarEdicionCliente" class="secondary">Guardar</button><button id="cancelarEdicionCliente" class="secondary small">Cancelar</button></div>
            `;
            modal.style.display = 'flex';

            document.getElementById('guardarEdicionCliente').addEventListener('click', () => {
                const razon = document.getElementById('editRazon').value.trim();
                const dir = document.getElementById('editDireccion').value.trim();
                const tel = document.getElementById('editTelefono').value.trim();
                const cat = document.getElementById('editCategoria').value;
                const ruta = document.getElementById('editRuta').value.trim();

                if (!razon || !dir || !tel || !cat || !ruta) {
                    alert('Por favor completa todos los campos obligatorios (*).');
                    return;
                }

                cliente.codigo = document.getElementById('editCodigo').value.trim();
                cliente.razonSocial = razon;
                cliente.nit = document.getElementById('editNit').value.trim();
                cliente.direccion = dir;
                cliente.telefono = tel;
                cliente.correo = document.getElementById('editCorreo').value.trim();
                cliente.categoria = cat;
                cliente.ruta = ruta;
                cliente.limiteCredito = document.getElementById('editLimiteCredito').value ? parseFloat(document.getElementById('editLimiteCredito').value) : null;
                
                saveData();
                modal.style.display = 'none';
                renderCatalogo();
            });

            document.getElementById('cancelarEdicionCliente').addEventListener('click', () => { modal.style.display = 'none'; });
        }

        function mostrarModalCalificacion(clienteId) {
            const cliente = clientes.find(c => c.id === clienteId);
            if (!cliente) return;
            const modal = document.getElementById('calificacionModal');
            const content = document.getElementById('calificacionContent');
            
            const califsCliente = calificacionesClientes.filter(c => c.clienteId === cliente.id).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            let historialHtml = '';
            if(califsCliente.length > 0) {
                historialHtml = `<div class="calificacion-lista" style="margin-top: 15px; max-height: 150px; overflow-y: auto;"><strong>Historial de Calificaciones:</strong>`;
                califsCliente.forEach(cal => {
                    historialHtml += `<div class="calificacion-item"><strong>${new Date(cal.fecha).toLocaleDateString()} (${cal.usuario}):</strong> Contado: ${cal.calificacionContado}★, Crédito: ${cal.calificacionCredito}★<br><em>${cal.comentario || 'Sin comentario'}</em><button class="small danger eliminarCalificacionBtn" data-id="${cal.id}" style="font-size: 0.7rem; margin-left: 8px;">🗑 Eliminar</button></div>`;
                });
                historialHtml += `</div>`;
            }

            content.innerHTML = `
                <h3>Calificar a ${cliente.razonSocial}</h3>
                <label>Calificación pagos al contado (1-5): <input type="number" id="califContado" min="1" max="5" step="1" value="5"></label>
                <label>Calificación pagos al crédito (1-5): <input type="number" id="califCredito" min="1" max="5" step="1" value="5"></label>
                <label>Comentario: <textarea id="califComentario" rows="3" placeholder="Observaciones sobre el comportamiento de pago..."></textarea></label>
                <div style="margin-top:20px; display:flex; gap:10px;"><button id="guardarCalificacionBtn" class="secondary">Guardar Calificación</button><button id="cancelarCalificacionBtn" class="secondary small">Cancelar</button></div>
                ${historialHtml}
            `;
            modal.style.display = 'flex';

            document.getElementById('guardarCalificacionBtn').addEventListener('click', () => {
                const califContado = parseInt(document.getElementById('califContado').value);
                const califCredito = parseInt(document.getElementById('califCredito').value);
                const comentario = document.getElementById('califComentario').value.trim();
                if (isNaN(califContado) || califContado < 1 || califContado > 5 || isNaN(califCredito) || califCredito < 1 || califCredito > 5) {
                    alert('Las calificaciones deben ser números entre 1 y 5'); return;
                }
                const nuevaCalificacion = {
                    id: generarIdCalificacion(),
                    clienteId: cliente.id,
                    calificacionContado: califContado,
                    calificacionCredito: califCredito,
                    comentario: comentario,
                    fecha: new Date().toISOString(),
                    usuario: nombreUsuario
                };
                calificacionesClientes.push(nuevaCalificacion);
                saveData();
                modal.style.display = 'none';
                renderCatalogo();
            });
            
            document.querySelectorAll('.eliminarCalificacionBtn').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (confirm('¿Eliminar esta calificación?')) {
                        calificacionesClientes = calificacionesClientes.filter(c => c.id !== b.dataset.id);
                        saveData();
                        modal.style.display = 'none';
                        renderCatalogo();
                    }
                });
            });

            document.getElementById('cancelarCalificacionBtn').addEventListener('click', () => { modal.style.display = 'none'; });
        }

        function obtenerPromedioCalificaciones(clienteId) {
            const califs = calificacionesClientes.filter(c => c.clienteId === clienteId);
            if (califs.length === 0) return null;
            let sumContado = 0, sumCredito = 0;
            califs.forEach(c => { sumContado += c.calificacionContado; sumCredito += c.calificacionCredito; });
            return { contado: sumContado / califs.length, credito: sumCredito / califs.length, total: califs.length };
        }

        function mostrarEstadoCuenta(clienteId) {
            const cliente = clientes.find(c => c.id === clienteId);
            if (!cliente) return;

            const ventasCliente = ventas.filter(v => v.clienteId === clienteId && v.estado === 'normal').sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            const abonosCliente = abonos.filter(a => ventasCliente.some(v => v.id === a.ventaId));

            let html = `<h3>Estado de cuenta: ${cliente.razonSocial}</h3><p>NIT: ${cliente.nit || 'C/F'} | Código: ${cliente.codigo || '—'}</p><h4>Facturas pendientes</h4><div class="table-responsive"><table><thead><tr><th>Fecha</th><th>Total</th><th>Saldo</th><th>Vencimiento</th><th>Días</th></tr></thead><tbody>`;
            let totalPendiente = 0;
            ventasCliente.forEach(v => {
                if (v.tipoVenta === 'Crédito' && v.saldoPendiente > 0) {
                    totalPendiente += v.saldoPendiente;
                    const venc = new Date(v.fechaVencimiento);
                    const hoy = new Date();
                    const diasRest = Math.ceil((venc - hoy) / (1000*60*60*24));
                    const clase = diasRest < 0 ? 'vencido' : (diasRest <= 3 ? 'proximo' : '');
                    html += `<tr class="${clase}"><td>${new Date(v.fecha).toLocaleDateString()}</td><td>${formatoQ(v.total)}</td><td>${formatoQ(v.saldoPendiente)}</td><td>${venc.toLocaleDateString()}</td><td>${diasRest}</td></tr>`;
                }
            });

            html += `<h4>Registrar nuevo abono</h4><div><label>Factura: <select id="abonoVentaId">${ventasCliente.filter(v => v.tipoVenta === 'Crédito' && v.saldoPendiente > 0).map(v => `<option value="${v.id}">${new Date(v.fecha).toLocaleDateString()} - Q${v.saldoPendiente.toFixed(2)}</option>`).join('')}</select></label>

                if (!ventaId || isNaN(monto) || monto <= 0) { alert('Seleccione una factura y monto válido'); return; }
                
                const venta = ventas.find(v => v.id === ventaId);
                if (!venta) return;
                if (monto > venta.saldoPendiente) { alert('El monto no puede ser mayor al saldo pendiente'); return; }

        function renderProductos() {

            const itemsPorPagina = 8;

            function render() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const productosPagina = catalogoProductos.slice(inicio, fin);

                tbody.innerHTML = '';
                productosPagina.forEach(p => {
                    const invItem = inventario.find(i => i.productoId === p.id) || { lote: '', fechaVencimiento: '' };
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td><input type="text" class="prod-nombre" value="${p.nombre}" style="width:100%;"></td>
                        <td><input type="text" class="prod-lote" value="${invItem.lote || ''}" placeholder="Ej: L-001" style="width:80px;"></td>
                        <td style="font-size:0.85rem; color:#075e54;"><b>${invItem.fechaVencimiento ? new Date(invItem.fechaVencimiento).toLocaleDateString() : 'N/A'}</b></td>
                        <td><input type="number" class="prod-precio" value="${p.precioSugerido.toFixed(2)}" step="0.01" min="0" style="width:90px;"></td>
                        <td><label class="checkbox-label"><input type="checkbox" class="prod-activo" ${p.activo !== false ? 'checked' : ''} style="width:20px;"> Activo</label></td>
                        <td><button class="secondary small guardarBtn" data-id="${p.id}">💾 Guardar</button></td>
                    `;
                    tbody.appendChild(tr);
                });

                document.querySelectorAll('.guardarBtn').forEach(b => {
                    b.addEventListener('click', () => {
                        const id = b.dataset.id;
                        const tr = b.closest('tr');
                        const nombre = tr.querySelector('.prod-nombre').value.trim();
                        const precio = parseFloat(tr.querySelector('.prod-precio').value);
                        const activo = tr.querySelector('.prod-activo').checked;
                        const lote = tr.querySelector('.prod-lote').value.trim();
                        
                        const prod = catalogoProductos.find(p => p.id === id);
                        if (prod && nombre) {
                            prod.nombre = nombre;
                            prod.precioSugerido = precio;
                            prod.activo = activo;
                            const inv = inventario.find(i => i.productoId === id);
                            if (inv) {
                                inv.nombre = nombre;
                                inv.precioUnitario = precio;
                                inv.lote = lote; 
                            }
                            saveData();
                            alert('Producto actualizado.');
                        }
                    });
                });

                const totalPaginas = Math.ceil(catalogoProductos.length / itemsPorPagina);
                if (totalPaginas > 1) {
                    paginacionDiv.innerHTML = `<button class="secondary small" id="paginaProductosAnterior" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Ant</button><span> Pág ${paginaActual+1} de ${totalPaginas} </span><button class="secondary small" id="paginaProductosSiguiente" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Sig ➔</button>`;
                    document.getElementById('paginaProductosAnterior')?.addEventListener('click', () => { if (paginaActual > 0) { paginaActual--; render(); } });
                    document.getElementById('paginaProductosSiguiente')?.addEventListener('click', () => { if (paginaActual < totalPaginas-1) { paginaActual++; render(); } });
                }
            }
            render();

            const modalNP = document.getElementById('nuevoProductoModal');
            document.getElementById('nuevoProductoBtn').addEventListener('click', () => {
                document.getElementById('npNombre').value = '';
                document.getElementById('npLote').value = '';
                document.getElementById('npVencimiento').value = '';
                document.getElementById('npPrecio').value = '';
                modalNP.style.display = 'flex';
            });
            document.getElementById('npNombre').addEventListener('input', function() { this.value = this.value.toUpperCase(); });
            document.getElementById('cancelarNuevoProductoBtn').onclick = () => modalNP.style.display = 'none';
            
            document.getElementById('guardarNuevoProductoBtn').onclick = () => {
                const nombre = document.getElementById('npNombre').value.trim();
                const lote = document.getElementById('npLote').value.trim();
                const vencimiento = document.getElementById('npVencimiento').value;
                const precio = parseFloat(document.getElementById('npPrecio').value) || 0;

                if (!nombre || !lote || !vencimiento) { alert('Complete los campos obligatorios.'); return; }

                const newId = 'prod_' + Date.now();
                catalogoProductos.push({ id: newId, nombre: nombre, precioSugerido: precio, activo: true });
                inventario.push({ 
                    productoId: newId, nombre: nombre, stock: 0, precioUnitario: precio, costoUnitario: precio * 0.7, fechaVencimiento: vencimiento, lote: lote 
                });
                
                saveData();
                modalNP.style.display = 'none';
                render(); 
            };
        }

            // ================== TABLAS BASE ==================
            function calcularBaseComision() {
                const inicio = fechaInicioComision.value;
                const fin = fechaFinComision.value;
                if (!inicio || !fin) return 0;
                const start = new Date(inicio + 'T00:00:00');
                const end = new Date(fin + 'T23:59:59');

                const ventasContadoPeriodo = ventas.filter(v => new Date(v.fecha) >= start && new Date(v.fecha) <= end && v.tipoVenta === 'Contado' && v.estado === 'normal');
                const totalContado = ventasContadoPeriodo.reduce((acc, v) => acc + (parseFloat(v.total) || 0), 0);

                const ventasCreditoCanceladas = ventas.filter(v => {
                    if (v.tipoVenta !== 'Crédito' || v.estado !== 'normal' || v.saldoPendiente > 0 || !v.fechaCancelacion) return false;
                    const fechaCanc = new Date(v.fechaCancelacion);
                    return fechaCanc >= start && fechaCanc <= end;
                });
                const totalCreditosCancelados = ventasCreditoCanceladas.reduce((acc, v) => acc + (parseFloat(v.total) || 0), 0);

                const pagosPropiosPeriodo = pagosCobro.filter(p => new Date(p.fecha) >= start && new Date(p.fecha) <= end && p.tipo === 'propio');
                const totalPagosPropios = pagosPropiosPeriodo.reduce((acc, p) => acc + (p.monto || 0), 0);

                const totalVentasPeriodo = ventas.filter(v => new Date(v.fecha) >= start && new Date(v.fecha) <= end && v.estado === 'normal').reduce((acc, v) => acc + (parseFloat(v.total) || 0), 0);
                ventasPeriodoTotalSpan.innerText = formatoQ(totalVentasPeriodo);

                const base = totalContado + totalCreditosCancelados + totalPagosPropios;
                baseComisionSpan.innerText = formatoQ(base);
                return base;
            }

            function actualizarComision() {
                const base = parseFloat(baseComisionSpan.innerText.replace('Q', '')) || 0;
                const porcentaje = parseFloat(porcentajeInput.value) || 0;
                montoComisionSpan.innerText = formatoQ(base * porcentaje / 100);
            }

            function calcularClaseVencimiento(fechaVencimiento) {
                if (!fechaVencimiento) return '';
                const hoy = new Date();
                hoy.setHours(0,0,0,0);
                const venc = new Date(fechaVencimiento);
                const diffDays = Math.ceil((venc - hoy) / (1000 * 60 * 60 * 24));
                
                if (diffDays < 0) return 'vencimiento-rojo'; // Vencido
                if (diffDays <= 90) return 'vencimiento-rojo'; // Menos de 3 meses
                if (diffDays <= 180) return 'vencimiento-naranja'; // 3 a 6 meses
                return 'vencimiento-verde'; // Sano
            }

            function renderInventarioTabla() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                
                // Ordenar alfabéticamente para que sea fácil de encontrar
                const inventarioOrdenado = [...inventario].sort((a,b) => a.nombre.localeCompare(b.nombre));
                const inventarioPagina = inventarioOrdenado.slice(inicio, fin);

                inventarioBody.innerHTML = '';
                let totalValorVenta = 0;
                inventario.forEach(item => totalValorVenta += item.stock * item.precioUnitario);
                valorInventarioSpan.innerText = formatoQ(totalValorVenta);

                inventarioPagina.forEach(item => {
                    const claseVenc = calcularClaseVencimiento(item.fechaVencimiento);
                    const stockClass = item.stock < 5 ? 'stock-bajo' : ''; // Alerta roja si quedan menos de 5
                    
                    const tr = document.createElement('tr');
                    tr.className = claseVenc; // Semáforo de fila
                    tr.innerHTML = `
                        <td>${item.nombre}</td>
                        <td class="${stockClass}">${item.stock}</td>
                        <td>${formatoQ(item.precioUnitario)}</td>
                        <td><input type="date" class="fecha-vencimiento" data-id="${item.productoId}" value="${item.fechaVencimiento || ''}" style="width:120px;"></td>
                        <td>${claseVenc === 'vencimiento-rojo' ? '🔴 Vence pronto' : (claseVenc === 'vencimiento-naranja' ? '🟠 Precaución' : '🟢 Vigente')}</td>
                    `;
                    inventarioBody.appendChild(tr);
                });

                document.querySelectorAll('.fecha-vencimiento').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const prodId = input.dataset.id;
                        const newDate = input.value;
                        const item = inventario.find(i => i.productoId === prodId);
                        if (item && newDate) {
                            item.fechaVencimiento = newDate;
                            saveData();
                            renderInventarioTabla();
                        }
                    });
                });
                actualizarComision();
                
                const totalPaginas = Math.ceil(inventarioOrdenado.length / itemsPorPagina);
                if (totalPaginas > 1) {
                    paginacionDiv.innerHTML = `<button class="secondary small" id="paginaInventarioAnterior" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Ant</button><span> Pág ${paginaActual+1} de ${totalPaginas} </span><button class="secondary small" id="paginaInventarioSiguiente" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Sig ➔</button>`;

                    document.getElementById('paginaInventarioSiguiente')?.addEventListener('click', () => { if (paginaActual < totalPaginas-1) { paginaActual++; renderInventarioTabla(); } });
                } else {

            }

        // ================== FUNCIONES GLOBALES DE REPORTE ==================
        function generarResumenComisiones() {
            const inicio = document.getElementById('fechaInicioComision')?.value;
            const fin = document.getElementById('fechaFinComision')?.value;
            if (!inicio || !fin) {
                alert('Seleccione un rango de fechas válido en la pestaña Inventario.');
                return;
            }
            const start = new Date(inicio + 'T00:00:00');
            const end = new Date(fin + 'T23:59:59');

            const ventasContadoPeriodo = ventas.filter(v => {
                const fecha = new Date(v.fecha);
                return fecha >= start && fecha <= end && v.tipoVenta === 'Contado' && v.estado === 'normal';
            });
            
            const detalleContado = {};
            const unidadesGlobales = {};

            ventasContadoPeriodo.forEach(v => {
                v.productos.forEach(p => {
                    if(!detalleContado[p.producto]) detalleContado[p.producto] = { unidades: 0, monto: 0 };
                    detalleContado[p.producto].unidades += p.unidades;
                    detalleContado[p.producto].monto += (parseFloat(p.monto) || 0);

                    if (!unidadesGlobales[p.producto]) unidadesGlobales[p.producto] = 0;
                    unidadesGlobales[p.producto] += p.unidades;
                });
            });

            const ventasCreditoCanceladas = ventas.filter(v => {
                if (v.tipoVenta !== 'Crédito' || v.estado !== 'normal' || v.saldoPendiente > 0 || !v.fechaCancelacion) return false;
                const fechaCanc = new Date(v.fechaCancelacion);
                return fechaCanc >= start && fechaCanc <= end;
            });

            ventasCreditoCanceladas.forEach(v => {
                v.productos.forEach(p => {
                    if (!unidadesGlobales[p.producto]) unidadesGlobales[p.producto] = 0;
                    unidadesGlobales[p.producto] += p.unidades;
                });
            });

        function generarAnalisisTrimestral(trimestre, anio) {
            const config = {
                'Q1': { inicioMes: 0, finMes: 2, anioOffset: 0 },
                'Q2': { inicioMes: 3, finMes: 5, anioOffset: 0 },
                'Q3': { inicioMes: 6, finMes: 8, anioOffset: 0 },
                'Q4': { inicioMes: 9, finMes: 11, anioOffset: 0 }
            };
            const sel = config[trimestre];
            const fechaInicio = new Date(anio + sel.anioOffset, sel.inicioMes, 1);
            const fechaFin = new Date(anio, sel.finMes + 1, 0, 23, 59, 59);

            const ventasQ = ventas.filter(v => {
                const f = new Date(v.fecha);
                return f >= fechaInicio && f <= fechaFin && v.estado === 'normal';
            });
            if (ventasQ.length === 0) { alert("No hay datos para este periodo"); return; }

            const mesesUnicos = new Set();
            const ventasPorRuta = {};

            ventasQ.forEach(v => {
                mesesUnicos.add(new Date(v.fecha).getMonth());
                
                const cli = clientes.find(c => c.id === v.clienteId) || {};
                const ruta = cli.ruta && cli.ruta.trim() !== '' ? cli.ruta : 'Sin Ruta Asignada';
                if (!ventasPorRuta[ruta]) ventasPorRuta[ruta] = {};
                
                v.productos.forEach(p => {
                    ventasPorRuta[ruta][p.producto] = (ventasPorRuta[ruta][p.producto] || 0) + p.unidades;
                });
            });

            const mesesActivos = mesesUnicos.size || 1;

            let totalContado = 0, totalCredito = 0;
            ventasQ.forEach(v => {
                const t = parseFloat(v.total) || 0;
                if (v.tipoVenta === 'Contado') totalContado += t;
                else totalCredito += t;
            });
            const totalVentas = totalContado + totalCredito;
            const numFacturas = ventasQ.length;
            const ticketPromedio = numFacturas > 0 ? totalVentas / numFacturas : 0;

            let totalPotencial = 0;
            let fugaTotal = 0;
            ventasQ.forEach(v => {
                v.productos.forEach(p => {
                    const prodOriginal = catalogoProductos.find(cp => cp.id === p.productoId);
                    if (prodOriginal) {
                        const potencial = prodOriginal.precioSugerido * p.unidades;
                        const real = parseFloat(p.monto);
                        totalPotencial += potencial;
                        fugaTotal += Math.max(0, potencial - real);
                    }
                });
            });
            const porcentajeDescuento = totalPotencial > 0 ? (fugaTotal / totalPotencial) * 100 : 0;

            let saldoCreditoPendiente = 0;
            ventasQ.forEach(v => {
                if (v.tipoVenta === 'Crédito') {
                    saldoCreditoPendiente += (v.saldoPendiente || 0);
                }
            });
        const abonosPeriodo = abonos.filter(a => {
         const venta = ventas.find(v => v.id === a.ventaId);
        if (!venta) return false;
         const fechaVenta = new Date(venta.fecha);
        return fechaVenta >= fechaInicio && fechaVenta <= fechaFin;
});
        const totalAbonos = abonosPeriodo.reduce((acc, a) => acc + (a.monto || 0), 0);
                        
         const pagosCobroPeriodo = pagosCobro.filter(p => {
                const fecha = new Date(p.fecha);
                return fecha >= fechaInicio && fecha <= fechaFin && p.tipo === 'propio';
            });
            const totalPagosPropios = pagosCobroPeriodo.reduce((acc, p) => acc + (p.monto || 0), 0);
            const ingresosEfectivo = totalContado + totalAbonos + totalPagosPropios;
            const creditosOtorgados = ventasQ.filter(v => v.tipoVenta === 'Crédito').reduce((acc, v) => acc + parseFloat(v.total), 0);
            const eficienciaCobro = creditosOtorgados > 0 ? (ingresosEfectivo / creditosOtorgados) * 100 : 0;

            const saldosPorRango = { '0-30': 0, '31-45': 0, '46-60': 0, '>60': 0 };
            ventasQ.forEach(v => {
                if (v.tipoVenta !== 'Crédito') return;
                const abonosHasta = abonos.filter(a => a.ventaId === v.id && new Date(a.fecha) <= fechaFin);
                const totalAbonado = abonosHasta.reduce((acc, a) => acc + (a.monto || 0), 0);
                const saldo = Math.max(0, (v.total || 0) - totalAbonado);
                if (saldo === 0) return;
                const vencimiento = new Date(v.fechaVencimiento);
                const diasMora = Math.ceil((fechaFin - vencimiento) / (1000*60*60*24));
                if (diasMora <= 30) saldosPorRango['0-30'] += saldo;
                else if (diasMora <= 45) saldosPorRango['31-45'] += saldo;
                else if (diasMora <= 60) saldosPorRango['46-60'] += saldo;
                else saldosPorRango['>60'] += saldo;
            });

            const ventasPorProducto = {};
            ventasQ.forEach(v => {
                v.productos.forEach(p => {
                    const nom = p.producto;
                    ventasPorProducto[nom] = (ventasPorProducto[nom] || 0) + (p.unidades || 0);
                });
            });
            const ranking = Object.entries(ventasPorProducto).sort((a,b) => b[1] - a[1]);
            const top10 = ranking.slice(0, 10);
            const bottom5 = ranking.slice(-5).reverse();

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', format: 'letter' });

            doc.setFontSize(10);
            doc.autoTable({
                startY: 48,
                head: [['KPI / Indicador Financiero', 'Valor']],

                    ['Volumen de Ventas (Contado)', formatoQ(totalContado)],
                    ['Volumen de Ventas (Crédito)', formatoQ(totalCredito)],
                    ['Total de Ingresos Generados (Ingreso Bruto)', formatoQ(totalVentas)],
                    ['Meses Operativos Detectados en Trimestre', `${mesesActivos} mes(es)`],
                    ['Costo Variable Estimado (21%)', `- ${formatoQ(totalVentas * 0.21)}`],
                    ['Gastos Fijos Dinámicos (Q12,500 x mes activo)', `- ${formatoQ(12500 * mesesActivos)}`],
                    ['RESULTADO NETO ESTIMADO', formatoQ(totalVentas - (totalVentas * 0.21) - (12500 * mesesActivos))],
                    ['Ticket Promedio de Venta', formatoQ(ticketPromedio)],
                    ['Porcentaje de Descuento Promedio', porcentajeDescuento.toFixed(2) + '%'],
                    ['Monto total de descuentos (Fuga)', formatoQ(fugaTotal)],
                    ['Saldo de créditos pendiente', formatoQ(saldoCreditoPendiente)],
                    ['Eficiencia de Cobro', eficienciaCobro.toFixed(2) + '%']
                ],
                theme: 'grid',
                headStyles: { fillColor: [7, 94, 84], textColor: 255 }
            });

            doc.text("Análisis de Mora por Días de Crédito", 14, doc.lastAutoTable.finalY + 15);
            const agingBody = [
                ['0 - 30 días', formatoQ(saldosPorRango['0-30']), 'Verde'],
                ['31 - 45 días', formatoQ(saldosPorRango['31-45']), 'Naranja'],
                ['46 - 60 días', formatoQ(saldosPorRango['46-60']), 'Naranja'],
                ['Más de 60 días', formatoQ(saldosPorRango['>60']), 'Rojo']
            ];
            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 20,
                head: [['Rango', 'Saldo Pendiente', 'Estado']],
                body: agingBody,
                theme: 'striped',
                headStyles: { fillColor: [37, 211, 102] }
            });

            if (top10.length > 0) {
                doc.text("Top 10 Productos Más Vendidos", 14, doc.lastAutoTable.finalY + 15);
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 20,
                    head: [['Producto', 'Cantidad']],
                    body: top10,
                    headStyles: { fillColor: [37, 211, 102] }
                });
            }

            if (bottom5.length > 0) {
                doc.text("Bottom 5 Productos Menos Vendidos", 14, doc.lastAutoTable.finalY + 15);
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 20,
                    head: [['Producto', 'Cantidad']],
                    body: bottom5,
                    headStyles: { fillColor: [220, 53, 69] }
                });
            }

            doc.addPage();
            doc.setFontSize(14);

                doc.autoTable({

                });
                
                rutaY = doc.lastAutoTable.finalY + 10;
            });

            const unidadesContado = {}, unidadesCredito = {};
            ventasQ.forEach(v => {
                v.productos.forEach(p => {
                    const nom = p.producto;
                    const unidades = p.unidades || 0;
                    if (v.tipoVenta === 'Contado') {
                        unidadesContado[nom] = (unidadesContado[nom] || 0) + unidades;
                    } else {
                        unidadesCredito[nom] = (unidadesCredito[nom] || 0) + unidades;
                    }
                });
            });
            const todosProductos = new Set([...Object.keys(unidadesContado), ...Object.keys(unidadesCredito)]);
            const desgloseRows = Array.from(todosProductos).sort().map(prod => [
                prod,
                unidadesContado[prod] || 0,
                unidadesCredito[prod] || 0,
                (unidadesContado[prod] || 0) + (unidadesCredito[prod] || 0)
            ]);
            if (desgloseRows.length > 0) {
                doc.addPage();
                doc.setFontSize(12);
                doc.text('Desglose de Unidades por Tipo de Venta (Contado vs Crédito)', 14, 15);
                doc.autoTable({
                    startY: 20,
                    head: [['Producto', 'Unidades Contado', 'Unidades Crédito', 'Total Unidades']],
                    body: desgloseRows,
                    theme: 'striped',
                    headStyles: { fillColor: [37, 211, 102] }
                });
            }

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(100);
                doc.text(`Página ${i} de ${totalPages}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 10, { align: 'right' });
            }
            doc.save(`ANALISIS_GERENCIAL_${trimestre}_${anio}.pdf`);
        }

        function generarReporteDetalladoPDF(tipo, fechaInicio, fechaFin) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', format: 'letter' });
            const titulo = tipo === 'semana' ? 'REPORTE SEMANAL DE VENTAS' : 'REPORTE MENSUAL DE VENTAS';
            const correlativo = obtenerCorrelativoReporte();
            const fechaHora = new Date().toLocaleString();

            doc.setFillColor(7, 94, 84);
            doc.rect(0, 0, doc.internal.pageSize.getWidth(), 18, 'F');
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(16);
            doc.setFont('helvetica', 'bold');
            doc.text('MARIJOSE JHIRE S.A.', 14, 12);
            doc.setFontSize(10);
            doc.text(titulo, doc.internal.pageSize.getWidth() - 14, 12, { align: 'right' });

            doc.setTextColor(0, 0, 0);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.text(`Colaborador: ${nombreUsuario}`, 14, 25);
            doc.text(`ID Reporte: ${correlativo}`, doc.internal.pageSize.getWidth() - 14, 25, { align: 'right' });
            doc.text(`Período evaluado: ${fechaInicio.toLocaleDateString()} - ${fechaFin.toLocaleDateString()}`, doc.internal.pageSize.getWidth() - 14, 30, { align: 'right' });
            doc.text(`Fecha de emisión: ${fechaHora}`, 14, 30);

            doc.setDrawColor(200);
            doc.line(14, 34, doc.internal.pageSize.getWidth() - 14, 34);

            const ventasPeriodo = ventas.filter(v => {
                if (v.estado !== 'normal') return false;
                const f = new Date(v.fecha);
                return f >= fechaInicio && f <= fechaFin;
            });

            const desgloseProductos = {};
            let totalContado = 0, totalCredito = 0;

            const tableBody = ventasPeriodo.map(v => {
                const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: '?', codigo: '', nit: '', direccion: '' };
                const detalleMercancia = v.productos.map(p => `${p.unidades} x ${p.producto}`).join('\n');
                const condiciones = v.tipoVenta === 'Contado' ? 'Contado' : `Crédito`;
                const facturadoStr = v.facturado ? 'Sí' : 'No';
                
                const totalVenta = parseFloat(v.total) || 0;
                if (v.tipoVenta === 'Contado') totalContado += totalVenta;
                else totalCredito += totalVenta;

                v.productos.forEach(p => {
                    if (!desgloseProductos[p.producto]) {
                        desgloseProductos[p.producto] = { contadoUds: 0, contadoMonto: 0, creditoUds: 0, creditoMonto: 0 };
                    }
                    const uds = p.unidades || 0;
                    const montoP = parseFloat(p.monto) || 0;

                    if (v.tipoVenta === 'Contado') {
                        desgloseProductos[p.producto].contadoUds += uds;
                        desgloseProductos[p.producto].contadoMonto += montoP;
                    } else {
                        desgloseProductos[p.producto].creditoUds += uds;
                        desgloseProductos[p.producto].creditoMonto += montoP;
                    }
                });

                return [
                    new Date(v.fecha).toLocaleDateString(),
                    cliente.codigo || 'S/C',
                    cliente.razonSocial,
                    cliente.nit || 'C/F',
                    v.id.substr(0,8),
                    detalleMercancia,
                    condiciones,
                    facturadoStr,
                    formatoQ(totalVenta)
                ];
            });

            doc.autoTable({
                startY: 40,
                head: [['Fecha', 'Código', 'Cliente', 'NIT', 'Doc', 'Detalle', 'Tipo', 'Facturado', 'Total']],
                body: tableBody,
                theme: 'striped',
                headStyles: { fillColor: [7, 94, 84], textColor: 255 },
                styles: { fontSize: 8 },
                columnStyles: { 5: { cellWidth: 50 }, 8: { halign: 'right' } }
            });

            let finalY = doc.lastAutoTable.finalY + 10;
            doc.setFillColor(240, 247, 252);
            doc.rect(14, finalY, 100, 25, 'F');
            doc.setFontSize(10);
            doc.setFont('helvetica', 'bold');
            doc.text(`Total Ventas Contado: ${formatoQ(totalContado)}`, 18, finalY + 7);
            doc.text(`Total Ventas Crédito: ${formatoQ(totalCredito)}`, 18, finalY + 14);
            doc.setTextColor(7, 94, 84);
            doc.text(`TOTAL GENERAL: ${formatoQ(totalContado + totalCredito)}`, 18, finalY + 21);

            doc.addPage();
            doc.setTextColor(0);
            doc.setFontSize(12);
            doc.text('ANÁLISIS DE PRODUCTOS (CONTADO VS CRÉDITO)', 14, 20);
            
            const rowsDesglose = Object.keys(desgloseProductos).sort().map(prod => {
                const d = desgloseProductos[prod];
                const totalUds = d.contadoUds + d.creditoUds;
                const totalMonto = d.contadoMonto + d.creditoMonto;
                return [
                    prod,
                    d.contadoUds.toString(),
                    formatoQ(d.contadoMonto),
                    d.creditoUds.toString(),
                    formatoQ(d.creditoMonto),
                    totalUds.toString(),
                    formatoQ(totalMonto)
                ];
            });

            rowsDesglose.push([
                'GRAN TOTAL', 
                '-', 
                formatoQ(totalContado), 
                '-', 
                formatoQ(totalCredito), 
                '-', 
                formatoQ(totalContado + totalCredito)
            ]);

            doc.autoTable({
                startY: 25,
                head: [['Producto', 'Uds Contado', 'Venta Contado (Q)', 'Uds Crédito', 'Venta Crédito (Q)', 'Total Uds', 'Total Venta (Q)']],
                body: rowsDesglose,
                theme: 'grid',
                headStyles: { fillColor: [37, 211, 102], textColor: 255 },
                styles: { fontSize: 9, halign: 'center' },
                columnStyles: { 0: { halign: 'left', cellWidth: 60, fontStyle: 'bold' } },
                willDrawCell: function(data) {
                    if (data.row.index === rowsDesglose.length - 1) {
                        doc.setFillColor(230, 245, 235);
                        doc.setFont('helvetica', 'bold');
                    }
                }
            });

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(150);
                doc.text(`Página ${i} de ${totalPages}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 10, { align: 'right' });
            }

            doc.save(`${titulo.replace(/ /g, '_')}_${nombreUsuario.replace(/\s+/g,'_')}_${fechaInicio.toISOString().slice(0,10)}.pdf`);
        }

                doc.setFillColor(7, 94, 84);
                doc.rect(0, 0, doc.internal.pageSize.getWidth(), 18, 'F');
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(16);
                doc.setFont('helvetica', 'bold');
                doc.text('MARIJOSE JHIRE S.A.', 14, 12);
                doc.setFontSize(10);
                doc.text('REPORTE DE COBROS FÍSICOS', doc.internal.pageSize.getWidth() - 14, 12, { align: 'right' });

                doc.setTextColor(0);
                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.text('7 calle 0-36 zona 1, Ciudad de Guatemala', 14, 23);
                doc.text('PBX: 2250-0859 | WhatsApp: 5015-9647', 14, 28);
                doc.text(`Colaborador: ${nombreUsuario}`, doc.internal.pageSize.getWidth() / 2, 23, { align: 'center' });
                doc.text(`ID Reporte: ${correlativo}`, doc.internal.pageSize.getWidth() - 14, 23, { align: 'right' });
                doc.text(`Fecha de emisión: ${new Date().toLocaleString()}`, doc.internal.pageSize.getWidth() - 14, 28, { align: 'right' });

                const tableBody = cobros.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).map(c => {
                    const cliente = clientes.find(cl => cl.id === c.clienteId) || { razonSocial: '?', codigo: '', nit: '', direccion: '' };
                    return [

                });

                doc.autoTable({
