                    const prods = v.productos.map(p => `${p.unidades} ${p.producto}`).join(', ');
                    let estado = 'Liquidado';
                    if (v.estado === 'anulada') estado = 'ANULADA';
                    else if (v.tipoVenta === 'Crédito' && v.saldoPendiente > 0) estado = 'Pendiente';
                    else if (v.tipoVenta === 'Crédito' && v.saldoPendiente === 0) estado = 'Cancelado';

                    return [
                        new Date(v.fecha).toLocaleDateString(),
                        cliente.razonSocial,
                        prods,
                        formatoQ(v.total),
                        v.tipoVenta,
                        v.tipoVenta === 'Crédito' ? formatoQ(v.saldoPendiente) : '—',
                        v.fechaVencimiento ? new Date(v.fechaVencimiento).toLocaleDateString() : '—',
                        estado
                    ];
                });

                doc.autoTable({
                    startY: 48,
                    head: [['Fecha', 'Cliente', 'Productos', 'Total', 'Tipo', 'Saldo', 'Vencimiento', 'Estado']],
                    body: tableBody,
                    theme: 'striped',
                    headStyles: { fillColor: [7, 94, 84], textColor: 255 },
                    styles: { fontSize: 8 }
                });

                const finalY = doc.lastAutoTable.finalY + 10;
                doc.setFont('helvetica', 'bold');
                doc.text(`Total período: ${document.getElementById('totalPeriodo').innerText}`, 14, finalY);
                doc.text(`Contado: ${document.getElementById('totalContadoPeriodo').innerText}`, 14, finalY + 6);
                doc.text(`Crédito: ${document.getElementById('totalCreditoPeriodo').innerText}`, 14, finalY + 12);

                const totalPages = doc.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(100);
                    doc.text(`Página ${i} de ${totalPages}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 10, { align: 'right' });
                }
                doc.save(`Ventas_Filtradas_${new Date().toISOString().slice(0,10)}.pdf`);
            });

            document.getElementById('enviarResumenMensualBtn').addEventListener('click', () => {
                const mes = parseInt(filtroMes.value);
                const anio = parseInt(filtroAnio.value);
                const nombreMes = filtroMes.options[filtroMes.selectedIndex].text;
                let mensaje = `📊 *RESUMEN DE VENTAS - ${nombreMes} ${anio}*\n\n`;
                const ventasMes = ventasFiltradas.filter(v => v.estado !== 'anulada');
                if (ventasMes.length === 0) {
                    mensaje += 'No hay ventas en este período.';
                } else {
                    ventasMes.forEach((v, i) => {
                        const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: '?' };
                        mensaje += `${i+1}. ${new Date(v.fecha).toLocaleDateString()} - ${cliente.razonSocial}: ${formatoQ(v.total)} (${v.tipoVenta})\n`;
                    });
                    mensaje += `\n*Totales*\n`;
                    mensaje += `Total: ${totalPeriodo.innerText}\n`;
                    mensaje += `Contado: ${totalContadoPeriodo.innerText}\n`;
                    mensaje += `Crédito: ${totalCreditoPeriodo.innerText}`;
                }
                const url = `https://wa.me/?text=${encodeURIComponent(mensaje)}`;
                window.open(url, '_blank');
            });
        }

        function mostrarFormularioAbono(ventaId) {
            const venta = ventas.find(v => v.id === ventaId);
            if (!venta) return;
            const cliente = clientes.find(c => c.id === venta.clienteId) || { razonSocial: '?' };

            const modal = document.getElementById('abonoModal');
            const content = document.getElementById('abonoContent');
            content.innerHTML = `
                <h3>Registrar abono</h3>
                <p>Venta: ${new Date(venta.fecha).toLocaleDateString()} - ${cliente.razonSocial}</p>
                <p>Total: ${formatoQ(venta.total)} | Saldo pendiente: ${formatoQ(venta.saldoPendiente)}</p>
                <label>Monto del abono: <input type="number" id="abonoMonto" step="0.01" min="0.01" max="${venta.saldoPendiente}"></label>
                <label>Tipo de pago: <select id="abonoTipoPago"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option></select></label>
                <div id="chequeOpciones" style="display:none; margin-top:10px;"><div class="flex-row"><label class="checkbox-label"><input type="radio" name="chequeTipo" value="hoy" checked> Cheque del día</label><label class="checkbox-label"><input type="radio" name="chequeTipo" value="futuro"> Cheque posfechado</label></div><div id="fechaChequeContainer" style="display:none;"><label>Fecha de cobro: <input type="date" id="fechaCheque"></label></div></div>
                <div style="margin-top:20px;"><button id="guardarAbonoBtn" class="secondary">Guardar abono</button><button id="cancelarAbonoBtn" class="secondary small">Cancelar</button></div>
            `;
            modal.style.display = 'flex';

            const tipoPago = document.getElementById('abonoTipoPago');
            const chequeOpciones = document.getElementById('chequeOpciones');
            const fechaChequeContainer = document.getElementById('fechaChequeContainer');
            const radioChequeHoy = document.querySelector('input[name="chequeTipo"][value="hoy"]');
            const radioChequeFuturo = document.querySelector('input[name="chequeTipo"][value="futuro"]');

            tipoPago.addEventListener('change', () => {
                if (tipoPago.value === 'cheque') {
                    chequeOpciones.style.display = 'block';
                } else {
                    chequeOpciones.style.display = 'none';
                }
            });

            radioChequeHoy.addEventListener('change', () => { fechaChequeContainer.style.display = 'none'; });
            radioChequeFuturo.addEventListener('change', () => { fechaChequeContainer.style.display = 'block'; });

            document.getElementById('guardarAbonoBtn').addEventListener('click', () => {
                const monto = parseFloat(document.getElementById('abonoMonto').value);
                if (isNaN(monto) || monto <= 0 || monto > venta.saldoPendiente) {
                    alert('Monto no válido');
                    return;
                }
                const tipo = tipoPago.value;
                let fechaCobro = null;
                let estado = 'cobrado';

                if (tipo === 'cheque') {
                    if (radioChequeFuturo.checked) {
                        fechaCobro = document.getElementById('fechaCheque').value;
                        if (!fechaCobro) {
                            alert('Debe ingresar fecha de cobro para cheque posfechado');
                            return;
                        }
                        estado = 'pendiente';
                    } else {
                        fechaCobro = new Date().toISOString().slice(0,10);
                        estado = 'cobrado';
                    }
                }

                const nuevoAbono = {
                    id: generarIdAbono(),
                    ventaId: venta.id,
                    fecha: new Date().toISOString(),
                    monto,
                    tipoPago: tipo,
                    fechaCobro,
                    estado
                };
                abonos.push(nuevoAbono);

                venta.saldoPendiente = redondearDinero(venta.saldoPendiente - monto);
                if (venta.saldoPendiente < 0) venta.saldoPendiente = 0;

                if (venta.saldoPendiente === 0 && !venta.fechaCancelacion) {
                    venta.fechaCancelacion = new Date().toISOString();
                }

                saveData();
                alert('Abono registrado');
                modal.style.display = 'none';
                if (document.querySelector('.tab.active').dataset.tab === 'ventas') renderVentasHistorial();
                if (document.querySelector('.tab.active').dataset.tab === 'inventario') renderInventario();
            });

            document.getElementById('cancelarAbonoBtn').addEventListener('click', () => { modal.style.display = 'none'; });
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        }

        // ========== PESTAÑA CATÁLOGO (Clientes Ejecutivo + Calificaciones) ==========
        function renderCatalogo() {
            let html = `
                <h2>📇 Directorio Ejecutivo de Clientes</h2>
                ${mostrarRecordatorios()}
                <div class="action-buttons" style="justify-content: flex-start;">
                    <button id="exportarExcelBtn" class="secondary">📥 Exportar Excel</button>
                    <button id="exportarPdfBtn" class="secondary">📄 Exportar PDF</button>
                </div>
                <div class="buscador"><input type="text" id="buscarClienteCatalogo" placeholder="Buscar por nombre o código..."></div>
                <div class="sub-tabs"><div class="sub-tab active" data-vista="todos">Todos</div><div class="sub-tab" data-vista="credito">Crédito</div><div class="sub-tab" data-vista="contado">Contado</div></div>
                <div style="display: flex; gap: 10px; margin: 15px 0;"><input type="text" id="filtroCategoria" placeholder="Filtrar por categoría"><input type="text" id="filtroRuta" placeholder="Filtrar por ruta/zona"><button id="aplicarFiltrosCat" class="secondary small">Aplicar filtros</button></div>
                <div class="table-responsive">
                    <table class="clientes-ejecutivos-table">
                        <thead>
                            <tr>
                                <th style="width: 20%">Cliente</th>
                                <th style="width: 8%">Código</th>
                                <th style="width: 10%">NIT</th>
                                <th style="width: 15%">Dirección</th>
                                <th style="width: 12%">Teléfono</th>
                                <th style="width: 12%">Estado Venta</th>
                                <th style="width: 13%">Comportamiento</th>
                                <th style="width: 10%">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="clientesTablaBody"></tbody>
                    </table>
                </div>
                <div id="paginacionClientesCatalogo" class="paginacion" style="margin-top:20px;"></div>
            `;
            contentEl.innerHTML = html;

            const tbody = document.getElementById('clientesTablaBody');
            const paginacionDiv = document.getElementById('paginacionClientesCatalogo');
            const buscarInput = document.getElementById('buscarClienteCatalogo');
            const subTabs = document.querySelectorAll('.sub-tab');
            const exportarPdfBtn = document.getElementById('exportarPdfBtn');
            const filtroCategoria = document.getElementById('filtroCategoria');
            const filtroRuta = document.getElementById('filtroRuta');
            const aplicarFiltrosCat = document.getElementById('aplicarFiltrosCat');

            let vistaActual = 'todos';
            let paginaActual = 0;
            const itemsPorPagina = 10;
            let clientesFiltrados = [];

            function obtenerComportamiento(clienteId) {
                const ventasCliente = ventas.filter(v => v.clienteId === clienteId && v.estado === 'normal');
                const tieneCreditoPendiente = ventasCliente.some(v => v.tipoVenta === 'Crédito' && v.saldoPendiente > 0);
                if (!tieneCreditoPendiente) return { texto: 'Contado', clase: 'comportamiento-contado' };
                
                const hoy = new Date();
                let maxDiasMora = 0;
                ventasCliente.forEach(v => {
                    if (v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 && v.fechaVencimiento) {
                        const venc = new Date(v.fechaVencimiento);
                        const diasMora = Math.ceil((hoy - venc) / (1000*60*60*24));
                        if (diasMora > maxDiasMora) maxDiasMora = diasMora;
                    }
                });
                if (maxDiasMora > 0) return { texto: 'Con mora', clase: 'comportamiento-con-mora' };
                return { texto: 'Al día', clase: 'comportamiento-al-dia' };
            }

            function filtrarClientes() {
                const termino = buscarInput.value.toLowerCase().trim();
                const catFiltro = filtroCategoria.value.toLowerCase().trim();
                const rutaFiltro = filtroRuta.value.toLowerCase().trim();
                let base = clientes;
                if (vistaActual === 'credito') base = clientes.filter(c => {
                    return ventas.some(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 && v.estado === 'normal');
                });
                else if (vistaActual === 'contado') base = clientes.filter(c => {
                    return !ventas.some(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.saldoPendiente > 0 && v.estado === 'normal');
                });

                if (termino) {
                    base = base.filter(c => c.razonSocial.toLowerCase().includes(termino) || (c.codigo && c.codigo.toLowerCase().includes(termino)));
                }
                if (catFiltro) {
                    base = base.filter(c => (c.categoria || '').toLowerCase().includes(catFiltro));
                }
                if (rutaFiltro) {
                    base = base.filter(c => (c.ruta || '').toLowerCase().includes(rutaFiltro));
                }
                clientesFiltrados = [...base];
                paginaActual = 0;
                renderTabla();
            }

            function renderTabla() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const clientesPagina = clientesFiltrados.slice(inicio, fin);

                tbody.innerHTML = '';
                clientesPagina.forEach(cli => {
                    const comportamiento = obtenerComportamiento(cli.id);
                    const promedio = obtenerPromedioCalificaciones(cli.id);
                    const estrellas = promedio ? `<br><span style="font-size:0.75rem; color:#ffc107;">⭐ ${promedio.contado.toFixed(1)}</span>` : '<br><span style="font-size:0.7rem; color:#888;">Sin calif.</span>';

                    const saldoTotalCliente = ventas.filter(v => v.clienteId === cli.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    const estadoVenta = saldoTotalCliente > 0 
                        ? `<span style="color: #c62828; font-weight: 600;">Pendiente<br>(Q${saldoTotalCliente.toFixed(2)})</span>` 
                        : `<span style="color: #2e7d32; font-weight: 600;">Liquidado</span>`;

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${cli.razonSocial} ${estrellas}</td>
                        <td>${cli.codigo || '—'}</td>
                        <td>${cli.nit || 'C/F'}</td>
                        <td>${cli.direccion || '—'}</td>
                        <td>${cli.telefono || '—'}</td>
                        <td>${estadoVenta}</td>
                        <td><span class="${comportamiento.clase}">${comportamiento.texto}</span></td>
                        <td>
                            <button class="secondary small calificarClienteBtn" data-id="${cli.id}" title="Calificar" style="margin-bottom:2px; min-width:35px;">⭐</button>
                            <button class="secondary small editarClienteBtn" data-id="${cli.id}" title="Editar" style="margin-bottom:2px; min-width:35px;">✏️</button> 
                            <button class="secondary small estadoCuentaBtn" data-id="${cli.id}" title="Estado de Cuenta" style="margin-bottom:2px; min-width:35px;">📊</button> 
                            <button class="danger small eliminarClienteBtn" data-id="${cli.id}" title="Eliminar" style="margin-bottom:2px; min-width:35px;">🗑</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });

                const totalPaginas = Math.ceil(clientesFiltrados.length / itemsPorPagina);
                let paginacionHtml = '';
                if (totalPaginas > 1) {
                    paginacionHtml += `<button class="secondary small" id="paginaAnteriorCat" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Anterior</button>`;
                    paginacionHtml += `<span> Página ${paginaActual+1} de ${totalPaginas} </span>`;
                    paginacionHtml += `<button class="secondary small" id="paginaSiguienteCat" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Siguiente ➔</button>`;
                }
                paginacionDiv.innerHTML = paginacionHtml;

                document.getElementById('paginaAnteriorCat')?.addEventListener('click', () => { if (paginaActual > 0) { paginaActual--; renderTabla(); } });
                document.getElementById('paginaSiguienteCat')?.addEventListener('click', () => { if (paginaActual < totalPaginas-1) { paginaActual++; renderTabla(); } });

                document.querySelectorAll('.calificarClienteBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        mostrarModalCalificacion(btn.dataset.id);
                    });
                });
                document.querySelectorAll('.editarClienteBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const cli = clientes.find(c => c.id === id);
                        if (cli) mostrarModalEditarCliente(cli);
                    });
                });
                document.querySelectorAll('.estadoCuentaBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const clienteId = btn.dataset.id;
                        mostrarEstadoCuenta(clienteId);
                    });
                });
                document.querySelectorAll('.eliminarClienteBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const id = btn.dataset.id;
                        const cli = clientes.find(c => c.id === id);
                        if (cli && confirm(`¿Eliminar cliente ${cli.razonSocial} y sus ventas?`)) {
                            ventas = ventas.filter(v => v.clienteId !== cli.id);
                            clientes = clientes.filter(c => c.id !== id);
                            saveData();
                            filtrarClientes();
                        }
                    });
                });
            }

            subTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    subTabs.forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    vistaActual = tab.dataset.vista;
                    filtrarClientes();
                });
            });
            buscarInput.addEventListener('input', filtrarClientes);
            aplicarFiltrosCat.addEventListener('click', filtrarClientes);
            filtrarClientes();

            document.getElementById('exportarExcelBtn').addEventListener('click', () => {
                const wb = XLSX.utils.book_new();
                const clientesData = clientes.map(c => {
                    const comportamiento = obtenerComportamiento(c.id);
                    const saldoTotalCliente = ventas.filter(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    
                    return {
                        'Razón Social': c.razonSocial,
                        Código: c.codigo || '',
                        NIT: c.nit || 'C/F',
                        Dirección: c.direccion || '',
                        Teléfono: c.telefono || '',
                        'Estado': saldoTotalCliente > 0 ? 'Pendiente' : 'Liquidado',
                        'Saldo Pendiente (Q)': saldoTotalCliente,
                        Comportamiento: comportamiento.texto,
                        Categoría: c.categoria || '',
                        Ruta: c.ruta || ''
                    };
                });
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientesData), 'Clientes');
                XLSX.writeFile(wb, `clientes_${new Date().toISOString().slice(0,10)}.xlsx`);
            });

            exportarPdfBtn.addEventListener('click', () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF({ orientation: 'landscape', format: 'legal' });
                const correlativo = obtenerCorrelativoReporte();
                const fechaHora = new Date().toLocaleString();
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(12);
                doc.setTextColor(7, 94, 84);
                doc.text('Droguería Marijose Jhire', 14, 15);
                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.text('7 calle 0-36 zona 1, Ciudad de Guatemala', 14, 21);
                doc.text('PBX: 2250-0859 | WhatsApp: 5015-9647', 14, 27);
                doc.setFont('helvetica', 'bold');
                doc.text(`Colaborador: ${nombreUsuario}`, doc.internal.pageSize.getWidth() - 14, 15, { align: 'right' });
                doc.text(`ID Reporte: ${correlativo}`, doc.internal.pageSize.getWidth() - 14, 21, { align: 'right' });
                doc.text(`Fecha/Hora: ${fechaHora}`, doc.internal.pageSize.getWidth() - 14, 27, { align: 'right' });
                doc.setDrawColor(37, 211, 102);
                doc.line(10, 32, doc.internal.pageSize.getWidth() - 10, 32);

                const tableColumn = ['Cliente', 'Código', 'NIT', 'Dirección', 'Teléfono', 'Estado Venta', 'Comportamiento'];
                const tableRows = clientesFiltrados.map(c => {
                    const saldo = ventas.filter(v => v.clienteId === c.id && v.tipoVenta === 'Crédito' && v.estado === 'normal').reduce((acc, v) => acc + (v.saldoPendiente || 0), 0);
                    return [
                        c.razonSocial,
                        c.codigo || '',
                        c.nit || 'C/F',
                        c.direccion || '—',
                        c.telefono || '—',
                        saldo > 0 ? `Pendiente (Q${saldo.toFixed(2)})` : 'Liquidado',
                        obtenerComportamiento(c.id).texto
                    ];
                });
                
                doc.autoTable({
                    startY: 38,
                    head: [tableColumn],
                    body: tableRows,
                    theme: 'striped',
                    headStyles: { fillColor: [7, 94, 84], textColor: 255 },
                    styles: { fontSize: 8 }
                });
                const totalPages = doc.internal.getNumberOfPages();
                for (let i = 1; i <= totalPages; i++) {
                    doc.setPage(i);
                    doc.setFontSize(8);
                    doc.setTextColor(100);
                    doc.text(`Página ${i} de ${totalPages}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 10, { align: 'right' });
                }
                doc.save(`clientes_${nombreUsuario.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`);
            });
        }

        function mostrarModalEditarCliente(cliente) {
            const modal = document.getElementById('editarClienteModal');
            const content = document.getElementById('editarClienteContent');
            content.innerHTML = `
                <h3>Editar cliente</h3>
                <label>Código: <input type="text" id="editCodigo" value="${cliente.codigo || ''}"></label>
                <label>Razón Social: <input type="text" id="editRazon" value="${cliente.razonSocial}"></label>
                <label>NIT: <input type="text" id="editNit" value="${cliente.nit || ''}"></label>
                <label>Dirección: <input type="text" id="editDireccion" value="${cliente.direccion || ''}"></label>
                <label>Teléfono: <input type="tel" id="editTelefono" value="${cliente.telefono || ''}"></label>
                <label>Correo: <input type="email" id="editCorreo" value="${cliente.correo || ''}"></label>
                <label>Encargado: <input type="text" id="editEncargado" value="${cliente.encargado || ''}"></label>
                <label>Categoría: <select id="editCategoria"><option value="">Seleccionar</option><option value="Clínica" ${cliente.categoria === 'Clínica' ? 'selected' : ''}>Clínica</option><option value="Farmacia" ${cliente.categoria === 'Farmacia' ? 'selected' : ''}>Farmacia</option><option value="Hospital" ${cliente.categoria === 'Hospital' ? 'selected' : ''}>Hospital</option><option value="Otro" ${cliente.categoria === 'Otro' ? 'selected' : ''}>Otro</option></select></label>
                <label>Ruta/Zona: <input type="text" id="editRuta" value="${cliente.ruta || ''}"></label>
                <label>Límite de crédito (Q): <input type="number" id="editLimiteCredito" step="0.01" value="${cliente.limiteCredito !== null ? cliente.limiteCredito : ''}"></label>
                <div style="margin-top:20px; display:flex; gap:10px;"><button id="guardarEdicionCliente" class="secondary">Guardar</button><button id="cancelarEdicionCliente" class="secondary small">Cancelar</button></div>
            `;
            modal.style.display = 'flex';

            document.getElementById('guardarEdicionCliente').addEventListener('click', () => {
                cliente.codigo = document.getElementById('editCodigo').value.trim() || null;
                cliente.razonSocial = document.getElementById('editRazon').value.trim();
                cliente.nit = document.getElementById('editNit').value.trim() || null;
                cliente.direccion = document.getElementById('editDireccion').value.trim();
                cliente.telefono = document.getElementById('editTelefono').value.trim();
                cliente.correo = document.getElementById('editCorreo').value.trim();
                cliente.encargado = document.getElementById('editEncargado').value.trim();
                cliente.categoria = document.getElementById('editCategoria').value;
                cliente.ruta = document.getElementById('editRuta').value.trim();
                cliente.limiteCredito = document.getElementById('editLimiteCredito').value ? parseFloat(document.getElementById('editLimiteCredito').value) : null;
                saveData();
                modal.style.display = 'none';
                renderCatalogo();
            });

            document.getElementById('cancelarEdicionCliente').addEventListener('click', () => { modal.style.display = 'none'; });
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        }

        function mostrarEstadoCuenta(clienteId) {
            const cliente = clientes.find(c => c.id === clienteId);
            if (!cliente) return;

            const ventasCliente = ventas.filter(v => v.clienteId === clienteId && v.estado === 'normal').sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            const abonosCliente = abonos.filter(a => ventasCliente.some(v => v.id === a.ventaId));

            let html = `<h3>Estado de cuenta: ${cliente.razonSocial}</h3><p>NIT: ${cliente.nit || 'C/F'} | Código: ${cliente.codigo || '—'}</p><h4>Facturas pendientes</h4><div class="table-responsive"><table><thead><tr><th>Fecha</th><th>Total</th><th>Saldo</th><th>Vencimiento</th><th>Días</th></tr></thead><tbody>`;
            let totalPendiente = 0;
            ventasCliente.forEach(v => {
                if (v.tipoVenta === 'Crédito' && v.saldoPendiente > 0) {
                    totalPendiente += v.saldoPendiente;
                    const venc = new Date(v.fechaVencimiento);
                    const hoy = new Date();
                    const diasRest = Math.ceil((venc - hoy) / (1000*60*60*24));
                    const clase = diasRest < 0 ? 'vencido' : (diasRest <= 3 ? 'proximo' : '');
                    html += `<tr class="${clase}"><td>${new Date(v.fecha).toLocaleDateString()}</td><td>${formatoQ(v.total)}</td><td>${formatoQ(v.saldoPendiente)}</td><td>${venc.toLocaleDateString()}</td><td>${diasRest}</td></tr>`;
                }
            });
            html += `</tbody></table></div><p><strong>Total pendiente: ${formatoQ(totalPendiente)}</strong></p><h4>Abonos realizados</h4>`;
            if (abonosCliente.length === 0) {
                html += '<p>No hay abonos registrados.</p>';
            } else {
                html += `<div class="table-responsive"><table><thead><tr><th>Fecha Abono</th><th>Fecha Factura</th><th>Factura</th><th>Monto</th><th>Tipo</th><th>Cheque fecha</th><th>Estado</th></tr></thead><tbody>`;
                abonosCliente.forEach(a => {
                    const venta = ventas.find(v => v.id === a.ventaId);
                    const fechaFactura = venta ? new Date(venta.fecha).toLocaleDateString() : '—';
                    html += `<tr><td>${new Date(a.fecha).toLocaleDateString()}</td><td>${fechaFactura}</td><td>${venta ? venta.id.substr(0,8) : ''}</td><td>${formatoQ(a.monto)}</td><td>${a.tipoPago}</td><td>${a.fechaCobro ? new Date(a.fechaCobro).toLocaleDateString() : '—'}</td><td>${a.estado || 'cobrado'}</td></tr>`;
                });
                html += `</tbody></table></div>`;
            }

            html += `<h4>Registrar nuevo abono</h4><div><label>Factura: <select id="abonoVentaId">${ventasCliente.filter(v => v.tipoVenta === 'Crédito' && v.saldoPendiente > 0).map(v => `<option value="${v.id}">${new Date(v.fecha).toLocaleDateString()} - Q${v.saldoPendiente.toFixed(2)}</option>`).join('')}</select></label>
                <label>Monto: <input type="number" id="abonoMonto" step="0.01" min="0.01"></label>
                <label>Tipo de pago: <select id="abonoTipoPago"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option></select></label>
                <div id="chequeOpcionesModal" style="display:none; margin-top:10px;"><div class="flex-row"><label class="checkbox-label"><input type="radio" name="chequeTipoModal" value="hoy" checked> Cheque del día</label><label class="checkbox-label"><input type="radio" name="chequeTipoModal" value="futuro"> Cheque posfechado</label></div><div id="fechaChequeModalContainer" style="display:none;"><label>Fecha de cobro: <input type="date" id="fechaChequeModal"></label></div></div>
                <div style="margin-top:10px;"><button id="guardarAbonoModalBtn" class="secondary small">Guardar abono</button></div></div>`;

            const modal = document.getElementById('estadoCuentaModal');
            const modalContent = document.getElementById('estadoCuentaContent');
            modalContent.innerHTML = html;
            modal.style.display = 'flex';

            const tipoPago = document.getElementById('abonoTipoPago');
            const chequeOpciones = document.getElementById('chequeOpcionesModal');
            const fechaChequeContainer = document.getElementById('fechaChequeModalContainer');
            const radioHoy = document.querySelector('input[name="chequeTipoModal"][value="hoy"]');
            const radioFuturo = document.querySelector('input[name="chequeTipoModal"][value="futuro"]');

            tipoPago.addEventListener('change', () => {
                if (tipoPago.value === 'cheque') {
                    chequeOpciones.style.display = 'block';
                } else {
                    chequeOpciones.style.display = 'none';
                }
            });
            radioHoy.addEventListener('change', () => { fechaChequeContainer.style.display = 'none'; });
            radioFuturo.addEventListener('change', () => { fechaChequeContainer.style.display = 'block'; });

            document.getElementById('guardarAbonoModalBtn').addEventListener('click', () => {
                const ventaId = document.getElementById('abonoVentaId').value;
                const monto = parseFloat(document.getElementById('abonoMonto').value);
                const tipo = tipoPago.value;
                if (!ventaId || isNaN(monto) || monto <= 0) {
                    alert('Seleccione una factura y monto válido');
                    return;
                }
                const venta = ventas.find(v => v.id === ventaId);
                if (!venta) return;
                if (monto > venta.saldoPendiente) {
                    alert('El monto no puede ser mayor al saldo pendiente');
                    return;
                }

                let fechaCobro = null;
                let estado = 'cobrado';
                if (tipo === 'cheque') {
                    if (radioFuturo.checked) {
                        fechaCobro = document.getElementById('fechaChequeModal').value;
                        if (!fechaCobro) {
                            alert('Debe ingresar fecha de cobro para cheque posfechado');
                            return;
                        }
                        estado = 'pendiente';
                    } else {
                        fechaCobro = new Date().toISOString().slice(0,10);
                        estado = 'cobrado';
                    }
                }

                const nuevoAbono = {
                    id: generarIdAbono(),
                    ventaId,
                    fecha: new Date().toISOString(),
                    monto,
                    tipoPago: tipo,
                    fechaCobro,
                    estado
                };
                abonos.push(nuevoAbono);

                venta.saldoPendiente = redondearDinero(venta.saldoPendiente - monto);
                if (venta.saldoPendiente < 0) venta.saldoPendiente = 0;
                if (venta.saldoPendiente === 0 && !venta.fechaCancelacion) {
                    venta.fechaCancelacion = new Date().toISOString();
                }

                saveData();
                alert('Abono registrado');
                modal.style.display = 'none';
                if (document.querySelector('.tab.active').dataset.tab === 'catalogo') renderCatalogo();
                if (document.querySelector('.tab.active').dataset.tab === 'inventario') renderInventario();
            });

            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        }

        // FUNCIONES DE CALIFICACIÓN RECUPERADAS
        function mostrarModalCalificacion(clienteId) {
            const cliente = clientes.find(c => c.id === clienteId);
            if (!cliente) return;
            const modal = document.getElementById('calificacionModal');
            const content = document.getElementById('calificacionContent');
            
            const califsCliente = calificacionesClientes.filter(c => c.clienteId === cliente.id).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
            let historialHtml = '';
            if(califsCliente.length > 0) {
                historialHtml = `<div class="calificacion-lista" style="margin-top: 15px; max-height: 150px; overflow-y: auto;"><strong>Historial de Calificaciones:</strong>`;
                califsCliente.forEach(cal => {
                    historialHtml += `<div class="calificacion-item"><strong>${new Date(cal.fecha).toLocaleDateString()} (${cal.usuario}):</strong> Contado: ${cal.calificacionContado}★, Crédito: ${cal.calificacionCredito}★<br><em>${cal.comentario || 'Sin comentario'}</em><button class="small danger eliminarCalificacionBtn" data-id="${cal.id}" style="font-size: 0.7rem; margin-left: 8px;">🗑 Eliminar</button></div>`;
                });
                historialHtml += `</div>`;
            }

            content.innerHTML = `
                <h3>Calificar a ${cliente.razonSocial}</h3>
                <label>Calificación pagos al contado (1-5): <input type="number" id="califContado" min="1" max="5" step="1" value="5"></label>
                <label>Calificación pagos al crédito (1-5): <input type="number" id="califCredito" min="1" max="5" step="1" value="5"></label>
                <label>Comentario: <textarea id="califComentario" rows="3" placeholder="Observaciones sobre el comportamiento de pago..."></textarea></label>
                <div style="margin-top:20px; display:flex; gap:10px;"><button id="guardarCalificacionBtn" class="secondary">Guardar Calificación</button><button id="cancelarCalificacionBtn" class="secondary small">Cancelar</button></div>
                ${historialHtml}
            `;
            modal.style.display = 'flex';

            document.getElementById('guardarCalificacionBtn').addEventListener('click', () => {
                const califContado = parseInt(document.getElementById('califContado').value);
                const califCredito = parseInt(document.getElementById('califCredito').value);
                const comentario = document.getElementById('califComentario').value.trim();
                if (isNaN(califContado) || califContado < 1 || califContado > 5 || isNaN(califCredito) || califCredito < 1 || califCredito > 5) {
                    alert('Las calificaciones deben ser números entre 1 y 5');
                    return;
                }
                const nuevaCalificacion = {
                    id: generarIdCalificacion(),
                    clienteId: cliente.id,
                    calificacionContado: califContado,
                    calificacionCredito: califCredito,
                    comentario: comentario,
                    fecha: new Date().toISOString(),
                    usuario: nombreUsuario
                };
                calificacionesClientes.push(nuevaCalificacion);
                saveData();
                modal.style.display = 'none';
                renderCatalogo();
            });
            
            document.querySelectorAll('.eliminarCalificacionBtn').forEach(b => {
                b.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const calId = b.dataset.id;
                    eliminarCalificacion(calId);
                    modal.style.display = 'none';
                });
            });

            document.getElementById('cancelarCalificacionBtn').addEventListener('click', () => { modal.style.display = 'none'; });
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        }

        function eliminarCalificacion(calificacionId) {
            if (confirm('¿Eliminar esta calificación?')) {
                calificacionesClientes = calificacionesClientes.filter(c => c.id !== calificacionId);
                saveData();
                renderCatalogo();
            }
        }
        
        function obtenerPromedioCalificaciones(clienteId) {
            const califs = calificacionesClientes.filter(c => c.clienteId === clienteId);
            if (califs.length === 0) return null;
            let sumContado = 0, sumCredito = 0;
            califs.forEach(c => { sumContado += c.calificacionContado; sumCredito += c.calificacionCredito; });
            return { contado: sumContado / califs.length, credito: sumCredito / califs.length, total: califs.length };
        }

        // ========== PESTAÑA PRODUCTOS ==========
        function renderProductos() {
            let html = `<h2>📦 Catálogo de productos</h2>${mostrarRecordatorios()}<button id="nuevoProductoBtn" class="secondary">➕ Nuevo producto</button><div class="table-responsive">
                       <table>

            let paginaActual = 0;
            const itemsPorPagina = 5;

            function render() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;

                });

                    b.addEventListener('click', () => {

                        const precio = parseFloat(tr.querySelector('.prod-precio').value);
                        const activo = tr.querySelector('.prod-activo').checked;

                if (totalPaginas > 1) {

                    if (paginaActual > 0) { paginaActual--; render(); }

                    if (paginaActual < totalPaginas-1) { paginaActual++; render(); }
                });
            }
            render();

            document.getElementById('nuevoProductoBtn').addEventListener('click', () => {
                const newId = generarIdProducto();
                catalogoProductos.push({ id: newId, nombre: 'Nuevo', precioSugerido: 0, activo: true });
                const fechaVencimiento = new Date();
                fechaVencimiento.setFullYear(fechaVencimiento.getFullYear() + 1);
                inventario.push({ productoId: newId, nombre: 'Nuevo', stock: 0, precioUnitario: 0, costoUnitario: 0, fechaVencimiento: fechaVencimiento.toISOString().slice(0,10) });
                saveData();
                render();
            });
        }

                    </div>

            const actualizarBaseBtn = document.getElementById('actualizarBaseComisionBtn');

            let paginaActual = 0;
            const itemsPorPagina = 5;
            let inventarioFiltrado = [...inventario];

            function calcularBaseComision() {
                const inicio = fechaInicioComision.value;
                const fin = fechaFinComision.value;
                if (!inicio || !fin) return 0;
                const start = new Date(inicio + 'T00:00:00');
                const end = new Date(fin + 'T23:59:59');

                const ventasContadoPeriodo = ventas.filter(v => {
                    const fecha = new Date(v.fecha);
                    return fecha >= start && fecha <= end && v.tipoVenta === 'Contado' && v.estado === 'normal';
                });
                const totalContado = ventasContadoPeriodo.reduce((acc, v) => acc + (parseFloat(v.total) || 0), 0);

                const abonosPeriodo = abonos.filter(a => {
                    const fecha = new Date(a.fecha);
                    return fecha >= start && fecha <= end;
                });
                const totalAbonos = abonosPeriodo.reduce((acc, a) => acc + (a.monto || 0), 0);

                const pagosPropiosPeriodo = pagosCobro.filter(p => {
                    const fecha = new Date(p.fecha);
                    return fecha >= start && fecha <= end && p.tipo === 'propio';
                });
                const totalPagosPropios = pagosPropiosPeriodo.reduce((acc, p) => acc + (p.monto || 0), 0);

                const totalVentasPeriodo = ventas.filter(v => {
                    const fecha = new Date(v.fecha);
                    return fecha >= start && fecha <= end && v.estado === 'normal';
                }).reduce((acc, v) => acc + (parseFloat(v.total) || 0), 0);
                ventasPeriodoTotalSpan.innerText = formatoQ(totalVentasPeriodo);

                const base = totalContado + totalAbonos + totalPagosPropios;
                baseComisionSpan.innerText = formatoQ(base);
                return base;
            }

            function actualizarComision() {
                const base = parseFloat(baseComisionSpan.innerText.replace('Q', '')) || 0;
                const porcentaje = parseFloat(porcentajeInput.value) || 0;
                const comision = redondearDinero(base * porcentaje / 100);
                montoComisionSpan.innerText = formatoQ(comision);
            }

            function calcularClaseVencimiento(fechaVencimiento) {
                if (!fechaVencimiento) return '';
                const hoy = new Date();
                hoy.setHours(0,0,0,0);
                const venc = new Date(fechaVencimiento);
                const diffDays = Math.ceil((venc - hoy) / (1000 * 60 * 60 * 24));
                if (diffDays < 0) return 'vencimiento-rojo';
                if (diffDays <= 90) return 'vencimiento-rojo';
                if (diffDays <= 180) return 'vencimiento-naranja';
                return 'vencimiento-verde';
            }

            function renderInventarioTabla() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const inventarioPagina = inventarioFiltrado.slice(inicio, fin);

                inventarioBody.innerHTML = '';
                let totalValorVenta = 0;
                inventario.forEach(item => {
                    totalValorVenta += item.stock * item.precioUnitario;
                });
                valorInventarioSpan.innerText = formatoQ(totalValorVenta);

                inventarioFiltrado.sort((a,b) => a.nombre.localeCompare(b.nombre));
                inventarioPagina.forEach(item => {
                    const claseVenc = calcularClaseVencimiento(item.fechaVencimiento);
                    const stockClass = item.stock < 5 ? 'stock-bajo' : '';
                    const tr = document.createElement('tr');
                    tr.className = claseVenc;
                    tr.innerHTML = `
                          <td>${item.nombre}</td>
                        <td class="${stockClass}">${item.stock}</td>
                        <td>${formatoQ(item.precioUnitario)}</td>
                        <td><input type="date" class="fecha-vencimiento" data-id="${item.productoId}" value="${item.fechaVencimiento || ''}" style="width:120px;"></td>
                        <td>${claseVenc === 'vencimiento-rojo' ? '🔴 Vence pronto' : (claseVenc === 'vencimiento-naranja' ? '🟠 Próximo a vencer' : '🟢 Vigente')}</td>
                        <td><button class="secondary small ajustarBtn" data-id="${item.productoId}" style="padding:4px 8px; font-size:0.7rem;">✏️ Ajustar</button></td>

                document.querySelectorAll('.fecha-vencimiento').forEach(input => {
                    input.addEventListener('change', (e) => {
                        const prodId = input.dataset.id;
                        const newDate = input.value;
                        const item = inventario.find(i => i.productoId === prodId);
                        if (item && newDate) {
                            item.fechaVencimiento = newDate;
                            saveData();
                            renderInventarioTabla();
                        }
                    });
                });

                actualizarComision();

                const totalPaginas = Math.ceil(inventarioFiltrado.length / itemsPorPagina);
                let paginacionHtml = '';
                if (totalPaginas > 1) {
                    paginacionHtml += `<button class="secondary small" id="paginaInventarioAnterior" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Anterior</button>`;
                    paginacionHtml += `<span> Página ${paginaActual+1} de ${totalPaginas} </span>`;
                    paginacionHtml += `<button class="secondary small" id="paginaInventarioSiguiente" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Siguiente ➔</button>`;
                }
                paginacionDiv.innerHTML = paginacionHtml;

                document.getElementById('paginaInventarioAnterior')?.addEventListener('click', () => {
                    if (paginaActual > 0) { paginaActual--; renderInventarioTabla(); }
                });
                document.getElementById('paginaInventarioSiguiente')?.addEventListener('click', () => {
                    if (paginaActual < totalPaginas-1) { paginaActual++; renderInventarioTabla(); }
                });

                document.querySelectorAll('.ajustarBtn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const prodId = btn.dataset.id;
                        const item = inventario.find(i => i.productoId === prodId);
                        if (!item) return;
                        const nuevaCant = prompt(`Ajustar stock para ${item.nombre}\nStock actual: ${item.stock}\nIngresa nueva cantidad (puede ser negativa):`, item.stock);
                        if (nuevaCant === null) return;
                        const nueva = parseInt(nuevaCant);
                        if (isNaN(nueva)) { alert('Cantidad no válida'); return; }
                        const motivo = prompt('Motivo del ajuste:', 'ajuste manual');
                        if (motivo === null) return;
                        const diferencia = nueva - item.stock;
                        item.stock = nueva;
                        movimientosInventario.push({
                            id: generarIdMovimiento(),
                            fecha: new Date().toISOString(),
                            productoId: item.productoId,
                            productoNombre: item.nombre,
                            tipo: 'ajuste',
                            cantidad: diferencia,
                            motivo: motivo,
                            stockResultante: nueva,
                            usuario: 'admin',
                            documento: 'Ajuste manual'
                        });
                        saveData();
                        renderInventarioTabla();
                        renderMovimientos();
                    });
                });
            }

            function renderMovimientos() {
                movimientosBody.innerHTML = '';
                const ultimos = movimientosInventario.sort((a,b) => new Date(b.fecha) - new Date(a.fecha)).slice(0, 20);
                ultimos.forEach(m => {
                    const tr = document.createElement('tr');
                    const claseCant = m.cantidad > 0 ? 'movimiento-positivo' : (m.cantidad < 0 ? 'movimiento-negativo' : '');
                    tr.innerHTML = `
                          <td>${new Date(m.fecha).toLocaleString()}</td>
                          <td>${m.productoNombre}</td>
                          <td>${m.tipo}</td>
                        <td class="${claseCant}">${m.cantidad > 0 ? '+' : ''}${m.cantidad}</td>
                          <td>${m.stockResultante}</td>
                          <td>${m.motivo || ''}</td>
                    `;
                    movimientosBody.appendChild(tr);
                });
            }

            function mostrarHistorialProducto(prodId) {
                if (!prodId) {
                    historialContainer.innerHTML = '<p>Seleccione un producto</p>';
                    return;
                }
                const movs = movimientosInventario.filter(m => m.productoId === prodId).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                if (movs.length === 0) {
                    historialContainer.innerHTML = '<p>No hay movimientos para este producto.</p>';
                    return;
                }
                const hoy = new Date();
                const diaSemana = hoy.getDay();
                const diff = diaSemana === 0 ? 6 : diaSemana - 1;
                const lunes = new Date(hoy);
                lunes.setDate(hoy.getDate() - diff);
                lunes.setHours(0,0,0,0);
                const viernes = new Date(lunes);
                viernes.setDate(lunes.getDate() + 4);
                viernes.setHours(23,59,59,999);
                const finSemana = hoy < viernes ? hoy : viernes;
                const inicioMes = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
                inicioMes.setHours(0,0,0,0);
                const finMes = hoy;

                const movsSemana = movs.filter(m => new Date(m.fecha) >= lunes && new Date(m.fecha) <= finSemana);
                const movsMes = movs.filter(m => new Date(m.fecha) >= inicioMes && new Date(m.fecha) <= finMes);

                const ventasSemana = movsSemana.filter(m => m.tipo === 'venta').reduce((acc, m) => acc + Math.abs(m.cantidad), 0);
                const recargasSemana = movsSemana.filter(m => m.tipo === 'ajuste' && m.cantidad > 0).reduce((acc, m) => acc + m.cantidad, 0);
                const ventasMes = movsMes.filter(m => m.tipo === 'venta').reduce((acc, m) => acc + Math.abs(m.cantidad), 0);
                const recargasMes = movsMes.filter(m => m.tipo === 'ajuste' && m.cantidad > 0).reduce((acc, m) => acc + m.cantidad, 0);

                let html = `<div style="background: #e8f5e9; padding: 10px; border-radius: 20px; margin-bottom: 10px;"><strong>Resumen semana:</strong> Ventas: ${ventasSemana} | Recargas: ${recargasSemana}<br><strong>Resumen mes:</strong> Ventas: ${ventasMes} | Recargas: ${recargasMes}</div><div class="table-responsive">
                       <table>
                         <thead><tr><th>Fecha</th><th>Tipo</th><th>Cantidad</th><th>Stock resultante</th><th>Motivo</th></tr></thead><tbody>`;
                movs.forEach(m => {
                    const claseCant = m.cantidad > 0 ? 'movimiento-positivo' : (m.cantidad < 0 ? 'movimiento-negativo' : '');
                    html += `<tr><td>${new Date(m.fecha).toLocaleString()}</td><td>${m.tipo}</td><td class="${claseCant}">${m.cantidad > 0 ? '+' : ''}${m.cantidad}</td><td>${m.stockResultante}</td><td>${m.motivo || ''}</td></tr>`;
                });
                html += '</tbody></table></div><div style="margin-top: 10px;"><button class="secondary small" id="exportarHistorialPDF">📄 Exportar PDF</button></div>';
                historialContainer.innerHTML = html;

                document.getElementById('exportarHistorialPDF')?.addEventListener('click', () => {
                    exportarHistorialProductoPDF(prodId);
                });
            }

            function exportarHistorialProductoPDF(prodId) {
                const producto = catalogoProductos.find(p => p.id === prodId);
                if (!producto) return;
                const itemInv = inventario.find(i => i.productoId === prodId);
                const stockActual = itemInv ? itemInv.stock : 0;

                const hoy = new Date();
                const diaSemana = hoy.getDay();
                const diff = diaSemana === 0 ? 6 : diaSemana - 1;
                const lunes = new Date(hoy);

        function mostrarResumenVentas(periodo) {
            const hoy = new Date();
            let inicio, fin;
            if (periodo === 'semana') {
                const diaSemana = hoy.getDay();
                const diff = diaSemana === 0 ? 6 : diaSemana - 1;
                inicio = new Date(hoy);
                inicio.setDate(hoy.getDate() - diff);
                inicio.setHours(0,0,0,0);
                fin = new Date(hoy);
                fin.setHours(23,59,59,999);
            } else {
                inicio = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
                inicio.setHours(0,0,0,0);
                fin = new Date(hoy.getFullYear(), hoy.getMonth() + 1, 0, 23, 59, 59, 999);
            }
            generarReporteDetalladoPDF(periodo, inicio, fin);
        }

            doc.setFont('helvetica', 'normal');

            doc.text('PBX: 2250-0859 | WhatsApp: 5015-9647', 14, 27);
            doc.setFont('helvetica', 'bold');
            doc.text(`Colaborador: ${nombreUsuario}`, doc.internal.pageSize.getWidth() - 14, 15, { align: 'right' });

            doc.text(`Fecha/Hora: ${fechaHora}`, doc.internal.pageSize.getWidth() - 14, 27, { align: 'right' });

            doc.line(10, 32, doc.internal.pageSize.getWidth() - 10, 32);

            doc.setFontSize(14);
            doc.setTextColor(7, 94, 84);
            doc.text(titulo, doc.internal.pageSize.getWidth() / 2, 40, { align: 'center' });
            doc.setFontSize(9);
            doc.setTextColor(60);
            doc.text(`Período: ${fechaInicio.toLocaleDateString()} - ${fechaFin.toLocaleDateString()}`, doc.internal.pageSize.getWidth() / 2, 47, { align: 'center' });

            const ventasPeriodo = ventas.filter(v => {
                if (v.estado !== 'normal') return false;
                const f = new Date(v.fecha);
                return f >= fechaInicio && f <= fechaFin;
            });

            const tableBody = ventasPeriodo.map(v => {
                const cliente = clientes.find(c => c.id === v.clienteId) || { razonSocial: '?', codigo: '', nit: '', direccion: '' };
                const detalleMercancia = v.productos.map(p => `${p.unidades} x ${p.producto} @ ${formatoQ(p.precioUnitario)}`).join(', ');
                const condiciones = v.tipoVenta === 'Contado' ? 'Contado' : `Crédito (vence: ${new Date(v.fechaVencimiento).toLocaleDateString()})`;
                return [
                    new Date(v.fecha).toLocaleDateString(),
                    cliente.codigo || 'S/C',
                    cliente.razonSocial,
                    cliente.nit || 'C/F',
                    cliente.direccion || '—',
                    v.id.substr(0,8),
                    detalleMercancia,
                    condiciones,
                    formatoQ(v.total)
                ];
            });

            doc.autoTable({
                startY: 52,
                head: [['Fecha', 'Código', 'Razón Social', 'NIT', 'Dirección', 'Documento', 'Detalle Mercancía', 'Condiciones', 'Total (Q)']],
                body: tableBody,
                theme: 'striped',
                headStyles: { fillColor: [7, 94, 84], textColor: 255 },
                styles: { fontSize: 8 },
                columnStyles: {
                    0: { cellWidth: 25 },
                    1: { cellWidth: 20 },
                    2: { cellWidth: 40 },
                    3: { cellWidth: 25 },
                    4: { cellWidth: 40 },
                    5: { cellWidth: 20 },
                    6: { cellWidth: 55 },
                    7: { cellWidth: 30 },
                    8: { cellWidth: 25 }
                }
            });

            let totalContado = 0, totalCredito = 0;
            ventasPeriodo.forEach(v => {
                const total = parseFloat(v.total) || 0;
                if (v.tipoVenta === 'Contado') totalContado += total;
                else totalCredito += total;
            });
            const finalY = doc.lastAutoTable.finalY + 10;
            doc.setFont('helvetica', 'bold');
            doc.text(`Total Ventas Contado: ${formatoQ(totalContado)}`, 14, finalY);
            doc.text(`Total Ventas Crédito: ${formatoQ(totalCredito)}`, 14, finalY + 6);
            doc.text(`TOTAL GENERAL: ${formatoQ(totalContado + totalCredito)}`, 14, finalY + 12);

            const unidadesContado = {}, unidadesCredito = {};
            ventasPeriodo.forEach(v => {
                v.productos.forEach(p => {
                    const nom = p.producto;
                    const unidades = p.unidades || 0;
                    if (v.tipoVenta === 'Contado') {
                        unidadesContado[nom] = (unidadesContado[nom] || 0) + unidades;
                    } else {
                        unidadesCredito[nom] = (unidadesCredito[nom] || 0) + unidades;
                    }
                });
            });
            const todosProductos = new Set([...Object.keys(unidadesContado), ...Object.keys(unidadesCredito)]);
            const desgloseRows = Array.from(todosProductos).sort().map(prod => [
                prod,
                unidadesContado[prod] || 0,
                unidadesCredito[prod] || 0,
                (unidadesContado[prod] || 0) + (unidadesCredito[prod] || 0)
            ]);
            if (desgloseRows.length > 0) {
                doc.addPage();
                doc.setFontSize(12);
                doc.text('Desglose de Unidades por Tipo de Venta', 14, 15);
                doc.autoTable({
                    startY: 20,
                    head: [['Producto', 'Unidades Contado', 'Unidades Crédito', 'Total Unidades']],
                    body: desgloseRows,
                    theme: 'striped',
                    headStyles: { fillColor: [37, 211, 102] }
                });
            }

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(100);
                doc.text(`Página ${i} de ${totalPages}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 10, { align: 'right' });
            }

            doc.save(`${titulo.replace(' ', '_')}_${nombreUsuario.replace(/\s+/g,'_')}_${fechaInicio.toISOString().slice(0,10)}.pdf`);
        }

        function generarResumenComisiones() {

            }

            const end = new Date(fin + 'T23:59:59');

                const fecha = new Date(v.fecha);
                return fecha >= start && fecha <= end && v.tipoVenta === 'Contado' && v.estado === 'normal';
            });
            const abonosPeriodo = abonos.filter(a => {
                const fecha = new Date(a.fecha);
                return fecha >= start && fecha <= end;
            });

                if (pagosPropiosPeriodo.length > 0) {

                        return [cobro ? cobro.numeroDocumento : '', cli.razonSocial, formatoQ(p.monto), p.metodoPago];
                    });
                    pagosRows.push(['Total', '', formatoQ(totalPagosPropios), '']);
                    doc.autoTable({ startY: y, head: [['Documento', 'Cliente', 'Monto', 'Método']], body: pagosRows, margin: { left: 14 }, styles: { fontSize: 8 } });

                } else {

                    y += 6;
                }

                doc.setFontSize(12);
                doc.text(`TOTAL BASE DE COMISIÓN: ${formatoQ(granTotal)}`, 14, y);

                }
                doc.save(`resumen_comisiones_${nombreUsuario.replace(/\s+/g,'_')}_${new Date().toISOString().slice(0,10)}.pdf`);
            });
        }

        function generarAnalisisTrimestral(trimestre, anio) {
            const config = {
                'Q1': { inicioMes: 10, finMes: 0, anioOffset: -1 },
                'Q2': { inicioMes: 1, finMes: 3, anioOffset: 0 },
                'Q3': { inicioMes: 4, finMes: 6, anioOffset: 0 },
                'Q4': { inicioMes: 7, finMes: 9, anioOffset: 0 }
            };
            const sel = config[trimestre];
            const fechaInicio = new Date(anio + sel.anioOffset, sel.inicioMes, 1);
            const fechaFin = new Date(anio, sel.finMes + 1, 0, 23, 59, 59);

            const ventasQ = ventas.filter(v => {
                const f = new Date(v.fecha);
                return f >= fechaInicio && f <= fechaFin && v.estado === 'normal';
            });
            if (ventasQ.length === 0) { alert("No hay datos para este periodo"); return; }

            let totalContado = 0, totalCredito = 0;
            ventasQ.forEach(v => {
                const t = parseFloat(v.total) || 0;
                if (v.tipoVenta === 'Contado') totalContado += t;
                else totalCredito += t;
            });
            const totalVentas = totalContado + totalCredito;
            const numFacturas = ventasQ.length;
            const ticketPromedio = numFacturas > 0 ? totalVentas / numFacturas : 0;

            // Descuentos totales (fuga)
            let totalPotencial = 0;
            let fugaTotal = 0;
            ventasQ.forEach(v => {
                v.productos.forEach(p => {
                    const prodOriginal = catalogoProductos.find(cp => cp.id === p.productoId);
                    if (prodOriginal) {
                        const potencial = prodOriginal.precioSugerido * p.unidades;
                        const real = parseFloat(p.monto);
                        totalPotencial += potencial;
                        fugaTotal += Math.max(0, potencial - real);
                    }
                });
            });
            const porcentajeDescuento = totalPotencial > 0 ? (fugaTotal / totalPotencial) * 100 : 0;

            // Saldo de créditos pendiente del trimestre
            let saldoCreditoPendiente = 0;
            ventasQ.forEach(v => {
                if (v.tipoVenta === 'Crédito') {
                    saldoCreditoPendiente += (v.saldoPendiente || 0);
                }
            });

            const abonosPeriodo = abonos.filter(a => {
                const fecha = new Date(a.fecha);
                return fecha >= fechaInicio && fecha <= fechaFin;
            });
            const totalAbonos = abonosPeriodo.reduce((acc, a) => acc + (a.monto || 0), 0);
            const pagosCobroPeriodo = pagosCobro.filter(p => {
                const fecha = new Date(p.fecha);
                return fecha >= fechaInicio && fecha <= fechaFin && p.tipo === 'propio';
            });
            const totalPagosPropios = pagosCobroPeriodo.reduce((acc, p) => acc + (p.monto || 0), 0);
            const ingresosEfectivo = totalContado + totalAbonos + totalPagosPropios;
            const creditosOtorgados = ventasQ.filter(v => v.tipoVenta === 'Crédito').reduce((acc, v) => acc + parseFloat(v.total), 0);
            const eficienciaCobro = creditosOtorgados > 0 ? (ingresosEfectivo / creditosOtorgados) * 100 : 0;

            const saldosPorRango = { '0-30': 0, '31-45': 0, '46-60': 0, '>60': 0 };
            ventasQ.forEach(v => {
                if (v.tipoVenta !== 'Crédito') return;
                const abonosHasta = abonos.filter(a => a.ventaId === v.id && new Date(a.fecha) <= fechaFin);
                const totalAbonado = abonosHasta.reduce((acc, a) => acc + (a.monto || 0), 0);
                const saldo = Math.max(0, (v.total || 0) - totalAbonado);
                if (saldo === 0) return;
                const vencimiento = new Date(v.fechaVencimiento);
                const diasMora = Math.ceil((fechaFin - vencimiento) / (1000*60*60*24));
                if (diasMora <= 30) saldosPorRango['0-30'] += saldo;
                else if (diasMora <= 45) saldosPorRango['31-45'] += saldo;
                else if (diasMora <= 60) saldosPorRango['46-60'] += saldo;
                else saldosPorRango['>60'] += saldo;
            });

            const ventasPorProducto = {};
            ventasQ.forEach(v => {
                v.productos.forEach(p => {
                    const nom = p.producto;
                    ventasPorProducto[nom] = (ventasPorProducto[nom] || 0) + (p.unidades || 0);
                });
            });
            const ranking = Object.entries(ventasPorProducto).sort((a,b) => b[1] - a[1]);
            const top10 = ranking.slice(0, 10);
            const bottom5 = ranking.slice(-5).reverse();

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'landscape', format: 'legal' });
            const correlativo = obtenerCorrelativoReporte();
            const fechaHora = new Date().toLocaleString();

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(12);
            doc.setTextColor(7, 94, 84);
            doc.text('Droguería Marijose Jhire', 14, 15);
            doc.setFontSize(9);
            doc.setFont('helvetica', 'normal');
            doc.text('7 calle 0-36 zona 1, Ciudad de Guatemala', 14, 21);
            doc.text('PBX: 2250-0859 | WhatsApp: 5015-9647', 14, 27);
            doc.setFont('helvetica', 'bold');
            doc.text(`Colaborador: ${nombreUsuario}`, doc.internal.pageSize.getWidth() - 14, 15, { align: 'right' });
            doc.text(`ID Reporte: ${correlativo}`, doc.internal.pageSize.getWidth() - 14, 21, { align: 'right' });
            doc.text(`Fecha/Hora: ${fechaHora}`, doc.internal.pageSize.getWidth() - 14, 27, { align: 'right' });
            doc.setDrawColor(37, 211, 102);
            doc.line(10, 32, doc.internal.pageSize.getWidth() - 10, 32);

            doc.setFontSize(14);
            doc.text(`REPORTE GERENCIAL - ${trimestre} ${anio}`, doc.internal.pageSize.getWidth() / 2, 40, { align: 'center' });
            doc.setFontSize(10);
            doc.autoTable({
                startY: 48,
                head: [['KPI / Indicador Financiero', 'Valor']],
                body: [
                    ['Volumen de Ventas (Contado)', formatoQ(totalContado)],
                    ['Volumen de Ventas (Crédito)', formatoQ(totalCredito)],
                    ['Total de Ingresos Generados', formatoQ(totalVentas)],
                    ['Ticket Promedio de Venta', formatoQ(ticketPromedio)],
                    ['Porcentaje de Descuento Promedio', porcentajeDescuento.toFixed(2) + '%'],
                    ['Monto total de descuentos', formatoQ(fugaTotal)],
                    ['Saldo de créditos pendiente', formatoQ(saldoCreditoPendiente)],
                    ['Eficiencia de Cobro (Efectivo / Créditos Otorgados)', eficienciaCobro.toFixed(2) + '%']
                ],
                theme: 'grid',
                headStyles: { fillColor: [7, 94, 84], textColor: 255 }
            });

            doc.text("Análisis de Mora por Días de Crédito", 14, doc.lastAutoTable.finalY + 15);
            const agingBody = [
                ['0 - 30 días', formatoQ(saldosPorRango['0-30']), 'Verde'],
                ['31 - 45 días', formatoQ(saldosPorRango['31-45']), 'Naranja'],
                ['46 - 60 días', formatoQ(saldosPorRango['46-60']), 'Naranja'],
                ['Más de 60 días', formatoQ(saldosPorRango['>60']), 'Rojo']
            ];
            doc.autoTable({
                startY: doc.lastAutoTable.finalY + 20,
                head: [['Rango', 'Saldo Pendiente', 'Estado']],
                body: agingBody,
                theme: 'striped',
                headStyles: { fillColor: [37, 211, 102] }
            });

            if (top10.length > 0) {
                doc.text("Top 10 Productos Más Vendidos", 14, doc.lastAutoTable.finalY + 15);
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 20,
                    head: [['Producto', 'Cantidad']],
                    body: top10,
                    headStyles: { fillColor: [37, 211, 102] }
                });
            }

            if (bottom5.length > 0) {
                doc.text("Bottom 5 Productos Menos Vendidos", 14, doc.lastAutoTable.finalY + 15);
                doc.autoTable({
                    startY: doc.lastAutoTable.finalY + 20,
                    head: [['Producto', 'Cantidad']],
                    body: bottom5,
                    headStyles: { fillColor: [220, 53, 69] }
                });
            }

            const unidadesContado = {}, unidadesCredito = {};
            ventasQ.forEach(v => {
                v.productos.forEach(p => {
                    const nom = p.producto;
                    const unidades = p.unidades || 0;
                    if (v.tipoVenta === 'Contado') {
                        unidadesContado[nom] = (unidadesContado[nom] || 0) + unidades;
                    } else {
                        unidadesCredito[nom] = (unidadesCredito[nom] || 0) + unidades;
                    }
                });
            });
            const todosProductos = new Set([...Object.keys(unidadesContado), ...Object.keys(unidadesCredito)]);
            const desgloseRows = Array.from(todosProductos).sort().map(prod => [
                prod,
                unidadesContado[prod] || 0,
                unidadesCredito[prod] || 0,
                (unidadesContado[prod] || 0) + (unidadesCredito[prod] || 0)
            ]);
            if (desgloseRows.length > 0) {
                doc.addPage();
                doc.setFontSize(12);
                doc.text('Desglose de Unidades por Tipo de Venta (Contado vs Crédito)', 14, 15);
                doc.autoTable({
                    startY: 20,
                    head: [['Producto', 'Unidades Contado', 'Unidades Crédito', 'Total Unidades']],
                    body: desgloseRows,
                    theme: 'striped',
                    headStyles: { fillColor: [37, 211, 102] }
                });
            }

            const totalPages = doc.internal.getNumberOfPages();
            for (let i = 1; i <= totalPages; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.setTextColor(100);
                doc.text(`Página ${i} de ${totalPages}`, doc.internal.pageSize.getWidth() - 14, doc.internal.pageSize.getHeight() - 10, { align: 'right' });
            }
            doc.save(`ANALISIS_GERENCIAL_${trimestre}_${anio}.pdf`);
        }

        // ========== PESTAÑA COBROS ==========
        function renderCobros() {
            let html = `
                <h2>💰 Cobros recuperados</h2>

                    <button id="eliminarTodosCobrosBtn" class="danger small">🗑️ Eliminar todos los cobros</button>

                    <div id="clienteSeleccionadoCobroContainer"></div><div id="listaClientesCobroResultado" class="client-list"></div><div id="paginacionClientesCobro" class="paginacion"></div>
