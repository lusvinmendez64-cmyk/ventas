                    <label>Teléfono: <input type="tel" id="telefonoCobro"></label><label>Encargado: <input type="text" id="encargadoCobro"></label>
                    <label>Número de documento: <input type="text" id="numeroDocumentoCobro" required></label><label>Fecha: <input type="date" id="fechaCobro" value="${new Date().toISOString().slice(0,10)}"></label>
                    <label>Monto total: <input type="number" id="montoTotalCobro" step="0.01" min="0" required></label>
                    <div class="action-buttons" style="justify-content: flex-start;"><button id="guardarCobroBtn" class="secondary">💾 Guardar cobro</button></div>
                </fieldset>
                <div id="ventasDelDiaContainer" style="margin-top: 20px;"></div>
                <h3>Lista de cobros</h3>
                <div class="table-responsive">
                       <table>
                         <thead><tr><th>Fecha</th><th>Documento</th><th>Cliente</th><th>Monto total</th><th>Saldo pendiente</th><th>Acciones</th></tr></thead>
                        <tbody id="cobrosBody"></tbody>
                      </table>
                </div>
                <div id="paginacionCobros" class="paginacion"></div>
            `;
            contentEl.innerHTML = html;

            document.getElementById('eliminarTodosCobrosBtn').addEventListener('click', () => {
                if (cobros.length === 0) { alert('No hay cobros para eliminar.'); return; }
                if (confirm('¿Estás seguro de eliminar TODOS los cobros y sus pagos? Esta acción no se puede deshacer.')) {
                    cobros = [];
                    pagosCobro = [];
                    saveData();
                    renderCobros();
                    alert('Todos los cobros han sido eliminados.');
                }
            });

            const buscarInput = document.getElementById('buscarClienteCobro');
            const listaResultado = document.getElementById('listaClientesCobroResultado');
            const paginacionDiv = document.getElementById('paginacionClientesCobro');
            const clienteSelContainer = document.getElementById('clienteSeleccionadoCobroContainer');
            const codigoCliente = document.getElementById('codigoClienteCobro');
            const razonSocial = document.getElementById('razonSocialCobro');
            const nit = document.getElementById('nitCobro');
            const direccion = document.getElementById('direccionCobro');
            const telefono = document.getElementById('telefonoCobro');
            const encargado = document.getElementById('encargadoCobro');
            const numeroDocumento = document.getElementById('numeroDocumentoCobro');
            const fechaCobro = document.getElementById('fechaCobro');
            const montoTotal = document.getElementById('montoTotalCobro');
            const guardarBtn = document.getElementById('guardarCobroBtn');
            const ventasDelDiaContainer = document.getElementById('ventasDelDiaContainer');

            let clienteSeleccionado = null;
            let resultadosFiltrados = [];
            let paginaActual = 0;
            const itemsPorPagina = 5;

            function renderBusqueda(termino) {
                const term = termino.toLowerCase().trim();
                resultadosFiltrados = clientes.filter(c => 
                    c.razonSocial.toLowerCase().includes(term) || 
                    (c.nit && c.nit.toLowerCase().includes(term)) || 
                    (c.codigo && c.codigo.toLowerCase().includes(term))
                );
                paginaActual = 0;
                mostrarPagina();
            }

            function mostrarPagina() {
                const inicio = paginaActual * itemsPorPagina;
                const fin = inicio + itemsPorPagina;
                const paginaResultados = resultadosFiltrados.slice(inicio, fin);

                if (paginaResultados.length === 0) {
                    listaResultado.innerHTML = '<div class="client-item">(ningún cliente coincide)</div>';
                } else {
                    let items = '';
                    paginaResultados.forEach(c => {
                        items += `<div class="client-item" data-id="${c.id}"><span>${c.razonSocial} ${c.codigo ? '· '+c.codigo : ''}</span><span class="client-code">${c.nit || 'sin NIT'}</span></div>`;
                    });
                    listaResultado.innerHTML = items;
                }

                let paginacionHtml = '';
                const totalPaginas = Math.ceil(resultadosFiltrados.length / itemsPorPagina);
                if (totalPaginas > 1) {
                    paginacionHtml += `<button class="secondary small" id="paginaAnteriorCobro" ${paginaActual === 0 ? 'disabled' : ''}>⬅ Anterior</button>`;
                    paginacionHtml += `<span> Página ${paginaActual+1} de ${totalPaginas} </span>`;
                    paginacionHtml += `<button class="secondary small" id="paginaSiguienteCobro" ${paginaActual >= totalPaginas-1 ? 'disabled' : ''}>Siguiente ➔</button>`;
                }
                paginacionDiv.innerHTML = paginacionHtml;

                document.querySelectorAll('.client-item').forEach(el => {
                    el.addEventListener('click', () => {
                        const id = el.dataset.id;
                        const cliente = clientes.find(c => c.id === id);
                        if (cliente) {
                            clienteSeleccionado = cliente;
                            codigoCliente.value = cliente.codigo || '';
                            razonSocial.value = cliente.razonSocial;
                            nit.value = cliente.nit || '';
                            direccion.value = cliente.direccion || '';
                            telefono.value = cliente.telefono || '';
                            encargado.value = cliente.encargado || '';
                            clienteSelContainer.innerHTML = `<div class="badge">✅ Cliente: ${cliente.razonSocial} ${cliente.codigo ? '('+cliente.codigo+')' : ''}<button id="quitarSeleccionCobroBtn" class="small secondary">✕ Quitar</button></div>`;
                            document.getElementById('quitarSeleccionCobroBtn')?.addEventListener('click', () => limpiarCliente());
                            renderBusqueda('');
                            buscarInput.value = '';

                            const hoy = new Date().toDateString();
                            const ventasClienteHoy = ventas.filter(v => v.clienteId === cliente.id && new Date(v.fecha).toDateString() === hoy && v.estado === 'normal');
                            if (ventasClienteHoy.length === 0) {
                                ventasDelDiaContainer.innerHTML = '<p>No hay ventas registradas hoy para este cliente.</p>';
                            } else {
                                let html = `<fieldset><legend>Ventas del día de este cliente</legend><div class="table-responsive">
                                       <table>
                                         <thead><tr><th>Documento (ID)</th><th>Saldo original</th><th>Saldo pendiente</th><th>Estado</th></tr></thead><tbody>`;
                                ventasClienteHoy.forEach(v => {
                                    const docId = v.id.substr(0,8);
                                    const saldoOriginal = parseFloat(v.total).toFixed(2);
                                    const saldoPendiente = v.tipoVenta === 'Crédito' ? (v.saldoPendiente || 0).toFixed(2) : '0.00';
                                    const estado = (v.tipoVenta === 'Contado' || v.saldoPendiente === 0) ? 'Cancelado' : `Pendiente: Q${saldoPendiente}`;
                                    html += `<tr><td>${docId}</td><td>${formatoQ(saldoOriginal)}</td><td>${formatoQ(saldoPendiente)}</td><td>${estado}</td></tr>`;
                                });
                                html += `</tbody></table></div></fieldset>`;
                                ventasDelDiaContainer.innerHTML = html;
                            }
                        }
                    });
                });

                const btnAnterior = document.getElementById('paginaAnteriorCobro');
                const btnSiguiente = document.getElementById('paginaSiguienteCobro');
                if (btnAnterior) btnAnterior.addEventListener('click', () => { if (paginaActual > 0) { paginaActual--; mostrarPagina(); } });
                if (btnSiguiente) btnSiguiente.addEventListener('click', () => { if (paginaActual < totalPaginas-1) { paginaActual++; mostrarPagina(); } });
            }

            function limpiarCliente() {
                codigoCliente.value = ''; razonSocial.value = ''; nit.value = ''; direccion.value = ''; telefono.value = ''; encargado.value = '';
                clienteSeleccionado = null;
                clienteSelContainer.innerHTML = '';
                renderBusqueda(buscarInput.value);
                ventasDelDiaContainer.innerHTML = '';
            }

            buscarInput.addEventListener('input', () => renderBusqueda(buscarInput.value));
            document.getElementById('limpiarBusquedaCobroBtn').addEventListener('click', () => { buscarInput.value = ''; renderBusqueda(''); });

            guardarBtn.addEventListener('click', () => {
                const razon = razonSocial.value.trim();
                if (!razon) { alert('Razón social obligatoria'); return; }
                const doc = numeroDocumento.value.trim();
                if (!doc) { alert('Número de documento obligatorio'); return; }
                const monto = parseFloat(montoTotal.value);
                if (isNaN(monto) || monto <= 0) { alert('Monto total inválido'); return; }

                let clienteFinal = clienteSeleccionado;
                const datosForm = {
                    codigo: codigoCliente.value.trim() || null,
                    razonSocial: razon,
                    nit: nit.value.trim() || null,
                    direccion: direccion.value.trim(),
                    telefono: telefono.value.trim(),
                    encargado: encargado.value.trim()
                };

                if (!clienteFinal) {
                    clienteFinal = { 
                        id: generarIdCliente(),
                        ...datosForm,
                        codigo: datosForm.codigo || '',
                        correo: '',
                        fechaCreacion: new Date().toISOString(),
                        categoria: '',
                        ruta: '',
                        limiteCredito: null
                    };
                    clientes.push(clienteFinal);
                } else {
                    Object.assign(clienteFinal, datosForm);
                }
                saveData();

                const nuevoCobro = {
                    id: generarIdCobro(),
                    numeroDocumento: doc,
                    fecha: new Date(fechaCobro.value + 'T12:00:00').toISOString(),
                    montoTotal: monto,
                    clienteId: clienteFinal.id,
                    saldoPendiente: monto,
                    fechaCreacion: new Date().toISOString()
                };
                cobros.push(nuevoCobro);
                saveData();

                alert('Cobro registrado');
                limpiarCliente();
                numeroDocumento.value = '';
                fechaCobro.value = new Date().toISOString().slice(0,10);
                montoTotal.value = '';
                renderListaCobros();
            });

            function renderListaCobros() {
                const tbody = document.getElementById('cobrosBody');
                const paginacionCobros = document.getElementById('paginacionCobros');
                if (!tbody) return;

                const cobrosOrdenados = [...cobros].sort((a,b) => new Date(b.fecha) - new Date(a.fecha));
                let paginaCobros = 0;
                const itemsPorPaginaCobros = 5;

                function mostrarPaginaCobros() {
                    const inicio = paginaCobros * itemsPorPaginaCobros;
                    const fin = inicio + itemsPorPaginaCobros;
                    const pagina = cobrosOrdenados.slice(inicio, fin);

                    tbody.innerHTML = '';
                    pagina.forEach(c => {
                        const cliente = clientes.find(cl => cl.id === c.clienteId) || { razonSocial: 'Desconocido' };
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                              <td>${new Date(c.fecha).toLocaleDateString()}</td>
                              <td>${c.numeroDocumento}</td>
                              <td>${cliente.razonSocial}</td>
                              <td>${formatoQ(c.montoTotal)}</td>
                              <td>${formatoQ(c.saldoPendiente)}</td>
                              <td><button class="secondary small verEstadoCobroBtn" data-id="${c.id}">📊 Estado</button><button class="secondary small agregarPagoCobroBtn" data-id="${c.id}">💰 Pago</button><button class="danger small eliminarCobroBtn" data-id="${c.id}">🗑 Eliminar</button></td>
                        `;
                        tbody.appendChild(tr);
                    });

                    const totalPaginas = Math.ceil(cobrosOrdenados.length / itemsPorPaginaCobros);
                    let paginacionHtml = '';
                    if (totalPaginas > 1) {
                        paginacionHtml += `<button class="secondary small" id="paginaCobrosAnterior" ${paginaCobros === 0 ? 'disabled' : ''}>⬅ Anterior</button>`;
                        paginacionHtml += `<span> Página ${paginaCobros+1} de ${totalPaginas} </span>`;
                        paginacionHtml += `<button class="secondary small" id="paginaCobrosSiguiente" ${paginaCobros >= totalPaginas-1 ? 'disabled' : ''}>Siguiente ➔</button>`;
                    }
                    paginacionCobros.innerHTML = paginacionHtml;

                    document.getElementById('paginaCobrosAnterior')?.addEventListener('click', () => {
                        if (paginaCobros > 0) { paginaCobros--; mostrarPaginaCobros(); }
                    });
                    document.getElementById('paginaCobrosSiguiente')?.addEventListener('click', () => {
                        if (paginaCobros < totalPaginas-1) { paginaCobros++; mostrarPaginaCobros(); }
                    });

                    document.querySelectorAll('.verEstadoCobroBtn, .agregarPagoCobroBtn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const cobroId = btn.dataset.id;
                            mostrarEstadoCuentaCobro(cobroId);
                        });
                    });
                    document.querySelectorAll('.eliminarCobroBtn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            const cobroId = btn.dataset.id;
                            if (confirm('¿Estás seguro de eliminar este cobro y todos sus pagos?')) {
                                cobros = cobros.filter(c => c.id !== cobroId);
                                pagosCobro = pagosCobro.filter(p => p.cobroId !== cobroId);
                                saveData();
                                renderListaCobros();
                            }
                        });
                    });
                }
                mostrarPaginaCobros();
            }
            renderListaCobros();
        }

        function mostrarEstadoCuentaCobro(cobroId) {
            const cobro = cobros.find(c => c.id === cobroId);
            if (!cobro) return;
            const cliente = clientes.find(c => c.id === cobro.clienteId) || { razonSocial: '?' };
            const pagos = pagosCobro.filter(p => p.cobroId === cobroId).sort((a,b) => new Date(b.fecha) - new Date(a.fecha));

            let html = `<h3>Estado de cobro: ${cobro.numeroDocumento}</h3><p>Cliente: ${cliente.razonSocial}</p><p>Monto total: ${formatoQ(cobro.montoTotal)} | Saldo pendiente: ${formatoQ(cobro.saldoPendiente)}</p><div style="margin-bottom: 10px;"><button id="eliminarCobroDesdeModalBtn" class="danger small">🗑 Eliminar este cobro</button></div><h4>Pagos realizados</h4><div class="table-responsive">
                   <table>
                     <thead><tr><th>Fecha</th><th>Monto</th><th>Tipo</th><th>% base</th><th>Método de pago</th></tr></thead><tbody>`;
            if (pagos.length === 0) {
                html += '<tr><td colspan="5">No hay pagos registrados.</td></tr>';
            } else {
                pagos.forEach(p => {
                    html += `<tr><td>${new Date(p.fecha).toLocaleDateString()}</td><td>${formatoQ(p.monto)}</td><td>${p.tipo}</td><td>${p.tipo === 'ajeno' ? p.porcentaje + '%' : '100%'}</td><td>${p.metodoPago}</td></tr>`;
                });
            }
            html += `</tbody></table></div><h4>Registrar nuevo pago</h4><label>Monto: <input type="number" id="pagoMontoCobro" step="0.01" min="0.01" max="${cobro.saldoPendiente}"></label><label>Tipo: <select id="pagoTipoCobro"><option value="propio">Propio</option><option value="ajeno">Ajeno</option></select></label><div id="porcentajeContainerCobro" style="display:none; margin-top:10px;"><label>Porcentaje base para comisión (0-100): <input type="number" id="pagoPorcentajeCobro" value="100" min="0" max="100" step="0.1"></label></div><label>Método de pago: <select id="pagoMetodoCobro"><option value="efectivo">Efectivo</option><option value="cheque">Cheque</option><option value="transferencia">Transferencia</option></select></label><label>Fecha del pago: <input type="date" id="pagoFechaCobro" value="${new Date().toISOString().slice(0,10)}"></label><div style="margin-top:20px; display:flex; gap:10px;"><button id="guardarPagoCobroBtn" class="secondary">Guardar pago</button><button id="cancelarPagoCobroBtn" class="secondary small">Cancelar</button></div>`;

            const modal = document.getElementById('estadoCobroModal');
            const modalContent = document.getElementById('estadoCobroContent');
            modalContent.innerHTML = html;
            modal.style.display = 'flex';

            document.getElementById('eliminarCobroDesdeModalBtn').addEventListener('click', () => {
                if (confirm('¿Estás seguro de eliminar este cobro y todos sus pagos?')) {
                    cobros = cobros.filter(c => c.id !== cobroId);
                    pagosCobro = pagosCobro.filter(p => p.cobroId !== cobroId);
                    saveData();
                    modal.style.display = 'none';
                    if (document.querySelector('.tab.active').dataset.tab === 'cobros') renderCobros();
                }
            });

            const tipoSelect = document.getElementById('pagoTipoCobro');
            const porcentajeDiv = document.getElementById('porcentajeContainerCobro');
            tipoSelect.addEventListener('change', () => {
                porcentajeDiv.style.display = tipoSelect.value === 'ajeno' ? 'block' : 'none';
            });

            document.getElementById('guardarPagoCobroBtn').addEventListener('click', () => {
                const monto = parseFloat(document.getElementById('pagoMontoCobro').value);
                if (isNaN(monto) || monto <= 0 || monto > cobro.saldoPendiente) {
                    alert('Monto inválido');
                    return;
                }
                const tipo = tipoSelect.value;
                let porcentaje = 100;
                if (tipo === 'ajeno') {
                    porcentaje = parseFloat(document.getElementById('pagoPorcentajeCobro').value);
                    if (isNaN(porcentaje) || porcentaje < 0 || porcentaje > 100) {
                        alert('Porcentaje debe ser entre 0 y 100');
                        return;
                    }
                }
                const metodo = document.getElementById('pagoMetodoCobro').value;
                const fecha = document.getElementById('pagoFechaCobro').value;
                if (!fecha) { alert('Fecha requerida'); return; }

                const nuevoPago = {
                    id: generarIdPagoCobro(),
                    cobroId: cobro.id,
                    fecha: new Date(fecha + 'T12:00:00').toISOString(),
                    monto,
                    tipo,
                    porcentaje: tipo === 'ajeno' ? porcentaje : 100,
                    metodoPago: metodo
                };
                pagosCobro.push(nuevoPago);
                cobro.saldoPendiente = redondearDinero(cobro.saldoPendiente - monto);
                saveData();

                alert('Pago registrado');
                modal.style.display = 'none';
                if (document.querySelector('.tab.active').dataset.tab === 'cobros') renderCobros();
            });

            document.getElementById('cancelarPagoCobroBtn').addEventListener('click', () => { modal.style.display = 'none'; });
            modal.addEventListener('click', (e) => { if (e.target === modal) modal.style.display = 'none'; });
        }

        showTab('venta');
    })();
</script>
</body>
</html>
